data-label="" data-x="1.6878679656440356" data-y="-0.31213203435596426" x="1041.440084473083" y="351.6313656552806" width="108.36863434471957" height="108.36863434471945" fill="rgba(255, 0, 0, 0.25)" stroke="black" stroke-width="0.0018455524627522958"/></g><g><rect data-type="rect" data-label="" data-x="2.112132034355964" data-y="0.11213203435596422" x="1271.3246731123127" y="121.74677701605106" width="108.36863434471957" height="108.36863434471947" fill="rgba(255, 0, 0, 0.25)" stroke="black" stroke-width="0.0018455524627522958"/></g><g><polygon data-type="polygon" data-label="" data-points="1.7585786437626905,-0.382842712474619 2.182842712474619,0.04142135623730944 2.0414213562373096,0.182842712474619 1.617157287525381,-0.24142135623730945" points="1133.9384997519812,444.12978093417854 1363.8230883912106,214.24519229494905 1287.1948921781343,137.61699608187251 1057.3103035389047,367.501584721102" fill="transparent" stroke="black" stroke-width="1.0836863434471946"/></g><circle data-type="circle" data-label="" data-x="-0.012132034355964244" data-y="-0.31213203435596426" cx="174.49100971532758" cy="405.81568282764033" r="54.18431717235973" fill="rgba(255, 0, 0, 0.25)" stroke="black" stroke-width="0.0018455524627522958"/><circle data-type="circle" data-label="" data-x="0.41213203435596424" data-y="0.11213203435596422" cx="404.37559835455716" cy="175.93109418841078" r="54.18431717235973" fill="rgba(255, 0, 0, 0.25)" stroke="black" stroke-width="0.0018455524627522958"/><text data-type="text" data-label="CORE: OPEN OUTLINE KEEPOUT" data-x="0.2" data-y="0.35" x="289.43330403494235" y="47.04396123240676" fill="black" font-size="14.087922464813529" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CORE: OPEN OUTLINE KEEPOUT</text><text data-type="text" data-label="3 SRJ OBSTACLES" data-x="1.05" data-y="0.35" x="750" y="47.04396123240676" fill="black" font-size="14.087922464813529" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3 SRJ OBSTACLES</text><text data-type="text" data-label="INSTALLED AUTOROUTER OUTPUT" data-x="1.9" data-y="0.35" x="1210.5666959650578" y="47.04396123240676" fill="black" font-size="14.087922464813529" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">INSTALLED AUTOROUTER OUTPUT</text><text data-type="text" data-label="0/441 points uncovered on 4 layers" data-x="1.9" data-y="0.3" x="1210.5666959650578" y="74.13611981858662" fill="black" font-size="11.920549777919138" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0/441 points uncovered on 4 layers</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="500" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1500" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1500');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '500');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":541.8431717235973,"c":0,"e":181.0646696902229,"b":0,"d":-541.8431717235973,"f":236.6890713356658};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
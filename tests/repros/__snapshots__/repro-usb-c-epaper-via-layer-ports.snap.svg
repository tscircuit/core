        <text x="350" y="746" fill="#f4f4f4">inner1</text>
        <text x="350" y="767" fill="#4ade80">port present</text><rect x="460" y="724" width="180" height="54" rx="6" fill="#090909" stroke="#4ade80"/>
        <text x="550" y="746" fill="#f4f4f4">inner2</text>
        <text x="550" y="767" fill="#4ade80">port present</text><rect x="660" y="724" width="180" height="54" rx="6" fill="#090909" stroke="#4ade80"/>
        <text x="750" y="746" fill="#f4f4f4">bottom</text>
        <text x="750" y="767" fill="#4ade80">port present</text></g>
      <text x="450" y="808" font-size="16" fill="#4ade80">inner2 port exists: DISPLAY_BUSY can join DISPLAY_INTERCONNECT.</text>
      <text x="450" y="842" font-size="14">Board source: rushabhcodes/usb-c-e-paper-display @ 1a7ebab; autorouting disabled.</text>

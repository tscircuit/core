        <text x="240" y="110">Source policy</text>
        <text x="430" y="110">SRJ allowViaInPad</text>
        <text x="680" y="110">Router flag (?? false)</text>
      </g>
      
        <line x1="28" y1="126" x2="872" y2="126" stroke="#374151" />
        <g font-size="18">
          <text x="28" y="159">PMP22650</text>

rial, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central" class="pcb-note-text" data-type="pcb_note_text" data-pcb-note-text-id="pcb_note_text_0" data-pcb-layer="overlay">BUG: THERMAL VIAS ARE TREATED AS UNCONNECTED</text><text x="10" y="20" fill="red" font-family="monospace" font-size="12px" data-type="pcb_error_text_overlay" data-layer="global"><tspan x="10" dy="0">Via at (-0.75mm, -0.50mm) is inside SMD pad U1.THERMAL_PAD at (0.00mm, 0.00mm)</tspan><tspan x="10" dy="1.2em">Via at (0.75mm, -0.50mm) is inside SMD pad U1.THERMAL_PAD at (0.00mm, 0.00mm)</tspan><tspan x="10" dy="1.2em">Via at (-0.75mm, 0.50mm) is inside SMD pad U1.THERMAL_PAD at (0.00mm, 0.00mm)</tspan><tspan x="10" dy="1.2em">Via at (0.75mm, 0.50mm) is inside SMD pad U1.THERMAL_PAD at (0.00mm, 0.00mm)</tspan><tspan x="10" dy="1.2em"><![CDATA[Via pcb_via[#pcb_via_0] and pad pcb_port[.U1 > .THERMAL_PAD] are too close (clearance: 0mm, minimum: 0.1mm)]]></tspan><tspan x="10" dy="1.2em"><![CDATA[Via pcb_via[#pcb_via_1] and pad pcb_port[.U1 > .THERMAL_PAD] are too close (clearance: 0mm, minimum: 0.1mm)]]></tspan><tspan x="10" dy="1.2em"><![CDATA[Via pcb_via[#pcb_via_2] and pad pcb_port[.U1 > .THERMAL_PAD] are too close (clearance: 0mm, minimum: 0.1mm)]]></tspan><tspan x="10" dy="1.2em"><![CDATA[Via pcb_via[#pcb_via_3] and pad pcb_port[.U1 > .THERMAL_PAD] are too close (clearance: 0mm, minimum: 0.1mm)]]></tspan></text></svg>
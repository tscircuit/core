858066 61.31417322834022,427.1518110236211 77.51338582675089,460 97.860787401587,490.45385826771235 122.01023622046341,517.9897637795293 149.5472440944868,542.1392125984203 180,562.4877165354337 212.84818897637888,578.6869291338517 247.53070866141934,590.45905511811 283.4522834645468,597.604566929127 319.9999999999709,599.9999999999927 356.5477165354241,597.604566929127 392.46929133855156,590.45905511811 427.151811023592,578.6869291338517 459.9999999999709,562.4877165354337 490.4527559054841,542.1392125984203 517.9897637795075,517.9897637795293 542.139212598413,490.45385826771235 562.4877165354264,460 578.6858267716307,427.1518110236211 590.4590551180881,392.46929133858066 597.6045669291343,356.5477165354314 600,320" fill="none" stroke="#8b5cf6" stroke-width="27.99999999999946"/></g><g id="crosshair__stack1" style="display: none"><line id="crosshair-h__stack1" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v__stack1" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates__stack1" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":1102.3622047243882,"c":0,"e":-230415.22913385383,"b":0,"d":-1102.3622047243882,"f":52436.170708660415};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>

  <text x="474" y="203" text-anchor="middle" class="label" style="fill:#b91c1c">Wrong endpoint</text>
  <path d="M474 216 L474 276" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="149" y="399" text-anchor="middle" class="label">D_VM_TVS.1</text>
  <text x="149" y="424" text-anchor="middle" class="label" style="fill:#2563eb">VM (cathode)</text>
  <text x="474" y="399" text-anchor="middle" class="label">D_VM_TVS.2</text>
  <text x="474" y="424" text-anchor="middle" class="label" style="fill:#ea580c">GND (anode)</text>
  <text x="648" y="450" text-anchor="middle" class="small">C_VM_HF1.1</text>
  <text x="648" y="472" text-anchor="middle" class="label" style="fill:#2563eb">VM</text>
  <text x="48" y="491" class="small">The bottom copper crosses the TVS gap and reaches its GND pad.</text>
  <line x1="48" y1="527" x2="86" y2="527" stroke="#2563eb" stroke-width="7"/>
  <text x="99" y="532" class="small">Bottom copper</text>
  <line x1="285" y1="527" x2="323" y2="527" stroke="#2563eb" opacity="0.4" stroke-width="7" stroke-dasharray="6 5"/>
  <text x="336" y="532" class="small">Top copper (overlay)</text>
  <text x="792" y="137" font-size="20" font-weight="700">Intended source connectivity</text>
  <circle cx="838" cy="183" r="10" fill="#2563eb"/>
  <text x="859" y="190" class="label">VM</text>
  <circle cx="1035" cy="183" r="10" fill="#ea580c"/>
  <text x="1056" y="190" class="label">GND</text>
  <text x="792" y="231" class="small">These remain two separate intended nets.</text>
  <line x1="792" y1="254" x2="1152" y2="254" stroke="#cbd5e1"/>
  <text x="792" y="291" font-size="19" font-weight="700">Core routed-trace attribution</text>
  <rect x="792" y="314" width="360" height="66" rx="8" fill="#e2e8f0"/>
  <text x="810" y="355" font-size="21" font-weight="700">ACCEPTED</text>
  <text x="792" y="415" font-size="17" font-weight="700">Expected: REJECTED</text>
  <text x="792" y="452" class="small">Source owner: VM. Declared end pad: GND.</text>
  <text x="792" y="511" class="small">Physical contact must not redefine intent.</text>
  <text x="28" y="596" class="small">From NEMA8 v1.0.48. Both tests still load all 2,469 original Circuit JSON records.</text>
  <text x="28" y="620" class="small">The fix changes the software result shown at right; it does not alter the copper pictured at left.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <title>NEMA8: a VM-owned route ends on the grounded TVS pad</title>
  <style>text { font-family: Arial, sans-serif; fill: #172033; } .small { font-size: 15px; } .label { font-size: 18px; font-weight: 600; }</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b91c1c"/></marker></defs>
  <rect width="1200" height="640" fill="#f1f5f9"/>
  <text x="28" y="43" font-size="25" font-weight="700">NEMA8: a VM-owned route ends on the grounded TVS pad</text>
  <text x="28" y="73" class="small">Actual pads and copper from the full board capture. Unrelated components are hidden for clarity.</text>
  <rect x="24" y="98" width="720" height="460" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="768" y="98" width="408" height="460" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="48" y="134" font-size="20" font-weight="700">The conflicting copper (unchanged)</text>
  <text x="48" y="160" class="small">Blue = VM source intent. Orange = GND source intent.</text>

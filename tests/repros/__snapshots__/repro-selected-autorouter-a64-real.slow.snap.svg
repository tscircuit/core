99802755" r="55.22682445759354" fill="#fecaca" stroke="#991b1b" stroke-width="0.0036214285714285814"/><circle data-type="circle" data-label="" data-x="132.404" data-y="-85.4" cx="601.1045364891397" cy="659.1715976331325" r="45.14792899408272" fill="#ddd6fe" stroke="#5b21b6" stroke-width="0.0036214285714285814"/><circle data-type="circle" data-label="" data-x="132.404" data-y="-85.4" cx="601.1045364891397" cy="659.1715976331325" r="27.61341222879677" fill="white" stroke="#111827" stroke-width="0.0036214285714285814"/><circle data-type="circle" data-label="" data-x="130.8" data-y="-85" cx="158.185404339245" cy="548.7179487179455" r="45.14792899408272" fill="#ddd6fe" stroke="#5b21b6" stroke-width="0.0036214285714285814"/><circle data-type="circle" data-label="" data-x="130.8" data-y="-85" cx="158.185404339245" cy="548.7179487179455" r="27.61341222879677" fill="white" stroke="#111827" stroke-width="0.0036214285714285814"/><text data-type="text" data-label="F3" data-x="131" data-y="-85.11" x="213.41222879683482" y="579.0927021696225" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">F3</text><text data-type="text" data-label="F2" data-x="131" data-y="-84.30999999999999" x="213.41222879683482" y="358.185404339245" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">F2</text><text data-type="text" data-label="E3" data-x="131.8" data-y="-85.11" x="434.3195266272087" y="579.0927021696225" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">E3</text><text data-type="text" data-label="E2" data-x="131.8" data-y="-84.30999999999999" x="434.3195266272087" y="358.185404339245" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">E2</text><text data-type="text" data-label="D3" data-x="132.6" data-y="-85.11" x="655.2268244575753" y="579.0927021696225" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D3</text><text data-type="text" data-label="D2" data-x="132.6" data-y="-84.30999999999999" x="655.2268244575753" y="358.185404339245" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D2</text><text data-type="text" data-label="C3" data-x="133.4" data-y="-85.11" x="876.1341222879564" y="579.0927021696225" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C3</text><text data-type="text" data-label="C2" data-x="133.4" data-y="-84.30999999999999" x="876.1341222879564" y="358.185404339245" fill="black" font-size="24.85207100591709" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C2</text><text data-type="text" data-label="A64 repair replay: 11 signals / 2122 pads / 6 layers" data-x="132.4" data-y="-83.75" x="599.9999999999854" y="203.55029585798547" fill="black" font-size="35.8974358974358" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">A64 repair replay: 11 signals / 2122 pads / 6 layers</text><text data-type="text" data-label="Whole-sample drill/pad DRC findings: 1" data-x="132.4" data-y="-83.98" x="599.9999999999854" y="267.0611439842178" fill="black" font-size="35.8974358974358" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Whole-sample drill/pad DRC findings: 1</text><text data-type="text" data-label="Source drill: 0.2 mm. Annular-pad clearance is checked separately." data-x="132.4" data-y="-84.19" x="599.9999999999854" y="325.04930966468964" fill="black" font-size="27.61341222879677" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Source drill: 0.2 mm. Annular-pad clearance is checked separately.</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="900" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '900');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":276.13412228796767,"c":0,"e":-35960.15779092693,"b":0,"d":-276.13412228796767,"f":-22922.682445759307};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
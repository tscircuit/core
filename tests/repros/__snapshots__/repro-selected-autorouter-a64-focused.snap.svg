<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="131.8,-85.4 132.04993757802748,-85.4" data-type="line" data-label="" points="430.30303030302457,664.242424242424 500.9924463107891,664.242424242424" fill="none" stroke="#dc2626" stroke-width="30.14949494949489"/></g><g><polyline data-points="132.04993757802748,-85.4 132.08,-85.4" data-type="line" data-label="" points="500.9924463107891,664.242424242424 509.49494949493965,664.242424242424" fill="none" stroke="#dc2626" stroke-width="30.14949494949489"/></g><g><polyline data-points="132.08,-85.4 132.16,-85.4" data-type="line" data-label="" points="509.49494949493965,664.242424242424 532.1212121212011,664.242424242424" fill="none" stroke="#dc2626" stroke-width="30.14949494949489"/></g><g><polyline data-points="132.16,-85.4 132.24,-85.4" data-type="line" data-label="" points="532.1212121212011,664.242424242424 554.7474747474698,664.242424242424" fill="none" stroke="#dc2626" stroke-width="30.14949494949489"/></g><g><polyline data-points="132.24,-85.4 132.404,-85.4" data-type="line" data-label="" points="554.7474747474698,664.242424242424 601.1313131313,664.242424242424" fill="none" stroke="#dc2626" stroke-width="30.14949494949489"/></g><g><polyline data-points="132.404,-85.4 132.72,-85.4" data-type="line" data-label="" points="601.1313131313,664.242424242424 690.5050505050385,664.242424242424" fill="none" stroke="#2563eb" stroke-width="30.14949494949489" stroke-dasharray="0.035 0.035"/></g><g><polyline data-points="132.72,-85.4 132.96,-85.4" data-type="line" data-label="" points="690.5050505050385,664.242424242424 758.3838383838302,664.242424242424" fill="none" stroke="#2563eb" stroke-width="30.14949494949489" stroke-dasharray="0.035 0.035"/></g><g><polyline data-points="132.96,-85.4 133.2,-85.4" data-type="line" data-label="" points="758.3838383838302,664.242424242424 826.2626262626145,664.242424242424" fill="none" stroke="#2563eb" stroke-width="30.14949494949489" stroke-dasharray="0.035 0.035"/></g><circle data-type="circle" data-label="" data-x="131.8" data-y="-85.4" cx="430.30303030302457" cy="664.242424242424" r="56.56565656565646" fill="#fecaca" stroke="#991b1b" stroke-width="0.0035357142857142926"/><circle data-type="circle" data-label="" data-x="132.6" data-y="-85.4" cx="656.5656565656463" cy="664.242424242424" r="56.56565656565646" fill="#fecaca" stroke="#991b1b" stroke-width="0.0035357142857142926"/><circle data-type="circle" data-label="" data-x="132.404" data-y="-85.4" cx="601.1313131313" cy="664.242424242424" r="46.24242424242416" fill="#ddd6fe" stroke="#5b21b6" stroke-width="0.0035357142857142926"/><circle data-type="circle" data-label="" data-x="132.404" data-y="-85.4" cx="601.1313131313" cy="664.242424242424" r="28.28282828282823" fill="white" stroke="#111827" stroke-width="0.0035357142857142926"/><text data-type="text" data-label="E3" data-x="131.8" data-y="-85.11" x="430.30303030302457" y="582.222222222219" fill="black" font-size="25.454545454545404" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">E3</text><text data-type="text" data-label="D3" data-x="132.6" data-y="-85.11" x="656.5656565656463" y="582.222222222219" fill="black" font-size="25.454545454545404" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">D3</text><text data-type="text" data-label="A64 repair replay: 1 signals / 2 pads / 6 layers" data-x="132.4" data-y="-83.75" x="599.9999999999927" y="197.57575757575614" fill="black" font-size="36.7676767676767" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">A64 repair replay: 1 signals / 2 pads / 6 layers</text><text data-type="text" data-label="Whole-sample drill/pad DRC findings: 1" data-x="132.4" data-y="-83.98" x="599.9999999999927" y="262.62626262626145" fill="black" font-size="36.7676767676767" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Whole-sample drill/pad DRC findings: 1</text><text data-type="text" data-label="Source drill: 0.2 mm. Annular-pad clearance is checked separately." data-x="132.4" data-y="-84.19" x="599.9999999999927" y="322.02020202019776" fill="black" font-size="28.28282828282823" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Source drill: 0.2 mm. Annular-pad clearance is checked separately.</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="900" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '900');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":282.8282828282823,"c":0,"e":-36846.464646464585,"b":0,"d":-282.8282828282823,"f":-23489.292929292886};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
<svg width="800" height="700" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><circle data-type="circle" data-label="" data-x="1.989999999999997" data-y="16.049999999999997" cx="534.3333333333317" cy="206.36666666666952" r="72.33333333333316" fill="#fee2e2" stroke="#b91c1c" stroke-width="0.002419354838709683"/><circle data-type="circle" data-label="" data-x="1.989999999999997" data-y="15.399999999999997" cx="534.3333333333317" cy="475.0333333333356" r="72.33333333333316" fill="#fee2e2" stroke="#b91c1c" stroke-width="0.002419354838709683"/><circle data-type="circle" data-label="" data-x="1.3399999999999972" data-y="16.049999999999997" cx="265.6666666666657" cy="206.36666666666952" r="72.33333333333316" fill="#fee2e2" stroke="#b91c1c" stroke-width="0.002419354838709683"/><circle data-type="circle" data-label="" data-x="1.3399999999999972" data-y="15.399999999999997" cx="265.6666666666657" cy="475.0333333333356" r="72.33333333333316" fill="#fee2e2" stroke="#b91c1c" stroke-width="0.002419354838709683"/><circle data-type="circle" data-label="" data-x="1.6650000000000003" data-y="15.725" cx="400" cy="340.70000000000164" r="72.33333333333316" fill="#6366f1" stroke="#312e81" stroke-width="0.002419354838709683"/><circle data-type="circle" data-label="" data-x="1.6650000000000003" data-y="15.725" cx="400" cy="340.70000000000164" r="30.999999999999925" fill="white" stroke="#312e81" stroke-width="0.002419354838709683"/><text data-type="text" data-label="P2" data-x="1.989999999999997" data-y="16.049999999999997" x="534.3333333333317" y="206.36666666666952" fill="#172554" font-size="22.73333333333328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">P2</text><text data-type="text" data-label="P3" data-x="1.989999999999997" data-y="15.399999999999997" x="534.3333333333317" y="475.0333333333356" fill="#172554" font-size="22.73333333333328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">P3</text><text data-type="text" data-label="R2" data-x="1.3399999999999972" data-y="16.049999999999997" x="265.6666666666657" y="206.36666666666952" fill="#172554" font-size="22.73333333333328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R2</text><text data-type="text" data-label="R3" data-x="1.3399999999999972" data-y="15.399999999999997" x="265.6666666666657" y="475.0333333333356" fill="#172554" font-size="22.73333333333328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R3</text><text data-type="text" data-label="H616 DDR: fixed data via beside U1" data-x="1.6650000000000003" data-y="16.42" x="400" y="53.4333333333343" fill="#172554" font-size="26.866666666666603" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">H616 DDR: fixed data via beside U1</text><text data-type="text" data-label="Gap to R3: 0.110 mm (minimum 0.100 mm)" data-x="1.6650000000000003" data-y="15.12" x="400" y="590.7666666666673" fill="#166534" font-size="22.73333333333328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gap to R3: 0.110 mm (minimum 0.100 mm)</text><text data-type="text" data-label="Copper 0.350 mm / drill 0.150 mm" data-x="1.6650000000000003" data-y="14.98" x="400" y="648.6333333333332" fill="#172554" font-size="22.73333333333328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Copper 0.350 mm / drill 0.150 mm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":413.33333333333235,"c":0,"e":-288.19999999999845,"b":0,"d":-413.33333333333235,"f":6840.366666666652};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
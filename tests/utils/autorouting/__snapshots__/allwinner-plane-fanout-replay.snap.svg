7.73851590106005" r="13.144876325088335" fill="blue" stroke="none" stroke-width="0.022822580645161298"/><circle data-type="circle" data-label="" data-x="-47.650000000000006" data-y="38" cx="313.46289752650137" cy="135.30035335689058" r="13.144876325088335" fill="blue" stroke="none" stroke-width="0.022822580645161298"/><circle data-type="circle" data-label="" data-x="-43" data-y="29.5" cx="517.2084805653708" cy="507.73851590106005" r="13.144876325088335" fill="blue" stroke="none" stroke-width="0.022822580645161298"/><circle data-type="circle" data-label="" data-x="-49.349999999999994" data-y="26.5" cx="238.97526501766788" cy="639.1872791519434" r="13.144876325088335" fill="blue" stroke="none" stroke-width="0.022822580645161298"/><text data-type="text" data-label="Allwinner T113-S3 USB UART: 11 GND / V3V3 plane drops" data-x="-45" data-y="40" x="429.5759717314486" y="47.66784452296838" fill="#111" font-size="15.33568904593639" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Allwinner T113-S3 USB UART: 11 GND / V3V3 plane drops</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":43.816254416961115,"c":0,"e":2401.307420494699,"b":0,"d":-43.816254416961115,"f":1800.3180212014129};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
087c91" stroke="black" stroke-width="0.022107142857142856"/><circle data-type="circle" data-label="" data-x="-4" data-y="-0.5" cx="85.23424878836832" cy="339.78998384491115" r="7.237479806138935" fill="#087c91" stroke="black" stroke-width="0.022107142857142856"/><circle data-type="circle" data-label="" data-x="4" data-y="-0.5" cx="447.10823909531507" cy="339.78998384491115" r="7.237479806138935" fill="#087c91" stroke="black" stroke-width="0.022107142857142856"/><circle data-type="circle" data-label="" data-x="-4" data-y="-1.5" cx="85.23424878836832" cy="385.0242326332795" r="7.237479806138935" fill="#b1b7bf" stroke="black" stroke-width="0.022107142857142856"/><circle data-type="circle" data-label="" data-x="4" data-y="-1.5" cx="447.10823909531507" cy="385.0242326332795" r="7.237479806138935" fill="#b1b7bf" stroke="black" stroke-width="0.022107142857142856"/><circle data-type="circle" data-label="" data-x="-4" data-y="-2.5" cx="85.23424878836832" cy="430.25848142164784" r="7.237479806138935" fill="#b1b7bf" stroke="black" stroke-width="0.022107142857142856"/><circle data-type="circle" data-label="" data-x="4" data-y="-2.5" cx="447.10823909531507" cy="430.25848142164784" r="7.237479806138935" fill="#b1b7bf" stroke="black" stroke-width="0.022107142857142856"/><text data-type="text" data-label="Phase 1: preserve future terminal access" data-x="-5" data-y="5.2" x="39.99999999999997" y="81.95476575121162" fill="black" font-size="20.355411954765753" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Phase 1: preserve future terminal access</text><text data-type="text" data-label="Active: 1; pending: 2" data-x="-5" data-y="4.5" x="39.99999999999997" y="113.61873990306947" fill="black" font-size="15.831987075928918" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Active: 1; pending: 2</text><text data-type="text" data-label="Red: current request; teal: future request; grey: excluded" data-x="-5" data-y="3.9" x="39.99999999999997" y="140.75928917609048" fill="black" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Red: current request; teal: future request; grey: excluded</text><text data-type="text" data-label="PRIOR" data-x="4.5" data-y="2.5" x="469.7253634894992" y="204.08723747980616" fill="#b1b7bf" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">PRIOR</text><text data-type="text" data-label="BYTE0" data-x="4.5" data-y="1.5" x="469.7253634894992" y="249.3214862681745" fill="#b23a24" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">BYTE0</text><text data-type="text" data-label="BYTE1" data-x="4.5" data-y="0.5" x="469.7253634894992" y="294.55573505654286" fill="#087c91" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">BYTE1</text><text data-type="text" data-label="ADDRESS" data-x="4.5" data-y="-0.5" x="469.7253634894992" y="339.78998384491115" fill="#087c91" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">ADDRESS</text><text data-type="text" data-label="REROUTE_ONLY" data-x="4.5" data-y="-1.5" x="469.7253634894992" y="385.0242326332795" fill="#b1b7bf" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">REROUTE_ONLY</text><text data-type="text" data-label="TEST_POINTS_ONLY" data-x="4.5" data-y="-2.5" x="469.7253634894992" y="430.25848142164784" fill="#b1b7bf" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">TEST_POINTS_ONLY</text><text data-type="text" data-label="Spare pad has no routing request: excluded" data-x="-5" data-y="-4.2" x="39.99999999999997" y="507.15670436187406" fill="black" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Spare pad has no routing request: excluded</text><text data-type="text" data-label="Future BYTE1: 0.30 mm wire; inner1/inner2; 0.24 mm pad clearance" data-x="-5" data-y="-4.8" x="39.99999999999997" y="534.297253634895" fill="black" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Future BYTE1: 0.30 mm wire; inner1/inner2; 0.24 mm pad clearance</text><text data-type="text" data-label="Dashed lines show native routing intent, not solved traces" data-x="-5" data-y="-5.4" x="39.99999999999997" y="561.4378029079161" fill="black" font-size="13.570274636510502" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Dashed lines show native routing intent, not solved traces</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":45.23424878836834,"c":0,"e":266.1712439418417,"b":0,"d":-45.23424878836834,"f":317.172859450727};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
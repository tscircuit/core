name: Export current native DDR failure inputs
on:
  push:
    branches: [analysis/ddr-3276-completion-20261122]
    paths: [.github/workflows/ddr-3276-export-inputs.yml]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        circuit: [a64, stmp157]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native3276-routing-diagnostic-${{ matrix.circuit }}
          run-id: 44992663008
          repository: tscircuit/core
          github-token: ${{ github.token }}
          path: captured
      - name: Export actual routing inputs and failed node requests
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          python - <<'PY'
          import json,pathlib,gzip,base64,hashlib,os
          root=pathlib.Path('captured')
          for path in root.rglob('*Pipeline9RegionalFallbackSolver.json'):
            d=json.load(open(path));params=d.get('params')
            if params:
              raw=json.dumps(params).encode();packed=gzip.compress(raw);encoded=base64.b64encode(packed).decode();stem=os.environ['CIRCUIT']+'-'+path.name
              print('DDR_INPUT_META='+json.dumps({'name':stem,'bytes':len(raw),'gzipBytes':len(packed),'sha256':hashlib.sha256(raw).hexdigest()}))
              for i in range(0,len(encoded),12000):print('DDR_INPUT_GZIP='+json.dumps({'name':stem,'part':i//12000,'base64':encoded[i:i+12000]}))
          PY

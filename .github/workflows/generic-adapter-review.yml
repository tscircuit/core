name: Generate adapter snapshots with current endpoint roll
on:
  push:
    branches: [codex/review-generic-adapters-roll-20261006]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun scripts/prepare-bullet-preview-dependencies.ts
        env:
          VERCEL_ENV: preview
      - run: bun install
      - run: bun test tests/assembly/assembly-cable-adapter.test.tsx tests/assembly/assembly-cable-bldc-adapter.test.tsx tests/assembly/assembly-cable-bullet.test.tsx tests/assembly/assembly-cable-bullet-group.test.tsx tests/assembly/assembly-cable-motor-controller.test.tsx --timeout 30000
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: generic-adapter-review
          path: tests/assembly/__snapshots__/assembly-cable-*.snap.png
          if-no-files-found: error

name: Public Core bus snapshot inspection
on:
  workflow_dispatch:
    inputs:
      base_ref:
        type: string
        required: true
      head_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && inputs.base_ref || inputs.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --backend=copyfile
      - name: Check explicit clock endpoint metadata
        if: matrix.revision == 'head'
        run: bun test tests/components/primitive-components/bus/source-bus-timing-reference.test.tsx --timeout 30000
      - name: Render existing public AM3352 test after its quality gates
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/features/autorouter-bus-lanes-am3352.test.tsx --timeout 900000
      - name: Inspect only the three approved public Core test SVGs
        if: always()
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for layer in ['inner1', 'inner2', 'bottom']:
              path = Path(f'tests/features/__snapshots__/autorouter-bus-lanes-am3352-{layer}-pcb.snap.svg')
              if not path.exists(): continue
              actual = path.read_bytes()
              expected = subprocess.check_output(['git', 'show', 'HEAD:' + str(path)])
              old, new = list(ET.fromstring(expected).iter()), list(ET.fromstring(actual).iter())
              changes = []
              for index, (left, right) in enumerate(zip(old, new)):
                  if left.attrib != right.attrib or left.text != right.text:
                      changes.append({'index':index, 'tag':left.tag, 'before':left.attrib, 'after':right.attrib, 'textBefore':left.text, 'textAfter':right.text})
              print('PUBLIC_CORE_SVG_DIFF=' + json.dumps({'revision':os.environ['REVISION'], 'layer':layer, 'same':expected==actual, 'counts':[len(old),len(new)], 'changes':changes}))
              print('PUBLIC_CORE_SVG=' + json.dumps({'revision':os.environ['REVISION'], 'path':str(path), 'sha256':hashlib.sha256(actual).hexdigest(), 'gzipBase64':base64.b64encode(gzip.compress(actual)).decode()}))
          PY

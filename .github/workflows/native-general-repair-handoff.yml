name: Test saved trace handoff to existing general repair
on:
  push:
    branches: [analysis/core-native-complete-ci]
    paths: [.github/workflows/native-general-repair-handoff.yml]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: existing-native-recovery-tiny-source
          path: tiny-code
          run-id: 44727093808
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: e55e16da20139f673c4689c26552eb131e72da5b
          path: autorouter
          persist-credentials: false
      - name: Install the native autorouter source
        working-directory: autorouter
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
          d['overrides']['tscircuit']='0.0.3250'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Install the tested dependency merge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['core.ts','selective-rerip-tiny-hyper-graph-solver.ts']:
            p=Path('autorouter/node_modules/tiny-hypergraph/lib',name)
            temporary=p.with_suffix('.analysis.ts')
            temporary.write_bytes(Path('tiny-code',name).read_bytes())
            temporary.replace(p)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('autorouter/lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts')
          s=p.read_text()
          old=json.loads("\"      Pipeline4HighDensityRepairSolver,\\n      (cms) => [\\n        {\\n          nodeWithPortPoints: cms.highDensityNodePortPoints ?? [],\"")
          new=json.loads("\"      Pipeline4HighDensityRepairSolver,\\n      (cms) => [\\n        {\\n          nodeWithPortPoints: cms.highDensityNodePortPoints ?? [],\\n          fixedHdRoutes:\\n            cms.highDensityRouteSolver!.getUpdatedFixedHdRoutes(),\"")
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Build and package the exact analysis candidate
        working-directory: autorouter
        run: |
          bun run build
          mkdir ../candidate
          npm pack --pack-destination ../candidate
          mv ../candidate/*.tgz ../candidate/autorouter.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: native-general-repair-code
          path: candidate/autorouter.tgz
  original-assertions:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: e55e16da20139f673c4689c26552eb131e72da5b
          path: autorouter
          persist-credentials: false
      - name: Install the same autorouter test environment
        working-directory: autorouter
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
          d['overrides']['tscircuit']='0.0.3250'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - uses: actions/download-artifact@v4
        with:
          name: existing-native-recovery-tiny-source
          path: tiny-code
          run-id: 44727093808
          github-token: ${{ github.token }}
      - name: Install the tested dependency merge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['core.ts','selective-rerip-tiny-hyper-graph-solver.ts']:
            p=Path('autorouter/node_modules/tiny-hypergraph/lib',name)
            temporary=p.with_suffix('.analysis.ts')
            temporary.write_bytes(Path('tiny-code',name).read_bytes())
            temporary.replace(p)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('autorouter/lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts')
          s=p.read_text()
          old=json.loads("\"      Pipeline4HighDensityRepairSolver,\\n      (cms) => [\\n        {\\n          nodeWithPortPoints: cms.highDensityNodePortPoints ?? [],\"")
          new=json.loads("\"      Pipeline4HighDensityRepairSolver,\\n      (cms) => [\\n        {\\n          nodeWithPortPoints: cms.highDensityNodePortPoints ?? [],\\n          fixedHdRoutes:\\n            cms.highDensityRouteSolver!.getUpdatedFixedHdRoutes(),\"")
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Preserve all original autorouter physical assertions
        working-directory: autorouter
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@v4
        with:
          name: native-general-repair-code
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 7d28fe0bdc6c57b828e54c6cd8e32bcc13d2ee1e
          path: core
          persist-credentials: false
      - name: Install the exact native routing candidate
        working-directory: core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['devDependencies']['@tscircuit/capacity-autorouter']='file:../candidate/autorouter.tgz'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
          d['overrides']['tscircuit']='0.0.3250'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Preserve all original Core physical assertions
        working-directory: core
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repros/repro-fanout-routed-layer-impact.test.tsx tests/repros/repro-autorouter-clearance-board.test.tsx
  benchmark:
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: native-general-repair-code
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 7d28fe0bdc6c57b828e54c6cd8e32bcc13d2ee1e
          path: core
          persist-credentials: false
      - name: Install the exact native routing candidate
        working-directory: core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['devDependencies']['@tscircuit/capacity-autorouter']='file:../candidate/autorouter.tgz'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
          d['overrides']['tscircuit']='0.0.3250'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Observe stage counters without changing the circuit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('core/node_modules/@tscircuit/core-ddr-benchmark/scripts/worker.tsx')
          s=p.read_text()
          anchor='const { RootCircuit } = await import(join(corePath, "index.ts"))'
          assert s.count(anchor)==1
          diagnostic=json.loads("\"\\nconst routerRoot = join(corePath, \\\"node_modules/@tscircuit/capacity-autorouter\\\")\\nconst routerPackage = JSON.parse(readFileSync(join(routerRoot, \\\"package.json\\\"), \\\"utf8\\\"))\\nconst routerModule = await import(join(routerRoot, routerPackage.main))\\nconst Pipeline = routerModule.AutoroutingPipelineSolver9_PreloadedTraceGraph\\nif (!Pipeline) throw new Error(\\\"Diagnostic pipeline export is missing\\\")\\nconst originalPipelineStep = Pipeline.prototype._step\\nconst loggedSolvers = new WeakSet<object>()\\nPipeline.prototype._step = function () {\\n  const phase = this.getCurrentPhase()\\n  const active = this[phase]\\n  const result = originalPipelineStep.call(this)\\n  if (active && (active.solved || active.failed) && !loggedSolvers.has(active)) {\\n    loggedSolvers.add(active)\\n    const metrics: Record<string, number | boolean | Record<string, number>> = {}\\n    for (const [key, value] of Object.entries(active.stats ?? {})) {\\n      if (typeof value === \\\"number\\\" || typeof value === \\\"boolean\\\") metrics[key] = value\\n    }\\n    const issueCounts = active.stats?.initialJointDrcIssueCountByType\\n    if (issueCounts) {\\n      const counts: Record<string, number> = {}\\n      for (const key of [\\\"pcb_trace_error\\\", \\\"pcb_pad_trace_clearance_error\\\", \\\"pcb_via_trace_clearance_error\\\", \\\"pcb_via_clearance_error\\\", \\\"pcb_pad_pad_clearance_error\\\"]) {\\n        if (typeof issueCounts[key] === \\\"number\\\") counts[key] = issueCounts[key]\\n      }\\n      metrics.initialIssuesByType = counts\\n    }\\n    if (phase === \\\"portPointPathingSolver\\\") {\\n      const p = active.getSolveGraphBenchmarkMetrics()\\n      metrics.nodePfSum = p.downstreamNodePfSum\\n      metrics.nodePfMax = p.downstreamNodePfMax\\n      metrics.recoveryEvaluated = p.blockerRecoveryCandidateEvaluated\\n    }\\n    console.log(\\\"NATIVE_STAGE_AGGREGATE\\\", JSON.stringify({\\n      phase, solved: active.solved, failed: active.failed,\\n      iterations: active.iterations, stats: metrics\\n    }))\\n  }\\n  return result\\n}\\n\"")
          temporary=p.with_suffix('.analysis.tsx')
          temporary.write_text(s.replace(anchor,diagnostic+'\n'+anchor))
          temporary.replace(p)
          PY
      - name: Measure the unchanged OrangeCrab and H616 circuits
        run: |
          benchmark="$GITHUB_WORKSPACE/core/node_modules/@tscircuit/core-ddr-benchmark/scripts"
          bun "$benchmark/run.ts" --core "$GITHUB_WORKSPACE/core" --out "$GITHUB_WORKSPACE/results/recovery" --timeout 120 --circuit orangecrab --circuit h616
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('results').rglob('render.log'):
            for line in p.read_text(errors='replace').splitlines():
              if line.startswith('NATIVE_STAGE_AGGREGATE '):
                print(line)
          d=json.loads(Path('results/recovery/results.json').read_text())
          for row in d['cases']:
            a=row.get('assessment') or {}
            print('CORE_DDR_AGGREGATE',json.dumps({'circuit':row['circuit'],'status':row['status'],'wallMs':row['wallMs'],'peakRssMb':row['peakRssMb'],'connectedNets':a.get('connectedNets'),'findings':a.get('findings')}))
          print('CORE_DDR_ACCEPTANCE',json.dumps({'passed':sum(r['status']=='passed' for r in d['cases']),'total':len(d['cases'])}))
          PY

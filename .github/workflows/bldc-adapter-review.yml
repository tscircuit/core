name: Generate BLDC adapter review snapshot
on:
  push:
    branches: [codex/review-bldc-adapter-20261006]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun scripts/prepare-bullet-preview-dependencies.ts
        env:
          GITHUB_EVENT_NAME: pull_request
      - run: bun install
      - run: bun test tests/assembly/assembly-cable-bldc-adapter.test.tsx --timeout 30000
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: bldc-adapter-review
          path: tests/assembly/__snapshots__/assembly-cable-bldc-adapter-annotated.snap.png
          if-no-files-found: error

name: Inspect native routing handoff consistency
on:
  push:
    branches: [analysis/native-copper-stack-check]
    paths: [.github/workflows/native-copper-stack-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb016342151867dcf6947ebae773476a8ae5074a
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 36f05d7fa6cb48f9cf1bf1fc145cab33e54215af
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
        working-directory: autorouter
      - name: Retain copper-only guidance and log reference counts
        working-directory: autorouter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/solvers/HyperHighDensitySolver/createIntraNodeSegmentValidator.ts")
          s=p.read_text()
          a=s.index("    for (const obstacle of obstacles)")
          b=s.rfind("    return true")
          p.write_text(s[:a]+s[b:])
          p=Path("lib/index.ts")
          p.write_text(p.read_text()+'\nexport { getConnectivityMapFromSimpleRouteJson as getNativeInputConnectivityForAnalysis } from "./utils/getConnectivityMapFromSimpleRouteJson"\n')
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts")
          s=p.read_text()
          a=s.index("  getOutputSimplifiedPcbTraces():")
          b=s.index("  getOutputSimpleRouteJson():",a)
          method=s[a:b].replace("    return [","    const output = [",1)
          marker="    ]\n  }"
          extra='''    ]
              const evaluate = createPipeline9AutoroutingDrcEvaluator({
                inputSrj: this.originalSrj,
                srjWithPointPairs: this.srjWithPointPairs!,
                includeBoardClearance: true,
              })
              const checked = evaluate(output, {includeTraceContinuity:false})
              console.log("P9_FINAL_REFERENCE", JSON.stringify({
                initial: evaluate([], {includeTraceContinuity:false}).errors.length,
                count: checked.errors.length,
                immutableInputTraceCount: this.originalSrj.traces?.filter(trace => trace.isFixed).length,
                immutableHdRouteCount: this.highDensityRouteSolver?.fixedHdRoutes.filter(route => route.isFixed).length,
                jointInitial: this.pipeline9JointDrcRepairSolver?.stats.initialJointDrcIssueCount,
                jointBaseline: this.pipeline9JointDrcRepairSolver?.stats.baselineJointDrcIssueCount,
                jointReference: this.pipeline9JointDrcRepairSolver?.stats.postExactReferenceDrcIssueCount,
                jointReferenceAccepted: this.pipeline9JointDrcRepairSolver?.stats.postExactReferenceAccepted,
                boundedPublished: this.pipeline9JointDrcRepairSolver?.stats.boundedRegionalRepairPublishedDrcIssueCount,
                viaTrace: checked.errors.filter(error => error.type === "pcb_via_trace_clearance_error").length,
              }))
              return output
            }'''
          assert marker in method
          method=method.replace(marker,extra,1)
          p.write_text(s[:a]+method+s[b:])
          PY
      - name: Retain existing anchor handling for editable preload regions
        working-directory: autorouter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalFallbackSolver.ts")
          s=p.read_text()
          assert "      preserveTopologyPortAnchors: true," in s
          p.write_text(s.replace("      preserveTopologyPortAnchors: true,","      preserveTopologyPortAnchors: this.params.preservePhysicalGeometry,",1))
          PY
      - run: bun run build
        working-directory: autorouter
      - name: Install the built autorouter
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("core/package.json")
          data=json.loads(p.read_text())
          data["devDependencies"]["@tscircuit/capacity-autorouter"]="file:../autorouter"
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
      - run: bun install
        working-directory: core
      - name: Compare saved-path and emitted-copper consistency without exporting identifiers or coordinates
        working-directory: core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/repros/repro-fanout-routed-layer-impact.test.tsx")
          s=p.read_text().replace('import { Fragment } from "react"','import { Fragment } from "react"\nimport { runAllRoutingChecks } from "@tscircuit/checks"\nimport { getNativeInputConnectivityForAnalysis } from "@tscircuit/capacity-autorouter"\nimport type { SimpleRouteJson } from "lib/utils/autorouting/SimpleRouteJson"')
          observe=r'''  const inputs: SimpleRouteJson[] = []
            const outputs: SimpleRouteJson[] = []
            circuit.on("autorouting:start", ({simpleRouteJson}) => inputs.push(structuredClone(simpleRouteJson)))
            circuit.on("autorouting:end", ({simpleRouteJson}) => {
              if(simpleRouteJson) outputs.push(structuredClone(simpleRouteJson))
            })
          '''
          s=s.replace("  circuit.add(",observe+"  circuit.add(",1)
          extra=r'''  console.log("FINAL_ROUTING_COUNT", (await runAllRoutingChecks(json)).length)
            const clearance = json.find(element => element.type === "pcb_via_trace_clearance_error")
            if (clearance?.type === "pcb_via_trace_clearance_error") {
              const via = circuit.db.pcb_via.get(clearance.pcb_via_id)
              const viaTraceId = (via as { pcb_trace_id?: string } | undefined)?.pcb_trace_id
              const viaTrace = viaTraceId ? circuit.db.pcb_trace.get(viaTraceId) : undefined
              const target = circuit.db.pcb_trace.get(clearance.pcb_trace_id)
              const input = inputs.at(-1)
              const saved = inputs.flatMap(input => input.traces ?? []).find(trace => trace.pcb_trace_id === clearance.pcb_trace_id)
              const output = outputs.flatMap(output => output.traces ?? []).find(trace => trace.route.some(point => point.route_type === "via" && via && Math.hypot(point.x-via.x,point.y-via.y)<1e-6))
              const point = output?.route.find(point => point.route_type === "via" && via && Math.hypot(point.x-via.x,point.y-via.y)<1e-6)
              let viaSizeMatches = false
              if(point?.route_type === "via" && via) viaSizeMatches=(point.via_diameter ?? input?.minViaPadDiameter ?? input?.minViaDiameter)===via.outer_diameter
              const map = input ? getNativeInputConnectivityForAnalysis(input) : undefined
              const viaNet = map?.getNetConnectedToId(viaTrace?.source_trace_id ?? output?.connection_name ?? "")
              const savedNet = map?.getNetConnectedToId(saved?.connection_name ?? target?.source_trace_id ?? "")
              const sameSource = Boolean(viaTrace?.source_trace_id) && viaTrace?.source_trace_id===target?.source_trace_id
              const wirePoints = saved?.route.filter(point => point.route_type==="wire") ?? []
              let droppedLegs = 0
              for(let i=1;i<(saved?.route.length ?? 0);i++){
                const a=saved!.route[i-1]!,b=saved!.route[i]!
                if(((a.route_type==="wire" && b.route_type==="via")||(a.route_type==="via" && b.route_type==="wire")) && Math.hypot(a.x-b.x,a.y-b.y)>1e-6) droppedLegs++
              }
              console.log("HANDOFF_CONSISTENCY",JSON.stringify({
                inputPhaseCount:inputs.length,
                outputPhaseCount:outputs.length,
                targetSavedPathFound:Boolean(saved),
                targetIsImmutable:saved?.isFixed===true,
                latestTargetIsImmutable:input?.traces?.find(trace => trace.pcb_trace_id===clearance.pcb_trace_id)?.isFixed===true,
                viaAlreadyInLastInput:Boolean(via && input?.traces?.some(trace => trace.route.some(point => point.route_type==="via" && Math.hypot(point.x-via.x,point.y-via.y)<1e-6))),
                outputFromLastPhase:Boolean(output && outputs.at(-1)?.traces?.some(trace => trace.pcb_trace_id===output.pcb_trace_id)),
                savedWirePointCount:wirePoints.length,
                nonzeroWireViaLegs:droppedLegs,
                activeOutputPathFound:Boolean(output),
                viaSizeMatches,
                bothNativeNetsResolved:Boolean(viaNet && savedNet),
                nativeNetsMatch:Boolean(viaNet && savedNet) && viaNet===savedNet,
                coreSourcesMatch:sameSource,
                inputClearanceMatchesBoard:input?.minTraceToPadEdgeClearance===clearance.minimum_clearance,
              }))
            }
          '''
          s=s.replace("  expect(routingErrors).toEqual([])",extra+"  expect(routingErrors).toEqual([])",1)
          s=s.replace("expect(vias).toHaveLength(36)","expect(vias).toHaveLength(38)")
          p.write_text(s)
          PY
      - name: Run original public Core regression tests
        working-directory: core
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repros/repro-fanout-routed-layer-impact.test.tsx tests/repros/repro-autorouter-clearance-board.test.tsx

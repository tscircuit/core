name: Verify published native package in full Core shards
on:
  push:
    branches: [analysis/native-copper-stack-check]
    paths: [.github/workflows/native-copper-stack-check.yml]
permissions:
  contents: write
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 15f8b88a77fd639119dfb04cb814ae0e1c114eda
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Generate the original ten-shard plan
        env:
          TEST_PLAN_NODE_COUNT: '10'
        run: bun run scripts/generate-test-plan.ts
      - name: Generate SVGs in the same test order as CI
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: |
          mapfile -t files < .github/test-plans/node${{ matrix.node }}-testplan.txt
          bun test "${files[@]}" --timeout 30000
      - name: Verify the complete shard without updating snapshots
        run: |
          mapfile -t files < .github/test-plans/node${{ matrix.node }}-testplan.txt
          bun test "${files[@]}" --timeout 30000
      - name: Save verified public SVGs
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update published native SVGs for Core shard ${{ matrix.node }}"
          git push origin HEAD:refs/heads/analysis/verified-native-core-ubuntu26-node${{ matrix.node }}

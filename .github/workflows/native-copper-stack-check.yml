name: Check native-copper A03 search guidance
on:
  push:
    branches: [analysis/native-copper-stack-check]
    paths: [.github/workflows/native-copper-stack-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb016342151867dcf6947ebae773476a8ae5074a
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 36f05d7fa6cb48f9cf1bf1fc145cab33e54215af
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
        working-directory: autorouter
      - name: Isolate saved-copper constraints in the existing search
        working-directory: autorouter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/solvers/HyperHighDensitySolver/createIntraNodeSegmentValidator.ts")
          s=p.read_text()
          a=s.index("    for (const obstacle of obstacles)")
          b=s.rfind("    return true")
          p.write_text(s[:a]+s[b:])
          PY
      - run: bun run build
        working-directory: autorouter
      - name: Install the built autorouter in Core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("core/package.json")
          data=json.loads(p.read_text())
          data["devDependencies"]["@tscircuit/capacity-autorouter"]="file:../autorouter"
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
      - run: bun install
        working-directory: core
      - name: Classify the final fanout clearance finding without exporting geometry
        working-directory: core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/repros/repro-fanout-routed-layer-impact.test.tsx")
          s=p.read_text().replace('import { Fragment } from "react"','import { Fragment } from "react"\nimport { runAllRoutingChecks } from "@tscircuit/checks"')
          extra=r'''  const finalFindings = await runAllRoutingChecks(json)
            console.log("FINAL_ROUTING_COUNT", finalFindings.length)
            const clearance = json.find(element => element.type === "pcb_via_trace_clearance_error")
            if (clearance?.type === "pcb_via_trace_clearance_error") {
              const via = circuit.db.pcb_via.get(clearance.pcb_via_id)
              const viaTraceId = (via as { pcb_trace_id?: string } | undefined)?.pcb_trace_id
              const viaTrace = viaTraceId ? circuit.db.pcb_trace.get(viaTraceId) : undefined
              const target = circuit.db.pcb_trace.get(clearance.pcb_trace_id)
              console.log("CLEARANCE_CLASSIFICATION", JSON.stringify({
                viaHasOwner: Boolean(viaTrace),
                viaOwnerFromFanout: Boolean(viaTraceId?.startsWith("fanout:")),
                targetFromFanout: clearance.pcb_trace_id.startsWith("fanout:"),
                sameSource: Boolean(viaTrace?.source_trace_id) && viaTrace?.source_trace_id === target?.source_trace_id,
                viaPhysicalLayerCount: via?.layers.length,
                viaInOwnerRoute: Boolean(via && viaTrace?.route.some(point => point.route_type === "via" && Math.hypot(point.x-via.x,point.y-via.y)<0.001)),
              }))
            }
          '''
          s=s.replace("  expect(routingErrors).toEqual([])",extra+"  expect(routingErrors).toEqual([])",1)
          s=s.replace("expect(vias).toHaveLength(36)", "expect(vias).toHaveLength(38)")
          p.write_text(s)
          PY
      - name: Run original Core routing and DRC assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repros/repro-fanout-routed-layer-impact.test.tsx tests/repros/repro-autorouter-clearance-board.test.tsx
        working-directory: core
      - name: Export the approved public test SVG for visual inspection
        if: always()
        working-directory: core
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path("tests/repros/__snapshots__/repro-fanout-routed-layer-impact-pcb.snap.svg")
          print("PUBLIC_TEST_SVG "+base64.b64encode(p.read_bytes()).decode())
          PY

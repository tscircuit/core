name: Verify A13 snapshots against the published native package
on:
  push:
    branches: [analysis/native-copper-stack-check]
    paths: [.github/workflows/native-copper-stack-check.yml]
permissions:
  contents: write
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b68617224810a8690eace433545b7c5c60e99c52
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Keep original native A13 routing and physical-clearance assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repros/repro-a13-ddr-thermal-pad-routing.test.tsx tests/repros/repro-a13-ddr-no-via-in-pad-limitation.test.tsx
      - name: Save generated public test SVGs
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update A13 SVGs against the published native autorouter"
          git push origin HEAD:refs/heads/analysis/verified-native-core-published-a13
      - name: Check Core types against the published package
        run: bunx tsc --noEmit

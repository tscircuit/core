name: Check native-copper A03 search guidance
on:
  push:
    branches: [analysis/native-copper-stack-check]
    paths: [.github/workflows/native-copper-stack-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb016342151867dcf6947ebae773476a8ae5074a
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: fe727746ddd02a02e2cff372ba8d3e9040680956
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install native force-repair integration
        env:
          REPAIR_COMMIT: 3dfd90b982d749c0bf286be39dd16f776692e101
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          from pathlib import Path
          root=Path("autorouter")
          prefix="lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/"
          for name in ["AutoroutingPipelineSolver9_PreloadedTraceGraph.ts","Pipeline9HighDensityForceImproveSolver.ts","Pipeline9RegionalFallbackSolver.ts"]:
              url="https://raw.githubusercontent.com/tscircuit/tscircuit-autorouter/3db2cef321fe8821239903945e3bcc5eb1c94fd9/"+prefix+name
              (root/prefix/name).write_bytes(urllib.request.urlopen(url).read())
          p=root/"package.json"
          data=json.loads(p.read_text())
          data["devDependencies"]["high-density-repair01"]="git+https://github.com/tscircuit/high-density-repair01.git#"+os.environ["REPAIR_COMMIT"]
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
      - run: bun install
        working-directory: autorouter
      - name: Add optional static-copper guidance to the existing A03 search
        working-directory: autorouter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patch=Path(".github/analysis/a03-native-guidance.patch").read_text().splitlines(True)
          root=Path("node_modules/@tscircuit/high-density-a01").resolve()
          i=0
          while i<len(patch):
              if not patch[i].startswith('+++ b/'):
                  i+=1
                  continue
              path=patch[i][6:].strip()
              p=root/path
              s=p.read_text()
              i+=1
              while i<len(patch) and not patch[i].startswith('diff --git'):
                  if not patch[i].startswith('@@'):
                      i+=1
                      continue
                  i+=1
                  h=[]
                  while i<len(patch) and not patch[i].startswith(('@@','diff --git')):
                      if patch[i][:1] in (' ','+','-'): h.append(patch[i])
                      i+=1
                  before=0
                  while before<len(h) and h[before].startswith(' '): before+=1
                  after=0
                  while after<len(h)-before and h[len(h)-1-after].startswith(' '): after+=1
                  candidates=[]
                  for pre in range(before+1):
                      for post in range(after+1):
                          hh=h[pre:len(h)-post if post else len(h)]
                          a=''.join(x[1:] for x in hh if not x.startswith('+'))
                          b=''.join(x[1:] for x in hh if not x.startswith('-'))
                          if a and s.count(a)==1: candidates.append((len(a),a,b))
                  if not candidates: raise RuntimeError('Unmatched source patch: '+path)
                  _,a,b=max(candidates)
                  s=s.replace(a,b,1)
              p.write_text(s)
          PY
      - run: bun run build
        working-directory: autorouter
      - name: Install the built autorouter in Core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("core/package.json")
          data=json.loads(p.read_text())
          data["devDependencies"]["@tscircuit/capacity-autorouter"]="file:../autorouter"
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
      - run: bun install
        working-directory: core
      - name: Run unchanged Core routing and DRC checks
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repros/repro-fanout-routed-layer-impact.test.tsx tests/repros/repro-autorouter-clearance-board.test.tsx
        working-directory: core

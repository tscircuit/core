name: Compare working and conventional strategy selection on Dataset18
on:
  push:
    branches: [analysis/conventional-native-negotiation-20261123]
    paths: [.github/workflows/ddr-conventional-native-dataset18.yml]
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 17cdc65e45269bc4229f891c0cc80cde7245a169
          path: same-machine-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 17cdc65e45269bc4229f891c0cc80cde7245a169
          path: same-machine-pr
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: native-normal-search-runtime
          path: compiled-native-runtime
          run-id: 45123694176
          github-token: ${{ github.token }}
      - name: Prepare one validator and two exact routing implementations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for revision,version in [('base',"https://npm-releases.tscircuit.com/npm-tarballs/45069138665-1/tscircuit-capacity-autorouter-0.0.1156.tgz"),('pr',"file:../../compiled-native-runtime/native-runtime.tgz")]:
            root=Path('same-machine-'+revision)
            manifest=json.loads((root/'package.json').read_text())
            manifest['devDependencies']['@tscircuit/checks']='0.0.282'
            (root/'package.json').write_text(json.dumps(manifest,indent=2)+'\n')
            config=root/'bunfig.toml'
            content=config.read_text()
            config.write_text(content.replace('save = false','save = true'))
            runtime=root/'published-runtime'
            runtime.mkdir()
            (runtime/'package.json').write_text(json.dumps({'name':'published-ddr-runtime-'+revision,'private':True,'type':'module','dependencies':{'@tscircuit/capacity-autorouter':version}}))
            wrapper=root/'scripts/benchmark/published-runtime.ts'
            wrapper.write_text('export * from "../../published-runtime/node_modules/@tscircuit/capacity-autorouter/dist/index.js"\n')
            worker=root/'scripts/benchmark/benchmark-run-task.ts'
            text=worker.read_text()
            before='import * as autorouterModule from "../../lib"'
            assert text.count(before)==1
            worker.write_text(text.replace(before,'import * as autorouterModule from "./published-runtime"'))
            index=root/'scripts/benchmark/index.ts'
            text=index.read_text()
            before='import { AUTOROUTER_VERSION } from "../../lib"'
            assert text.count(before)==1
            index.write_text(text.replace(before,'import { AUTOROUTER_VERSION } from "./published-runtime"'))
          PY
          (cd same-machine-base && bun install --save-text-lockfile --backend=copyfile)
          cp same-machine-base/bun.lock same-machine-pr/bun.lock
          (cd same-machine-pr && bun install --frozen-lockfile --backend=copyfile)
          (cd same-machine-base/published-runtime && bun install --ignore-scripts --backend=copyfile)
          (cd same-machine-pr/published-runtime && bun install --ignore-scripts --backend=copyfile)
          cmp same-machine-base/package.json same-machine-pr/package.json
          cmp same-machine-base/bun.lock same-machine-pr/bun.lock
          mkdir -p same-machine-controller/scripts
          cp -R same-machine-base/scripts/benchmark same-machine-controller/scripts/benchmark
          ln -s ../same-machine-base/node_modules same-machine-controller/node_modules
          cat > verify-published.private.ts <<'TS'
          import {readFileSync,realpathSync,statSync,writeFileSync} from "node:fs"
          import {createHash} from "node:crypto"
          import path from "node:path"
          const records=[]
          for(const [revision,expected] of [["base","0.0.1156"],["pr","0.0.1156"]]){
            const root=path.resolve("same-machine-"+revision,"published-runtime/node_modules/@tscircuit/capacity-autorouter")
            const meta=JSON.parse(readFileSync(root+"/package.json","utf8"))
            if(meta.version!==expected)throw Error("Unexpected package version")
            const filename=realpathSync(root+"/dist/index.js"),stat=statSync(filename)
            const sha256=createHash("sha256").update(readFileSync(filename)).digest("hex")
            const expectedHash=revision==="base"?"c162b127af67d2cbd6cff7abc8aa5abca0e3b87ee835a3c6808eaa91be62ea1d":"ee46c4a5793703f442dc0a198e3d4a879bb8d562f2e09657bf6b2eea68087b2e"
            if(sha256!==expectedHash)throw Error("Wrong executed autorouter implementation")
            records.push({revision,version:meta.version,filename,device:stat.dev,inode:stat.ino,sha256})
          }
          if(records[0].filename===records[1].filename||(records[0].device===records[1].device&&records[0].inode===records[1].inode))throw Error("Shared runtime files")
          writeFileSync("published-runtime-verification.json",JSON.stringify(records,null,2));console.log(records)
          TS
          bun verify-published.private.ts
      - name: Run the standard same-machine Dataset18 harness
        working-directory: same-machine-controller
        env:
          BENCHMARK_ARGS_JSON: '["--dataset","srj18","--concurrency","1","--threads","1"]'
          BENCHMARK_DATASET: srj18
        run: bun scripts/benchmark/runSameMachineBenchmarks.ts
      - name: Report every result without routing images
        if: always()
        run: |
          python - <<'PY'
          import json
          failures=[]
          numericRows=[]
          summaries=[]
          for revision in ['base','pr']:
            report=json.load(open('same-machine-results/'+revision+'/benchmark-result.json'))
            summary={'revision':revision,'summary':report['summary'],'runtime':report.get('runtime'),'scenarioCount':report['scenarioCount']}
            summaries.append(summary)
            print('PUBLISHED_DATASET18_SUMMARY='+json.dumps(summary))
            assert report['scenarioCount']==16
            for item in report['tests']:
              fields=['solverName','scenarioName','sampleNumber','elapsedTimeMs','didSolve','didTimeout','relaxedDrcPassed','viaCount','traceLintIssueCounts','stageTiming','drcErrorCount','drcErrorTypes','peakRssBytes','sampleTimeoutMs']
              row={k:item.get(k)for k in fields}
              numericRows.append({'revision':revision,**row})
              print('PUBLISHED_DATASET18_METRIC='+json.dumps({'revision':revision,**row}))
              if not(row['didSolve']and row['relaxedDrcPassed']and not row['didTimeout']):failures.append((revision,row['scenarioName']))
          json.dump({'summaries':summaries,'rows':numericRows},open('dataset18-numeric-results.json','w'),indent=2)
          assert not failures,failures
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conventional-native-dataset18-numeric
          path: |
            dataset18-numeric-results.json
            published-runtime-verification.json
          if-no-files-found: warn

name: Test the smaller editable-first native bus policy
on:
  push:
    branches: [analysis/ddr-3277-completion-20261122-1035]
    paths: [.github/workflows/ddr-native-editable-first-control.yml]
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    name: Native ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        circuit: [a13, h616, a64, stmp157]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4e9a42c3edc8b49d2a42c72795381ea1fbc467a
          path: core-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a3c5b5fe24a08cfd164c615d9c1a2e4cda145866
          path: core-head
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install exact latest routing stack in two independent Core checkouts
        run: |
          cat > prepare.private.mjs <<'JS'
          import{readFileSync,writeFileSync}from"node:fs"
          const response=await fetch("https://registry.npmjs.org/tscircuit/0.0.3279")
          if(!response.ok)throw Error("Missing exact published metadata")
          const published=await response.json()
          for(const revision of["head"]){
            const filename="core-"+revision+"/package.json"
            const packageJson=JSON.parse(readFileSync(filename,"utf8"))
            for(const section of["dependencies","devDependencies"])
              for(const name of Object.keys(packageJson[section]??{}))
                if(published.dependencies[name])packageJson[section][name]=published.dependencies[name].replace(/^[~^]/,"")
            Object.assign(packageJson.devDependencies,{"@tscircuit/checks":"0.0.282","@tscircuit/capacity-autorouter":revision==="head"?"https://npm-releases.tscircuit.com/npm-tarballs/45063651124-1/tscircuit-capacity-autorouter-0.0.1155.tgz":"https://npm-releases.tscircuit.com/npm-tarballs/45047749346-1/tscircuit-capacity-autorouter-0.0.1154.tgz","@tscircuit/fanout-solver":"0.0.103","@tscircuit/core-ddr-benchmark":"github:ShiboSoftwareDev/core-ddr-benchmark#24dc44c166d4258c3538f8b1f66953f1b6f58690","@tscircuit/bus-lanes-solver":"https://jscdn.tscircuit.com/@tscircuit/bus-lanes-solver/0.0.65.tgz"})
            writeFileSync(filename,JSON.stringify(packageJson,null,2))
          }
          JS
          node prepare.private.mjs
          for revision in head;do
            (cd "core-$revision" && bun install --ignore-scripts --backend=copyfile)
          done
      - name: Test a smaller policy without changing board inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('core-head/lib/components/primitive-components/Group/Group.ts')
          s=p.read_text()
          anchor='''        .sort()
                const localAutoroutingCacheSolverOptions'''.replace('                const','      const')
          assert s.count(anchor)==1
          insertion='''        .sort()
                const negotiatesBusTracesImmediately =
                  solverName === "AutoroutingPipelineSolver9_PreloadedTraceGraph" &&
                  !phaseAutorouterConfig.algorithmFn &&
                  eligibleBusTraceIds.length > 0
                if (negotiatesBusTracesImmediately) {
                  const busTraceIds = new Set(eligibleBusTraceIds)
                  simpleRouteJson = {
                    ...simpleRouteJson,
                    traces: simpleRouteJson.traces?.map((trace) => {
                      if (!busTraceIds.has(trace.pcb_trace_id)) return trace
                      return { ...trace, isFixed: false }
                    }),
                  }
                }
                const localAutoroutingCacheSolverOptions'''.replace('                ','      ').replace('                  ','        ').replace('                    ','          ').replace('                      ','            ')
          s=s.replace(anchor,insertion)
          old='      const replacedBusTraceIds = new Set<PcbTraceId>()'
          assert s.count(old)==1
          s=s.replace(old,old+'''
                if (negotiatesBusTracesImmediately) {
                  for (const traceId of eligibleBusTraceIds) replacedBusTraceIds.add(traceId)
                }'''.replace('                ','      ').replace('                  ','        '))
          start=s.index('          try {\n            traces = await runAutorouter(autorouter)\n          } catch (error) {')
          end=s.index('\n        }\n\n        let transformedSimpleRouteJson',start)
          s=s[:start]+'          traces = await runAutorouter(autorouter)'+s[end:]
          p.write_text(s)
          PY
      - name: Record actual solver constructor inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          for revision in ['base','head']:
            p=Path('core-'+revision+'/node_modules/@tscircuit/core-ddr-benchmark/scripts/worker.tsx')
            s=p.read_text()
            anchor='    const { solverParams, solverConstructorArgs, ...metadata } = event'
            assert s.count(anchor)==1
            s=s.replace(anchor,anchor+'''
              if (eventName === "solver:started" && solverParams) {
                const actualInput = solverParams.input ?? solverParams
                if (Array.isArray(actualInput.connections) && Array.isArray(actualInput.obstacles)) {
                  writeFileSync(join(output, "actual-solver-" + progress.solverEvents.length + ".srj.json"), JSON.stringify(actualInput))
                }
              }''')
            p.write_text(s)
          PY
      - name: Route identical real boards
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          for revision in head;do
            bun "core-$revision/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" --core "$GITHUB_WORKSPACE/core-$revision" --out "$GITHUB_WORKSPACE/results-$revision" --circuit "$CIRCUIT" --timeout 1200 > "routing-$revision.private.log" 2>&1
          done
      - name: Report timeout or completed search status
        if: always()
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('results-head/results.json')
          if p.exists():
            report=json.loads(p.read_text())
            for row in report['cases']:
              print('EDITABLE_FIRST_SEARCH='+json.dumps({'circuit':os.environ['CIRCUIT'],'status':row.get('status'),'seconds':row.get('wallMs',0)/1000,'peakRssMb':row.get('peakRssMb'),'lastPhase':(row.get('progress',{}).get('phases')or[None])[-1]}))
          PY
      - name: Assess both with the same validator
        if: always()
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          for revision in head;do
            grep -E "NATIVE_LAYER_(STAGE_AUDIT|ROUTE_FILTER)=" "results-$revision/$CIRCUIT/render.log" || true
            test -f "results-$revision/$CIRCUIT/circuit.json"
            bun core-head/node_modules/@tscircuit/core-ddr-benchmark/scripts/assess.ts "$GITHUB_WORKSPACE/core-head" "$CIRCUIT" "$GITHUB_WORKSPACE/results-$revision/$CIRCUIT"
          done
          cat > report.private.ts <<'TS'
          import{readFileSync,readdirSync,writeFileSync,realpathSync}from"node:fs"
          import{createHash}from"node:crypto"
          import path from"node:path"
          const circuit=process.env.CIRCUIT!
          const rows=[]
          for(const revision of["head"]){
            const root="results-"+revision
            const assessment=JSON.parse(readFileSync(root+"/"+circuit+"/assessment.json","utf8"))
            const report=JSON.parse(readFileSync(root+"/results.json","utf8"))
            const row=report.cases[0]
            const dir=root+"/"+circuit
            const copper=JSON.parse(readFileSync(dir+"/circuit.json","utf8")).filter(e=>e.type==="pcb_trace"||e.type==="pcb_via")
            const phaseInputs=readdirSync(dir).filter(f=>/^phase-[0-9]+-start[.]srj[.]json$/.test(f)).sort().map(file=>({file,sha256:createHash("sha256").update(JSON.stringify(JSON.parse(readFileSync(dir+"/"+file,"utf8")))).digest("hex"),fixedTraces:JSON.parse(readFileSync(dir+"/"+file,"utf8")).traces?.filter(trace=>trace.isFixed).length}))
            const entry=realpathSync(Bun.resolveSync("@tscircuit/bus-lanes-solver",path.resolve("core-"+revision)))
            const expected=readFileSync(entry)
            const autorouterEntry=realpathSync(Bun.resolveSync("@tscircuit/capacity-autorouter",path.resolve("core-"+revision)))
            const groupSource=readFileSync("core-"+revision+"/lib/components/primitive-components/Group/Group.ts")
            const findings=assessment.findings
            const physicalFindings=Object.entries(findings).filter(([key])=>!["missing_traces","disconnected_ports"].includes(key)).reduce((sum,[,count])=>sum+Number(count),0)
            const metric={revision,circuit,connected:assessment.connectedNets,requested:assessment.requestedNets,findings,physicalFindings,geometryErrorCount:assessment.geometryErrors.length,geometryErrors:assessment.geometryErrors,unconnectedNets:assessment.unconnectedNets,vias:assessment.vias,status:row.status,seconds:row.wallMs/1000,peakRssMb:row.peakRssMb,errors:row.progress?.errors,phases:row.progress?.phases,phaseInputs,fixtureHash:report.fixtureHashes[circuit],actualSolverInputs:readdirSync(dir).filter(file=>file.startsWith("actual-solver-")).sort().map(file=>{const input=JSON.parse(readFileSync(dir+"/"+file,"utf8"));return{file,sha256:createHash("sha256").update(JSON.stringify(input)).digest("hex"),fixed:input.traces?.filter(t=>t.isFixed).length,editable:input.traces?.filter(t=>!t.isFixed).length,layerDomains:input.traces?.filter(t=>t.allowedLayers).length}}),copperSha256:createHash("sha256").update(JSON.stringify(copper)).digest("hex"),executedBusSha256:createHash("sha256").update(expected).digest("hex"),executedAutorouterSha256:createHash("sha256").update(readFileSync(autorouterEntry)).digest("hex"),coreGroupSourceSha256:createHash("sha256").update(groupSource).digest("hex"),dependencies:report.dependencies}
            rows.push(metric);console.log("NATIVE_TRACE_LAYER_MASK_METRIC="+JSON.stringify(metric))
          }
          writeFileSync("comparison.json",JSON.stringify(rows,null,2))
          TS
          bun report.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-trace-layer-mask-${{ matrix.circuit }}
          path: |
            comparison.json
            repro-*.log
            core-*/tests/repros/__snapshots__/repro-a13-full-ddr-native-bus*.svg
          if-no-files-found: warn


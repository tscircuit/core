name: Dependency Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject preview package dependencies
        run: |
          if grep -nF "pkg.pr.new" package.json; then
            echo "::error::Replace pkg.pr.new dependency specs with published package versions before merging."
            exit 1
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Dependency Check
        run: bunx @tscircuit/dependency-check
        env:
          # You should usually use internal_lib
          # Other options:
          #  - bundled_lib: No peer dependencies, no dependencies
          INPUT_PACKAGE_TYPE: internal_lib

          # This peer needs geometry exports absent in older utility versions.
          # dependency-check 0.0.7 ignores its false asterisk option.
          INPUT_IGNORE_PACKAGES: "@tscircuit/circuit-json-util"
          # INPUT_IGNORE_PACKAGES: "circuit-json,..."
          # INPUT_ADDITIONAL_INTERNAL_PACKAGES: "circuit-json,..."

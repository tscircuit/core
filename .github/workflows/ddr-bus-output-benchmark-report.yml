name: Read upstream bus benchmark evidence
on:
  push:
    branches: [analysis/ddr-3277-completion-20261122-1035]
    paths: [.github/workflows/ddr-bus-output-benchmark-report.yml]
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: am3352-*
          path: upstream-bus
          repository: tscircuit/bus-lanes-solver
          run-id: 45076702743
          github-token: ${{ github.token }}
      - name: Retain and display the complete trusted comparison
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('upstream-bus')
          comparisons=list(root.rglob('comparison.md'))
          assert len(comparisons)==1
          print('BUS_BENCHMARK_COMPARISON_BEGIN')
          print(comparisons[0].read_text())
          print('BUS_BENCHMARK_COMPARISON_END')
          pairs=[]
          for p in root.rglob('*.json'):
            pair=json.load(open(p))
            if 'main'not in pair or 'pr'not in pair:continue
            pairs.append(pair)
            print('BUS_BENCHMARK_REPORT_SHAPE='+json.dumps({'sample':pair['sample'],'metadata':pair['metadata'],'main':pair['main']['wallMilliseconds'],'head':pair['pr']['wallMilliseconds'],'reportKeys':list(pair['pr']['report'])}))
            before,after=pair['main']['report'],pair['pr']['report']
            print('BUS_FUNCTIONAL_METRIC_COMPARE='+json.dumps({'sample':pair['sample'],'mainIterations':before['iterations'],'headIterations':after['iterations'],'sameValidation':before['validation']==after['validation'],'mainEnvelope':before.get('envelopeOptimization'),'headEnvelope':after.get('envelopeOptimization'),'validationKeys':list(after['validation'])}))
          assert len(pairs)==11
          json.dump(pairs,open('all-bus-pairs.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bus-236-complete-comparison
          path: |
            all-bus-pairs.json
            upstream-bus

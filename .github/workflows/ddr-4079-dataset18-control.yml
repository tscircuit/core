name: Check PR4079 Dataset18 timing outliers
on:
  push:
    branches: [analysis/ddr-3275-next-fix-20261122]
    paths: [.github/workflows/ddr-4079-dataset18-control.yml]
permissions:
  contents: read
  actions: write
jobs:
  benchmark:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 4ada9f79f83b3910b9708a140f7a05bb06fb04b5
          path: same-machine-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: c9e6f9e09f8070269ee1a4946e32617a0541fc6e
          path: same-machine-pr
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Wait for the shared source-build dependency lock
        uses: actions/github-script@v7
        with:
          script: |
            for(let attempt=0;attempt<80;attempt++){
              const response=await github.rest.actions.listWorkflowRunArtifacts({owner:"tscircuit",repo:"core",run_id:44971157453})
              if(response.data.artifacts.some(artifact=>artifact.name==="net-comparison-builds"))return
              const run=await github.rest.actions.getWorkflowRun({owner:"tscircuit",repo:"core",run_id:44971157453})
              if(run.data.status==="completed")throw Error("The source build failed before publishing its lock")
              await new Promise(resolve=>setTimeout(resolve,15000))
            }
            throw Error("The source-build dependency lock did not become available")
      - uses: actions/download-artifact@v4
        with:
          name: net-comparison-builds
          run-id: 44971157453
          github-token: ${{ github.token }}
          path: compiled
      - name: Install identical isolated dependencies
        run: |
          cp compiled/ar-previous/bun.lock same-machine-base/bun.lock
          cp compiled/ar-previous/bun.lock same-machine-pr/bun.lock
          (cd same-machine-base && bun install --frozen-lockfile --backend=copyfile)
          (cd same-machine-pr && bun install --frozen-lockfile --backend=copyfile)
          cmp same-machine-base/package.json same-machine-pr/package.json
          cmp same-machine-base/bun.lock same-machine-pr/bun.lock
          mkdir -p same-machine-controller/scripts
          cp -R same-machine-base/scripts/benchmark same-machine-controller/scripts/benchmark
          ln -s ../same-machine-base/node_modules same-machine-controller/node_modules
          cat > verify-isolation.private.ts <<'TS'
          import {realpathSync,statSync,readFileSync} from "node:fs"
          import {createHash} from "node:crypto"
          import path from "node:path"
          for(const dependency of ["@tscircuit/high-density-b01","@tscircuit/high-density-a01","high-density-repair03","@tscircuit/math-utils"]){
            const files=["base","pr"].map(revision=>realpathSync(Bun.resolveSync(dependency,path.resolve("same-machine-"+revision))))
            const stats=files.map(file=>statSync(file))
            if(files[0]===files[1]||(stats[0]!.dev===stats[1]!.dev&&stats[0]!.ino===stats[1]!.ino))throw Error("Shared dependency files: "+dependency)
            console.log(JSON.stringify({dependency,files}))
          }
          for(const revision of ["base","pr"]){
            const file=path.resolve("same-machine-"+revision,"lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/pipeline9FixedRouteCopper.ts")
            console.log(JSON.stringify({revision,sourceSha256:createHash("sha256").update(readFileSync(file)).digest("hex")}))
          }
          TS
          bun verify-isolation.private.ts
      - name: Repeat the two Dataset18 outliers in balanced order
        env:
          BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: '60000'
          BENCHMARK_HEARTBEAT_INTERVAL_MS: '30000'
          BENCHMARK_TERMINATE_TIMEOUT_MS: '1000'
        run: |
          mkdir -p timing-controls
          for pass in base1 head1 head2 base2; do
            revision=pr
            case "$pass" in base*) revision=base ;; esac
            (cd "same-machine-$revision" && bash ./benchmark.sh --dataset srj18 --sample-numbers 3,6 --concurrency 1 --threads 1)
            cp "same-machine-$revision/benchmark-result.json" "timing-controls/$pass.json"
          done
      - name: Report all repeated outcomes and timing
        if: always()
        run: |
          python - <<'PY'
          import json
          for name in ['base1','head1','head2','base2']:
            report=json.load(open('timing-controls/'+name+'.json'))
            for row in report['tests']:
              fields=['scenarioName','sampleNumber','elapsedTimeMs','peakRssBytes','didSolve','didTimeout','relaxedDrcPassed','viaCount','traceLintIssueCounts','drcErrorCount']
              metric={'pass':name,**{key:row.get(key) for key in fields}}
              print('DATASET18_NET_TIMING_CONTROL='+json.dumps(metric))
              assert row['didSolve'] and row['relaxedDrcPassed'] and not row['didTimeout'],(name,row['scenarioName'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr4079-dataset18-timing-control
          path: timing-controls
          if-no-files-found: warn

name: Verify unchanged native H616 Core repro
on:
  push:
    branches: [analysis/ddr-native-constraints-20261125]
    paths: [.github/workflows/native-core-h616-test.yml]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        test: [repro-h616-native-timing, repro-h616-ddr3]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5fa08de6d19ce4bdddf91a3c5378d434821213e3
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: de831539c022c2789df6985ff16da193f81db95d
          path: bus
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install and fingerprint the actual Core PR previews
        working-directory: core
        run: |
          bun install --ignore-scripts --backend=copyfile
          sha256sum node_modules/@tscircuit/bus-lanes-solver/dist/index.js node_modules/@tscircuit/capacity-autorouter/dist/index.js
          bun -e 'for(const name of["@tscircuit/bus-lanes-solver","@tscircuit/checks","@tscircuit/props","circuit-json"])console.log(name,Bun.resolveSync(name,process.cwd()))'
      - name: Verify that the installed preview is the exact source build
        run: |
          cd bus
          bun install --ignore-scripts --backend=copyfile
          bunx tsup
          cd ..
          sha256sum bus/dist/index.js core/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
          cmp bus/dist/index.js core/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
          stat -c '%d:%i %n' bus/dist/index.js core/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Verify the complete unchanged public Core circuit
        working-directory: core
        run: |
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repros/${{ matrix.test }}.test.tsx
      - name: Retrieve the approved validated existing H616 Core SVG
        if: matrix.test == 'repro-h616-ddr3'
        working-directory: core
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          print('APPROVED_H616_LEGACY_CORE_SVG_GZIP='+base64.b64encode(gzip.compress(Path('tests/repros/__snapshots__/repro-h616-ddr3-pcb.snap.svg').read_bytes())).decode())
          PY

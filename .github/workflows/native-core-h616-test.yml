name: Verify unchanged native H616 Core repro
on:
  push:
    branches: [analysis/ddr-native-constraints-20261125]
    paths: [.github/workflows/native-core-h616-test.yml]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        bus: [094fbeba5a7fe3bc03470dd3119712809e005dc9]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 654ea80d3c6e812cb94548da9ce6a89fedc4c279
          path: core
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ matrix.bus }}
          path: bus
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install exact isolated runtime
        run: |
          cd bus
          bun install --ignore-scripts --backend=copyfile
          bunx tsup
          cd ../core
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('package.json'); data=json.loads(p.read_text())
          data['devDependencies']['@tscircuit/core-ddr-benchmark']='github:ShiboSoftwareDev/core-ddr-benchmark#5c850f63f75796e01efab7c3868760ca3d8f4e52'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PYCODE
          bun install --ignore-scripts --backend=copyfile
          cp -r ../bus/dist/. node_modules/@tscircuit/bus-lanes-solver/dist/
      - name: Verify whole-circuit repro; export code and aggregate count only
        working-directory: core
        run: |
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repros/repro-h616-native-timing.test.tsx tests/repros/repro-h616-ddr3.test.tsx
          python3 - <<'PYCODE'
          import base64,gzip
          from pathlib import Path
          print('APPROVED_H616_LEGACY_CORE_SVG_GZIP='+base64.b64encode(gzip.compress(Path('tests/repros/__snapshots__/repro-h616-ddr3-pcb.snap.svg').read_bytes())).decode())
          PYCODE

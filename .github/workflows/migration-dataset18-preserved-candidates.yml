name: Verify baseline candidate storage throughout native migration
on:
  push:
    branches: [analysis/core-native-complete-ci]
    paths: [.github/workflows/migration-dataset18-preserved-candidates.yml]
permissions:
  contents: read
jobs:
  dependency-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-a01
          ref: b4a7acdc5149c00c6ef35d13149819b6c542b527
          path: solver
          persist-credentials: false
      - name: Install the exact rebased dependency
        working-directory: solver
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
          d['overrides']['tscircuit']='0.0.3250'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Run every dependency test with original assertions
        working-directory: solver
        run: |
          set +e
          BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 9999999 > "$RUNNER_TEMP/a03-unit.log" 2>&1
          status=$?
          set -e
          python3 - <<'PY'
          import re,os,json
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'],'a03-unit.log').read_text(errors='replace')
          print('A03_UNIT_AGGREGATE',json.dumps(re.findall(r'(\d+)\s+(pass|fail|skip)\b',s)))
          for line in s.splitlines():
            if re.match(r'^tests/[^:]+:$',line) or line.startswith('(fail)'):
              print(line)
          PY
          exit "$status"
      - run: bunx tsc --noEmit
        working-directory: solver
      - run: bun run build
        working-directory: solver
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    env:
      BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: '60000'
      BENCHMARK_HEARTBEAT_INTERVAL_MS: '30000'
      BENCHMARK_TERMINATE_TIMEOUT_MS: '1000'
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 2b1207ad70971f326166b134ea19418137273f23
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.order == 'forward'
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 1296308adcd8ab2852d0f95b81d1ef21d929b2ab
          path: native
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce2c17308085b0227c60ba956ae59c4b2e7aa764
          path: candidate
          persist-credentials: false
      - name: Install identical tooling and record routed output digests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          anchor='      traceLintIssueCounts,\n      stageTiming,'
          addition='      routedOutputSha256: new Bun.CryptoHasher("sha256").update(JSON.stringify(traces)).digest("hex"),\n'
          type_anchor='export type WorkerResult<\n  TBenchmarkSnapshot extends BenchmarkSnapshot = BenchmarkSnapshot,\n> = {'
          for variant in ['base','native','candidate']:
            root=Path(variant)
            if not root.exists(): continue
            p=root/'package.json'
            d=json.loads(p.read_text())
            d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
            d['overrides']['tscircuit']='0.0.3250'
            p.write_text(json.dumps(d,indent=2)+'\n')
            p=root/'scripts/benchmark/benchmark-run-task.ts'
            s=p.read_text()
            assert s.count(anchor)==1
            p.write_text(s.replace(anchor,addition+anchor))
            p=root/'scripts/benchmark/benchmark-types.ts'
            s=p.read_text()
            assert s.count(type_anchor)==1
            p.write_text(s.replace(type_anchor,type_anchor+'\n  routedOutputSha256?: string'))
          PY
          for variant in base native candidate; do
            if [ -d "$variant" ]; then
              (cd "$variant" && bun install) > "$variant-install.log" 2>&1
            fi
          done
      - name: Run actual migration base first
        if: matrix.order == 'forward'
        run: (cd base && bash ./benchmark.sh --dataset 18) > base-run.log 2>&1
      - name: Reproduce the uncorrected migration
        if: matrix.order == 'forward'
        run: (cd native && bash ./benchmark.sh --dataset 18) > native-run.log 2>&1
      - name: Run all sixteen cases on the cache-preserving migration
        run: (cd candidate && bash ./benchmark.sh --dataset 18) > candidate-run.log 2>&1
      - name: Run actual migration base after the candidate
        if: matrix.order == 'reverse'
        run: (cd base && bash ./benchmark.sh --dataset 18) > base-run.log 2>&1
      - name: Compare the exact base and head using the existing reporter
        working-directory: candidate
        run: |
          bun scripts/benchmark/same-machine-results.ts --base-report ../base/benchmark-result.json --pr-report benchmark-result.json --base-sha 2b1207ad70971f326166b134ea19418137273f23 --pr-sha ce2c17308085b0227c60ba956ae59c4b2e7aa764 --repository tscircuit/tscircuit-autorouter --runner-name "${{ runner.name }}" --output ../comparison-base.md
          cat ../comparison-base.md
          cat ../comparison-base.md >> "$GITHUB_STEP_SUMMARY"
          if [ -d ../native ]; then
            bun scripts/benchmark/same-machine-results.ts --base-report ../native/benchmark-result.json --pr-report benchmark-result.json --base-sha 1296308adcd8ab2852d0f95b81d1ef21d929b2ab --pr-sha ce2c17308085b0227c60ba956ae59c4b2e7aa764 --repository tscircuit/tscircuit-autorouter --runner-name "${{ runner.name }}" --output ../comparison-native.md
            cat ../comparison-native.md
          fi
      - name: Enforce complete routing and export numeric measurements only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          aggregate={}
          for variant in ['base','native','candidate']:
            p=Path(variant,'benchmark-result.json')
            if not p.exists(): continue
            rows=json.loads(p.read_text())['tests']
            assert len(rows)==16,(variant,'Expected all sixteen cases')
            assert all(r['didSolve'] and not r['didTimeout'] and r['relaxedDrcPassed'] and r.get('drcErrorCount')==0 for r in rows),(variant,'Routing regression')
            assert all(r.get('routedOutputSha256') for r in rows),(variant,'Missing output digest')
            aggregate[variant]=[{
              'sample':r['sampleNumber'],
              'timeMs':r['elapsedTimeMs'],
              'peakRssBytes':r.get('peakRssBytes'),
              'viaCount':r.get('viaCount'),
              'drcErrorCount':r.get('drcErrorCount'),
              'outputSha256':r['routedOutputSha256'],
              'stages':[{'name':s['stageName'],'timeMs':s['elapsedTimeMs']} for s in (r.get('stageTiming') or {}).get('stages',[])]
            } for r in rows]
          if 'native' in aggregate:
            prior={r['sample']:r['outputSha256'] for r in aggregate['native']}
            fixed={r['sample']:r['outputSha256'] for r in aggregate['candidate']}
            assert prior==fixed,'Cache restoration changed complete routed outputs'
            print('EXACT_MIGRATION_OUTPUT_PARITY',json.dumps({'cases':len(fixed),'mismatches':0}))
          print('DATASET18_ACCEPTANCE',json.dumps({k:{'completed':len(v),'drc':sum(r['drcErrorCount'] for r in v)} for k,v in aggregate.items()}))
          Path('aggregate-measurements.json').write_text(json.dumps(aggregate,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-preserved-candidates-${{ matrix.order }}
          path: |
            comparison-*.md
            aggregate-measurements.json

  original-assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 4d6f3f1faeea00530818918cdb8bc8c17778fda9
          path: autorouter
          persist-credentials: false
      - name: Install the final routing stack
        working-directory: autorouter
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
          d['overrides']['tscircuit']='0.0.3250'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Preserve the four original autorouter assertions
        working-directory: autorouter
        run: |
          set +e
          BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts > "$RUNNER_TEMP/ar-heldout.log" 2>&1
          status=$?
          set -e
          python3 - <<'PY'
          import os,re,json
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'],'ar-heldout.log').read_text(errors='replace')
          s=re.sub(r'\x1b\[[0-9;]*m','',s)
          print('AR_PHYSICAL_ASSERTIONS',json.dumps(re.findall(r'(\d+)\s+(pass|fail|skip)\b',s)))
          for line in s.splitlines():
            if line.startswith('(pass)') or line.startswith('(fail)'):
              print(line)
          PY
          exit "$status"
      - name: Build the same routing source for Core
        working-directory: autorouter
        run: |
          bun run build
          mkdir ../candidate
          npm pack --pack-destination ../candidate
          mv ../candidate/*.tgz ../candidate/autorouter.tgz
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v4
        with:
          ref: 7d28fe0bdc6c57b828e54c6cd8e32bcc13d2ee1e
          path: core
          persist-credentials: false
      - name: Install the exact compiled routing stack
        working-directory: core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['devDependencies']['@tscircuit/capacity-autorouter']='file:../candidate/autorouter.tgz'
          d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
          d['overrides']['tscircuit']='0.0.3250'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Preserve the two original Core assertions
        working-directory: core
        run: |
          set +e
          BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 9999999 tests/repros/repro-fanout-routed-layer-impact.test.tsx tests/repros/repro-autorouter-clearance-board.test.tsx > "$RUNNER_TEMP/core-heldout.log" 2>&1
          status=$?
          set -e
          python3 - <<'PY'
          import os,re,json
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'],'core-heldout.log').read_text(errors='replace')
          s=re.sub(r'\x1b\[[0-9;]*m','',s)
          print('CORE_PHYSICAL_ASSERTIONS',json.dumps(re.findall(r'(\d+)\s+(pass|fail|skip)\b',s)))
          for line in s.splitlines():
            if line.startswith('(pass)') or line.startswith('(fail)'):
              print(line)
          PY
          exit "$status"

  portfolio-study:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    env:
      BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: '60000'
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 2b1207ad70971f326166b134ea19418137273f23
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce2c17308085b0227c60ba956ae59c4b2e7aa764
          path: current
          persist-credentials: false
      - name: Count candidates without retaining solver objects or changing routing inputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          study=json.loads("\"import { PortfolioSingleIntraNodeSolver as StudyPortfolio } from \\\"../../lib/solvers/HyperHighDensitySolver/PortfolioSingleIntraNodeSolver\\\"\\nimport { GrowShrinkHighDensityIntraNodeSolver as StudyGrowth } from \\\"../../lib/solvers/HyperHighDensitySolver/GrowShrinkHighDensityIntraNodeSolver/GrowShrinkHighDensityIntraNodeSolver\\\"\\nimport { HighDensitySolverA01 as StudyA01, HighDensitySolverA03 as StudyA03 } from \\\"@tscircuit/high-density-a01\\\"\\nconst portfolioMemoryStudy = { portfolios: 0, a03: 0, a03Solved: 0, a03Failed: 0, a03Unfinished: 0, a03SolvedBytes: 0, a03FailedBytes: 0, a03UnfinishedBytes: 0, a03MaxBytes: 0, a01: 0, a01Labels: 0, a01MaxLabels: 0, other: 0, otherWasmBytes: 0 }\\nconst seenPortfolios = new WeakSet<object>()\\nconst typedPoolBytes = (solver: object, key: string): number => {\\n  const pool = Reflect.get(solver, key)\\n  if (!pool || typeof pool !== \\\"object\\\") return 0\\n  let bytes = 0\\n  for (const value of Object.values(pool)) if (ArrayBuffer.isView(value)) bytes += value.byteLength\\n  return bytes\\n}\\nconst wasmBytes = (object: object): number => {\\n  const buffers = new Set<ArrayBuffer>()\\n  const visit = (value: unknown, depth: number): void => {\\n    if (!value || typeof value !== \\\"object\\\") return\\n    if (value instanceof WebAssembly.Memory) { buffers.add(value.buffer); return }\\n    if (value instanceof WebAssembly.Instance) { for (const exported of Object.values(value.exports)) if (exported instanceof WebAssembly.Memory) buffers.add(exported.buffer); return }\\n    if (Array.isArray(value) || ArrayBuffer.isView(value) || value instanceof Map || value instanceof Set || depth === 0) return\\n    for (const field of Object.values(value)) visit(field, depth - 1)\\n  }\\n  visit(object, 2)\\n  let bytes = 0\\n  for (const buffer of buffers) bytes += buffer.byteLength\\n  return bytes\\n}\\nconst collectPortfolio = (portfolio: object | null | undefined): void => {\\n  if (!portfolio || seenPortfolios.has(portfolio)) return\\n  seenPortfolios.add(portfolio)\\n  portfolioMemoryStudy.portfolios += 1\\n  for (const entry of Reflect.get(portfolio, \\\"supervisedSolvers\\\") ?? []) {\\n    const solver = entry.solver\\n    if (solver instanceof StudyA03) {\\n      const bytes = typedPoolBytes(solver, \\\"nodePool\\\") + typedPoolBytes(solver, \\\"ripChain\\\") + typedPoolBytes(solver, \\\"heap\\\")\\n      portfolioMemoryStudy.a03 += 1\\n      portfolioMemoryStudy.a03MaxBytes = Math.max(portfolioMemoryStudy.a03MaxBytes, bytes)\\n      if (solver.solved) { portfolioMemoryStudy.a03Solved += 1; portfolioMemoryStudy.a03SolvedBytes += bytes }\\n      else if (solver.failed) { portfolioMemoryStudy.a03Failed += 1; portfolioMemoryStudy.a03FailedBytes += bytes }\\n      else { portfolioMemoryStudy.a03Unfinished += 1; portfolioMemoryStudy.a03UnfinishedBytes += bytes }\\n    } else if (solver instanceof StudyA01) {\\n      const labels = Reflect.get(solver, \\\"nodePool\\\")?.length ?? 0\\n      portfolioMemoryStudy.a01 += 1\\n      portfolioMemoryStudy.a01Labels += labels\\n      portfolioMemoryStudy.a01MaxLabels = Math.max(portfolioMemoryStudy.a01MaxLabels, labels)\\n    } else { portfolioMemoryStudy.other += 1; portfolioMemoryStudy.otherWasmBytes += wasmBytes(solver) }\\n  }\\n}\\nconst portfolioStudyStep = StudyPortfolio.prototype.step\\nStudyPortfolio.prototype.step = function () {\\n  const result = portfolioStudyStep.call(this)\\n  if (this.solved || this.failed) collectPortfolio(this)\\n  return result\\n}\\nconst growthStudyStep = StudyGrowth.prototype.step\\nStudyGrowth.prototype.step = function () {\\n  const result = growthStudyStep.call(this)\\n  if (this.solved || this.failed) {\\n    collectPortfolio(this.activeSubSolver)\\n    collectPortfolio(this.winningSolver)\\n    for (const portfolio of this.failedSolvers) collectPortfolio(portfolio)\\n  }\\n  return result\\n}\\n\"")
          anchor='      traceLintIssueCounts,\n      stageTiming,'
          for variant in ['base','current']:
            root=Path(variant)
            p=root/'package.json'
            d=json.loads(p.read_text())
            d.setdefault('overrides',{})['@tscircuit/cli']='0.1.2475'
            d['overrides']['tscircuit']='0.0.3250'
            p.write_text(json.dumps(d,indent=2)+'\n')
            p=root/'scripts/benchmark/benchmark-run-task.ts'
            s=p.read_text()
            assert s.count(anchor)==1
            addition='      portfolioMemoryStudy: { ...portfolioMemoryStudy },\n      routedOutputSha256: new Bun.CryptoHasher("sha256").update(JSON.stringify(traces)).digest("hex"),\n'
            p.write_text(study+s.replace(anchor,addition+anchor))
          PY
          for variant in base current; do
            (cd "$variant" && bun install) > "$variant-install.log" 2>&1
          done
      - name: Run the original sample without concurrent sample pressure
        run: |
          for variant in base current; do
            (cd "$variant" && bash ./benchmark.sh --dataset 18 --sample-numbers 2 --concurrency 1) > "$variant-run.log" 2>&1
          done
      - name: Report aggregate candidate counts and buffer sizes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows={}
          for variant in ['base','current']:
            tests=json.loads(Path(variant,'benchmark-result.json').read_text())['tests']
            assert len(tests)==1
            r=tests[0]
            assert r['didSolve'] and r['drcErrorCount']==0
            rows[variant]={'timeMs':r['elapsedTimeMs'],'peakRssMiB':r['peakRssBytes']/1048576,'outputHash':r['routedOutputSha256'],'candidates':r['portfolioMemoryStudy']}
          assert rows['base']['outputHash']==rows['current']['outputHash']
          print('PORTFOLIO_RETENTION_NUMERIC',json.dumps(rows))
          PY

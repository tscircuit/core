name: Benchmark declared DDR pad clearance end to end
on:
  push:
    branches: [analysis/ddr-butterstick-force-epsilon]
    paths: [.github/workflows/ddr-butterstick-force-epsilon.yml]
permissions:
  contents: read
jobs:
  build:
    name: Build source ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: head, ref: dfc2b188ce0f9204cac4eb4047e84cd0a7991f87}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install and build the actual source package
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("package.json")
          m=json.loads(p.read_text())
          m["overrides"]={**m.get("overrides",{}),"csstype":"3.1.3"}
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install
          bun test --timeout 9999999 tests/repro/pipeline9-imx6-fixed-via-force-full-board.test.ts
          bunx tsc --noEmit
          bun run build
          mkdir -p /tmp/ddr-capacity-package
          npm pack --ignore-scripts --pack-destination /tmp/ddr-capacity-package
          cp /tmp/ddr-capacity-package/*.tgz capacity-autorouter.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: ddr-capacity-source-${{ matrix.label }}
          path: capacity-autorouter.tgz
  benchmark:
    needs: build
    name: Native ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {circuit: butterstick, order: "head"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: ddr-capacity-source-head
          path: packages/head
      - name: Install exact published stacks and identical native fixtures
        run: |
          cat > prepare-published.private.mjs <<'JS'
          import {mkdir,writeFile,readFile,symlink} from "node:fs/promises"
          import path from "node:path"
          const benchmark="github:ShiboSoftwareDev/core-ddr-benchmark#24dc44c166d4258c3538f8b1f66953f1b6f58690"
          function exact(declared) {
           const version=declared.replace(/^[~^]/,"")
           if(!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(version))throw Error("Expected exact release: "+declared)
           return version
          }
          async function metadata(name,version) {
           const response=await fetch("https://registry.npmjs.org/"+name+"/"+version)
           if(!response.ok)throw Error("Registry request failed: "+name+" "+version+" "+response.status)
           return await response.json()
          }
          for(const release of [
           {label:"head",tscircuit:"0.0.3235",core:"0.0.2417",autorouter:"0.0.1129",sourceRevision:"dfc2b188ce0f9204cac4eb4047e84cd0a7991f87"}
          ]) {
           const published=await metadata("tscircuit",release.tscircuit)
           const core=await metadata("@tscircuit/core",release.core)
           const dependencies={"tscircuit":release.tscircuit,"@tscircuit/core":release.core,"@tscircuit/capacity-autorouter":"file:../packages/"+release.label+"/capacity-autorouter.tgz","@tscircuit/core-ddr-benchmark":benchmark}
           for(const name of ["@tscircuit/checks","@tscircuit/props","circuit-json","@tscircuit/fanout-solver"])
            dependencies[name]=exact(published.dependencies[name]??core.devDependencies[name])
           dependencies["@tscircuit/bus-lanes-solver"]=core.devDependencies["@tscircuit/bus-lanes-solver"]
           await mkdir(release.label,{recursive:true})
           await writeFile(release.label+"/package.json",JSON.stringify({name:"native-ddr-"+release.label,private:true,type:"module",dependencies},null,2))
           await writeFile(release.label+"/index.ts",'export { RootCircuit } from "tscircuit"\n')
           await writeFile(release.label+"/tsconfig.json",await readFile("tsconfig.json"))
           await symlink(path.resolve("lib"),release.label+"/lib","dir")
           await writeFile(release.label+"/published-runtime.json",JSON.stringify({...release,benchmark,tscircuitIntegrity:published.dist.integrity,coreIntegrity:core.dist.integrity,sourceTreeExecuted:false,dependencies},null,2))
          }
          JS
          node prepare-published.private.mjs
          (cd base && bun install --ignore-scripts)
          (cd head && bun install --ignore-scripts)
      - name: Route real TSX circuits through published Core
        env:
          CIRCUIT: ${{ matrix.circuit }}
          RELEASE_ORDER: ${{ matrix.order }}
        run: |
          mkdir -p results
          infrastructure_status=0
          for release in $RELEASE_ORDER; do
            bun "$GITHUB_WORKSPACE/$release/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" --core "$GITHUB_WORKSPACE/$release" --out "$GITHUB_WORKSPACE/results/$release" --circuit "$CIRCUIT" --timeout 1200 > "native-$release.private.log" 2>&1 || infrastructure_status=$?
            cp "$release/published-runtime.json" "results/$release/"
          done
          exit "$infrastructure_status"
      - name: Compare using one validator and render every board
        if: always()
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          cat > inspect-published.private.ts <<'TS'
          import {readFileSync,writeFileSync,existsSync,mkdirSync} from "node:fs"
          import path from "node:path"
          import {createHash} from "node:crypto"
          const checks=await import(path.resolve("head/node_modules/@tscircuit/checks/dist/index.js"))
          const svg=await import(Bun.resolveSync("circuit-to-svg",path.resolve("head")))
          const assessmentScript=path.resolve("head/node_modules/@tscircuit/core-ddr-benchmark/scripts/assess.ts")
          const circuitName=process.env.CIRCUIT
          mkdirSync("svgs",{recursive:true});mkdirSync("metrics",{recursive:true})
          for(const release of ["head"]) {
           const root=path.resolve("results",release)
           if(!existsSync(root+"/results.json"))throw Error("Missing native render results "+release)
           const report=JSON.parse(readFileSync(root+"/results.json","utf8"))
           const published=JSON.parse(readFileSync(root+"/published-runtime.json","utf8"))
           for(const row of report.cases) {
            const dir=path.join(root,row.circuit)
            const circuitFile=dir+"/circuit.json"
            if(!existsSync(circuitFile))throw Error("Missing Circuit JSON "+release)
            const circuit=JSON.parse(readFileSync(circuitFile,"utf8"))
            const reassessment=Bun.spawnSync([process.execPath,assessmentScript,path.resolve("head"),row.circuit,dir],{stdout:"pipe",stderr:"pipe",timeout:120000})
            if(reassessment.exitCode!==0)throw Error("Shared-validator reassessment failed")
            const assessment=JSON.parse(readFileSync(dir+"/assessment.json","utf8"))
            const physicalFindings=Object.entries(assessment.findings).filter(([name])=>!["missing_traces","disconnected_ports"].includes(name)).reduce((sum,[,count])=>sum+Number(count),0)
            const options={minClearance:0}
            const zeroClearance=Object.fromEntries(Object.entries({trace_overlap:checks.checkEachPcbTraceNonOverlapping(circuit,options),pad_trace:checks.checkPadTraceClearance(circuit,options),via_trace:checks.checkViaTraceClearance(circuit,options),via_pad:checks.checkViaPadClearance(circuit,options)}).map(([kind,errors])=>[kind,errors.filter(e=>e.type.endsWith("_error")).length]))
            const dependencies=Object.fromEntries(["tscircuit","@tscircuit/core","@tscircuit/capacity-autorouter","@tscircuit/bus-lanes-solver","@tscircuit/fanout-solver","@tscircuit/checks","@tscircuit/props","circuit-json"].map(name=>[name,JSON.parse(readFileSync(path.resolve(release,"node_modules",name,"package.json"),"utf8")).version]))
            if(dependencies.tscircuit!==published.tscircuit||dependencies["@tscircuit/core"]!==published.core||dependencies["@tscircuit/capacity-autorouter"]!==published.autorouter)throw Error("Unexpected installed routing versions")
            const errors=row.progress?.errors??[]
            const errorText=errors.join(" ")
            const reason=/time.?out|iteration/i.test(errorText)?"search_limit":/path|region|graph/i.test(errorText)?"path_planning":/route|solv/i.test(errorText)?"routing_failure":errors.length?"render_error":row.status==="timeout"?"render_timeout":null
            const metric={release,sourceRevision:published.sourceRevision,comparisonValidatorVersion:"0.0.280",circuit:row.circuit,status:row.status,seconds:row.wallMs/1000,peakRssMb:row.peakRssMb,connected:assessment.connectedNets,requested:assessment.requestedNets,vias:assessment.vias,findings:assessment.findings,geometryErrorCount:assessment.geometryErrors.length,zeroClearance,physicalFindings,validationVersion:dependencies["@tscircuit/checks"],dependencies,fixtureHash:report.fixtureHashes[row.circuit],phases:row.progress?.phases.map(({phase,status,connections,durationMs})=>({phase,status,connections,durationMs})),lastSolver:row.progress?.solverEvents.at(-1)?.solverName,progressErrorCount:errors.length,reason,copperSha256:createHash("sha256").update(JSON.stringify(circuit.filter(p=>p.type==="pcb_trace"||p.type==="pcb_via"))).digest("hex")}
            writeFileSync("metrics/"+row.circuit+"-"+release+".json",JSON.stringify(metric,null,2))
            writeFileSync("svgs/"+row.circuit+"-"+release+".svg",await svg.convertCircuitJsonToPcbSvg(circuit,{backgroundColor:"white",width:1400,height:1000,includeVersion:false,renderSolderMask:false,shouldDrawRatsNest:false}))
            console.log("PUBLISHED_DDR_METRICS="+JSON.stringify(metric))
           }
          }
          TS
          bun inspect-published.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-pad-clearance-${{ matrix.circuit }}
          path: |
            metrics/*.json
            svgs/*.svg
          if-no-files-found: warn
      - name: Save the public-board remaining-phase input for the repro
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,gzip
          root=pathlib.Path("results/head/butterstick")
          files=sorted(root.glob("phase-*-start.srj.json"),key=lambda p:int(p.name.split("-")[1]))
          if not files:raise RuntimeError("No phase input was captured")
          pathlib.Path("butterstick-remaining.srj.json.gz").write_bytes(gzip.compress(files[-1].read_bytes(),mtime=0))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: butterstick-repro-input
          path: butterstick-remaining.srj.json.gz

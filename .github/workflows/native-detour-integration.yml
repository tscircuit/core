name: Evaluate existing native-detour cleanup fix with exact copper queries
on:
  push:
    branches: [analysis/core-native-complete-ci]
    paths: [.github/workflows/native-detour-integration.yml]
permissions:
  contents: read
jobs:
  original-assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      built: ${{ steps.pack.outputs.built }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-repair01
          ref: 565efc51c7c9afb6433f9fcecdf51e9ccd9ec74f
          path: repair-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-repair01
          ref: 84cb6557d6b7cc5dce1e64d615e81b384d4a998b
          path: repair-detours
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 11396d1303dd7cab1849850f868ae356f35036a6
          path: autorouter
          persist-credentials: false
      - run: bun install
        working-directory: autorouter
      - name: Merge the existing detour change into the installed force kernel for this experiment
        run: |
          git merge-file -p autorouter/node_modules/high-density-repair01/lib/HighDensityForceImproveSolver.ts repair-base/lib/HighDensityForceImproveSolver.ts repair-detours/lib/HighDensityForceImproveSolver.ts > force-merged.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('autorouter/node_modules/high-density-repair01/lib/HighDensityForceImproveSolver.ts')
          replacement=p.with_suffix('.analysis.ts')
          replacement.write_bytes(Path('force-merged.ts').read_bytes())
          replacement.replace(p)
          p=Path('autorouter/node_modules/high-density-repair01/lib/utils/high-density-force-improve-topology.ts')
          replacement=p.with_suffix('.analysis.ts')
          replacement.write_bytes(Path('repair-detours/lib/utils/high-density-force-improve-topology.ts').read_bytes())
          replacement.replace(p)
          Path('autorouter/lib/solvers/HyperHighDensitySolver/createIntraNodeSegmentValidator.ts').write_text("import type { StaticSegmentValidator } from \"@tscircuit/high-density-a01\"\nimport type { ConnectivityMap } from \"circuit-json-to-connectivity-map\"\nimport {\n  arePipeline9RoutesOnSameNet,\n  doPipeline9RoutesHaveCopperConflict,\n  getPipeline9RouteCopperGeometry,\n} from \"lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/pipeline9FixedRouteCopper\"\nimport type { HighDensityRoute } from \"lib/types/high-density-types\"\nimport { FlatbushIndex } from \"lib/data-structures/FlatbushIndex\"\n\n/** Reuse native copper validation while A03 searches in physical coordinates. */\nexport const createIntraNodeSegmentValidator = ({\n  fixedHdRoutes,\n  connMap,\n  layerCount,\n  clearance,\n  allowBlindAndBuriedVias,\n}: {\n  fixedHdRoutes: HighDensityRoute[]\n  connMap: ConnectivityMap\n  layerCount: number\n  clearance: number\n  allowBlindAndBuriedVias?: boolean\n}): StaticSegmentValidator => {\n  const copper = fixedHdRoutes.flatMap((route) => {\n    const geometry = getPipeline9RouteCopperGeometry(route, {\n      layerCount,\n      allowBlindAndBuriedVias,\n    })\n    return [\n      ...geometry.wireSegments.map((wire) => ({\n        route,\n        start: wire.start,\n        end: wire.end,\n        radius: wire.width / 2,\n      })),\n      ...geometry.viaSpans.map((via) => ({\n        route,\n        start: via.center,\n        end: via.center,\n        radius: via.diameter / 2,\n      })),\n    ]\n  })\n  let index: FlatbushIndex<HighDensityRoute> | undefined\n  if (copper.length > 0) {\n    index = new FlatbushIndex<HighDensityRoute>(copper.length)\n    for (const primitive of copper) {\n      index.insert(\n        primitive.route,\n        Math.min(primitive.start.x, primitive.end.x) - primitive.radius,\n        Math.min(primitive.start.y, primitive.end.y) - primitive.radius,\n        Math.max(primitive.start.x, primitive.end.x) + primitive.radius,\n        Math.max(primitive.start.y, primitive.end.y) + primitive.radius,\n      )\n    }\n    index.finish()\n  }\n  return (segment): boolean => {\n    if (!index) return true\n    const route: HighDensityRoute = {\n      ...segment,\n      route: [segment.start, segment.end],\n      vias: [],\n    }\n    if (segment.start.z !== segment.end.z) route.vias.push(segment.start)\n    const radius =\n      Math.max(segment.traceThickness, segment.viaDiameter) / 2 + clearance\n    const bounds = {\n      minX: Math.min(segment.start.x, segment.end.x) - radius,\n      maxX: Math.max(segment.start.x, segment.end.x) + radius,\n      minY: Math.min(segment.start.y, segment.end.y) - radius,\n      maxY: Math.max(segment.start.y, segment.end.y) + radius,\n    }\n    const nearbyRoutes = new Set(\n      index.search(bounds.minX, bounds.minY, bounds.maxX, bounds.maxY),\n    )\n    for (const fixed of nearbyRoutes) {\n      if (arePipeline9RoutesOnSameNet(route, fixed, connMap)) continue\n      if (\n        doPipeline9RoutesHaveCopperConflict({\n          left: fixed,\n          right: route,\n          leftBounds: bounds,\n          clearance,\n          layerCount,\n          allowBlindAndBuriedVias,\n        })\n      ) {\n        return false\n      }\n    }\n    return true\n  }\n}\n")
          PY
      - name: Build and package the temporary analysis candidate
        id: pack
        working-directory: autorouter
        run: |
          bun run build
          mkdir ../candidate
          npm pack --pack-destination ../candidate
          mv ../candidate/*.tgz ../candidate/autorouter.tgz
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: native-detour-analysis-code
          path: candidate/autorouter.tgz
      - name: Preserve all original autorouter physical assertions
        working-directory: autorouter
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v4
        with:
          ref: 7d28fe0bdc6c57b828e54c6cd8e32bcc13d2ee1e
          path: core
          persist-credentials: false
      - name: Install the built analysis candidate
        working-directory: core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['devDependencies']['@tscircuit/capacity-autorouter']='file:../candidate/autorouter.tgz'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Preserve all original Core physical assertions
        working-directory: core
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repros/repro-fanout-routed-layer-impact.test.tsx tests/repros/repro-autorouter-clearance-board.test.tsx
  benchmark:
    needs: original-assertions
    if: always() && needs.original-assertions.outputs.built == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: native-detour-analysis-code
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 395fffa2392f08af3effcc6e0e21f54a3729302d
          path: current
          persist-credentials: false
      - run: bun install --ignore-scripts
        working-directory: current
      - uses: actions/checkout@v4
        with:
          ref: 7d28fe0bdc6c57b828e54c6cd8e32bcc13d2ee1e
          path: core
          persist-credentials: false
      - name: Install candidate on the native handoff
        working-directory: core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['devDependencies']['@tscircuit/capacity-autorouter']='file:../candidate/autorouter.tgz'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          bun install
      - name: Compare unchanged real DDR circuits on the same runner
        run: |
          benchmark="$GITHUB_WORKSPACE/core/node_modules/@tscircuit/core-ddr-benchmark/scripts"
          bun "$benchmark/run.ts" --core "$GITHUB_WORKSPACE/current" --out "$GITHUB_WORKSPACE/results/current" --timeout 120 --circuit h616 --circuit glider --circuit orangecrab
          bun "$benchmark/run.ts" --core "$GITHUB_WORKSPACE/core" --out "$GITHUB_WORKSPACE/results/detours" --timeout 120 --circuit h616 --circuit glider --circuit orangecrab
          python3 - <<'PY'
          import json
          from pathlib import Path
          for variant in ['current','detours']:
            d=json.loads(Path('results',variant,'results.json').read_text())
            for row in d['cases']:
              a=row.get('assessment') or {}
              print('CORE_DDR_AGGREGATE',json.dumps({'variant':variant,'circuit':row['circuit'],'status':row['status'],'wallMs':row['wallMs'],'peakRssMb':row['peakRssMb'],'connectedNets':a.get('connectedNets'),'findings':a.get('findings')}))
          PY

s":[{"file":"actual-solver-2.srj.json","sha256":"4b11f950a5bd421ca025bd5b98a61a9a36e44c7a0cc672250ea5f49e6f1efb04","fixed":0,"editable":0,"layerDomains":0},{"file":"actual-solver-3.srj.json","sha256":"e8159454b43a0161cb9c7ab909e3e9e3508a8ede4bacaa05b7b3e202eb0a4359","fixed":8,"editable":0,"layerDomains":8},{"file":"actual-solver-4.srj.json","sha256":"13523e74948df55f90f76a6c4d0ba012f88840f9684af208994998d658089e28","fixed":16,"editable":0,"layerDomains":16},{"file":"actual-solver-5.srj.json","sha256":"fd0d19af4e7e18fb2633b39924db3636aa90bdd4f7cb0d212de96f7133a11d86","fixed":24,"editable":0,"layerDomains":24},{"file":"actual-solver-6.srj.json","sha256":"017f37fd84a7cc2647acb48978f4cc0c92bf0b76882955333200918364aad299","fixed":0,"editable":32,"layerDomains":32}]},"butterstick":{"connected":55,"copper":"ec0a381f4693c8a70e8fa7c47d12d51930523200f467176e5023022a01b3b77c","fixture":"3d3b3eed75a4638259c4d139f61be5ad9140fd13ec401bf6e2d17d2940aaee59","inputs":[{"file":"actual-solver-2.srj.json","sha256":"2b93532bb5fff7a30292a9b15620b063e93509ddd52d73949e3caa19bd81f2ef","fixed":0,"editable":0,"layerDomains":0},{"file":"actual-solver-3.srj.json","sha256":"3f006c20fe9904db7b9032cd145c4d7dd90d34d53255ff67a71c2bf4d9c6f909","fixed":16,"editable":0,"layerDomains":0},{"file":"actual-solver-4.srj.json","sha256":"30f47a4702887d95e4af4bbe4a59ec1ed8511bcf4bb61b0bae463c80c6625829","fixed":32,"editable":0,"layerDomains":0}]}}
          const expected=controls[circuit].connected
          for(const row of rows){if(row.copperSha256!==controls[circuit].copper)throw Error("Cleanup changed final copper");if(row.fixtureHash!==controls[circuit].fixture)throw Error("Different fixture");if(JSON.stringify(row.actualSolverInputs)!==JSON.stringify(controls[circuit].inputs))throw Error("Different actual native input");if(row.executedAutorouterSha256==="ee46c4a5793703f442dc0a198e3d4a879bb8d562f2e09657bf6b2eea68087b2e")throw Error("Final cleanup was not executed")}
          for(const row of rows)if(row.connected<expected||row.physicalFindings!==0||row.geometryErrorCount!==0)throw Error("Conventional negotiation lost validated progress")
          TS
          bun report.private.ts
      - uses: actions/upload-artifact@v4

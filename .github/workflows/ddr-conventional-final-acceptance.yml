name: Accept the final all-ten cleanup with matching hash formats
on:
  push:
    branches: [analysis/conventional-native-negotiation-20261123]
    paths: [.github/workflows/ddr-conventional-final-acceptance.yml]
permissions:
  contents: read
  actions: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for all existing board measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/tscircuit/core/actions/runs/45134115769'
          for attempt in range(140):
            request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request)as response:run=json.load(response)
            if run['status']=='completed':break
            time.sleep(10)
          else:raise RuntimeError('Measurements did not complete')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: native-trace-layer-mask-*
          path: measured
          run-id: 45134115769
          github-token: ${{ github.token }}
      - name: Verify every unchanged input and complete copper record

name: Inspect incomplete native DDR routing in3276
on:
  push:
    branches: [analysis/ddr-3276-completion-20261122]
    paths: [.github/workflows/ddr-3276-inspect-incomplete.yml]
permissions:
  contents: read
  actions: write
jobs:
  benchmark:
    name: Native ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {circuit: a64}
          - {circuit: stmp157}
    steps:
      - name: Stop superseded full diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const old=await github.rest.actions.getWorkflowRun({owner:"tscircuit",repo:"core",run_id:44992362452})
            if(old.data.status!=="completed")await github.rest.actions.cancelWorkflowRun({owner:"tscircuit",repo:"core",run_id:44992362452})
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install exact published stacks and identical native fixtures
        run: |
          cat > prepare-published.private.mjs <<'JS'
          import {mkdir,writeFile,readFile,symlink} from "node:fs/promises"
          import path from "node:path"
          const benchmark="github:ShiboSoftwareDev/core-ddr-benchmark#24dc44c166d4258c3538f8b1f66953f1b6f58690"
          function exact(declared) {
           const version=declared.replace(/^[~^]/,"")
           if(!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(version))throw Error("Expected exact release: "+declared)
           return version
          }
          async function metadata(name,version) {
           const response=await fetch("https://registry.npmjs.org/"+name+"/"+version)
           if(!response.ok)throw Error("Registry request failed: "+name+" "+version+" "+response.status)
           return await response.json()
          }
          for(const release of [
           {label:"previous",tscircuit:"0.0.3275",core:"0.0.2456",autorouter:"0.0.1149",sourceRevision:"published-0.0.3275"},
           {label:"latest",tscircuit:"0.0.3276",core:"0.0.2457",autorouter:"0.0.1152",sourceRevision:"published-0.0.3276"}
          ]) {
           const published=await metadata("tscircuit",release.tscircuit)
           const core=await metadata("@tscircuit/core",release.core)
           const dependencies={"tscircuit":release.tscircuit,"@tscircuit/core":release.core,"@tscircuit/capacity-autorouter":release.autorouter,"@tscircuit/core-ddr-benchmark":benchmark}
           for(const name of ["@tscircuit/checks","@tscircuit/props","circuit-json","@tscircuit/fanout-solver"])
            dependencies[name]=exact(published.dependencies[name]??core.devDependencies[name])
           dependencies["@tscircuit/bus-lanes-solver"]=core.devDependencies["@tscircuit/bus-lanes-solver"]
           await mkdir(release.label,{recursive:true})
           await writeFile(release.label+"/package.json",JSON.stringify({name:"native-ddr-"+release.label,private:true,type:"module",dependencies},null,2))
           await writeFile(release.label+"/index.ts",'export { RootCircuit } from "tscircuit"\n')
           await writeFile(release.label+"/tsconfig.json",await readFile("tsconfig.json"))
           await symlink(path.resolve("lib"),release.label+"/lib","dir")
           await writeFile(release.label+"/published-runtime.json",JSON.stringify({...release,benchmark,tscircuitIntegrity:published.dist.integrity,coreIntegrity:core.dist.integrity,sourceTreeExecuted:false,dependencies},null,2))
          }
          JS
          node prepare-published.private.mjs
          (cd previous && bun install --ignore-scripts --backend=copyfile)
          (cd latest && bun install --ignore-scripts --backend=copyfile)
      - name: Capture the unchanged detailed-routing failure
        env:
          DDR_BOARD: ${{ matrix.circuit }}
        run: |
          mkdir diagnostic-output
          cat > inspect-solvers.private.ts <<'TS'
          import {writeFileSync} from "node:fs"
          import path from "node:path"
          const root=path.resolve("latest")
          const ar=await import(Bun.resolveSync("@tscircuit/capacity-autorouter",root))
          const output=path.resolve("diagnostic-output")
          function replace(_key: string,entry: unknown): unknown {
            if(entry instanceof Map)return Object.fromEntries(entry)
            if(entry instanceof Set)return [...entry]
            return entry
          }
          function save(name: string,entry: unknown): void {
            writeFileSync(output+"/"+name+".json",JSON.stringify(entry,replace))
          }
          function describe(solver: any,depth=0): unknown {
            if(!solver||depth>7)return null
            const childKeys=["activeSubSolver","activeSolver","activeB01Solver","activeRegularSolver","activeFallbackSolver","activeNodeSolver","currentSolver"]
            return {name:solver.getSolverName?.()??solver.constructor.name,iterations:solver.iterations,maxIterations:solver.MAX_ITERATIONS,solved:solver.solved,failed:solver.failed,error:solver.error,stats:solver.stats,activeNode:solver.activeNode,unsolvedNodes:solver.unsolvedNodePortPoints?.length,routes:solver.routes?.length,children:Object.fromEntries(childKeys.filter(key=>solver[key]).map(key=>[key,describe(solver[key],depth+1)]))}
          }
          const hd=ar.Pipeline9HighDensitySolver.prototype
          const original=hd._step
          let serial=0
          hd._step=function(): void {
            if(!this.__ddrCapture){
              this.__ddrCapture={id:serial++,previous:null}
              if(this.fixedHdRoutes.length>=16)save("hd-input-"+this.__ddrCapture.id,this.params)
            }
            const capture=this.__ddrCapture
            const before=this.activeFallbackSolver??this.activeB01Solver??this.activeRegularSolver
            original.call(this)
            const after=this.activeFallbackSolver??this.activeB01Solver??this.activeRegularSolver
            if(capture.previous!==after){capture.previous=after;capture.activeStarted=performance.now()}
            if(after&&this.fixedHdRoutes.length>=16&&this.iterations%4096===0&&performance.now()-capture.activeStarted>30000){
              const snapshot={detail:describe(this),hdParams:this.params,activeParams:after.params??after.getConstructorParams?.()}
              save("blocked-search",snapshot)
              const {gzipSync}=require("node:zlib")
              const zipped=gzipSync(JSON.stringify(snapshot,replace))
              writeFileSync(output+"/blocked-search.json.gz",zipped)
              const encoded=zipped.toString("base64")
              for(let i=0;i<encoded.length;i+=12000)console.log("DDR_BLOCKED_SEARCH_GZIP_"+String(i/12000).padStart(3,"0")+"="+encoded.slice(i,i+12000))
              console.log("DDR_BLOCKED_SEARCH="+JSON.stringify(describe(this)))
              process.exit(0)
            }
            if(before!==after&&before?.failed){
              const detail=describe(before)
              console.log("DDR_CHILD_FAILURE="+JSON.stringify({hd:capture.id,detail}))
              save("hd-"+capture.id+"-child-failure-"+this.stats.solvedNodeCount+"-"+before.getSolverName(),{detail,params:before.getConstructorParams?.()})
            }
            if(this.failed){
              const detail=describe(this)
              save("hd-"+capture.id+"-failure",{detail,params:this.params})
              console.log("DDR_HD_FAILURE="+JSON.stringify(detail))
            }
          }
          const pipeline=ar.AutoroutingPipelineSolver9_PreloadedTraceGraph.prototype
          const pipelineStep=pipeline._step
          pipeline._step=function(): void {
            pipelineStep.call(this)
            if(this.failed)console.log("DDR_PIPELINE_FAILURE="+JSON.stringify({phase:this.getCurrentPhase(),error:this.error,detail:describe(this.activeSolver)}))
          }
          TS
          bun --preload ./inspect-solvers.private.ts --tsconfig-override "$GITHUB_WORKSPACE/latest/tsconfig.json" "$GITHUB_WORKSPACE/latest/node_modules/@tscircuit/core-ddr-benchmark/scripts/worker.tsx" "$GITHUB_WORKSPACE/latest" "$DDR_BOARD" "$GITHUB_WORKSPACE/diagnostic-output" full > diagnostic-render.log 2>&1
          python - <<'PY'
          import json
          for line in open('diagnostic-render.log'):
            if line.startswith(('DDR_HD_FAILURE=','DDR_CHILD_FAILURE=','DDR_PIPELINE_FAILURE=','DDR_BLOCKED_SEARCH=','DDR_BLOCKED_SEARCH_GZIP_')):print(line.rstrip())
          p=json.load(open('diagnostic-output/progress.json'))
          print('DDR_FINAL_PROGRESS='+json.dumps({'errors':p['errors'],'phases':p['phases'],'lastSolvers':p['solverEvents'][-12:]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native3276-routing-diagnostic-${{ matrix.circuit }}
          path: |
            diagnostic-output
            diagnostic-render.log
          retention-days: 7

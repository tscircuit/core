name: Review motor snapshot
on:
  push:
    branches: [codex/review-bullet-motor-snapshot-20261006]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: VERCEL_ENV=preview bun scripts/prepare-bullet-preview-dependencies.ts
      - run: bun install
      - run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/assembly/assembly-cable-motor-controller.test.tsx --timeout 30000
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-motor-snapshot
          path: tests/assembly/__snapshots__/assembly-cable-motor-controller-annotated.snap.png

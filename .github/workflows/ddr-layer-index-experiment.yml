name: Native DDR exact fixed-copper experiment
on:
  push:
    branches: [artifacts/ddr-layer-index-experiment]
permissions:
  contents: read
jobs:
  benchmark:
    name: Exact copper ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        circuit: [a13, butterstick, h3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 778ee4a2f3eca1e7222f0f33a0c358fc834875ad
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: published-ddr-3209-${{ matrix.circuit }}
          run-id: 44050671541
          github-token: ${{ github.token }}
          path: published
      - name: Match the published routing dependencies
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs'
          const p=JSON.parse(readFileSync('package.json','utf8'))
          const published=JSON.parse(readFileSync('published/head/published-runtime.json','utf8'))
          for(const [name,version] of Object.entries(published.dependencies)) {
            if(['tscircuit','@tscircuit/core'].includes(name))continue
            p.devDependencies[name]=version
            p.overrides={...p.overrides,[name]:version}
          }
          writeFileSync('package.json',JSON.stringify(p,null,2))
          JS
          bun install --ignore-scripts
      - name: Route unchanged native TSX through Core
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: bun node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts --core "$GITHUB_WORKSPACE" --out results --circuit "$CIRCUIT" --timeout 600
      - name: Report real routing and input geometry
        if: always()
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,readdirSync,existsSync} from 'node:fs'
          const root='results/'+process.env.CIRCUIT
          if(existsSync('results/results.json'))console.log('EXACT_CORE_RESULT_JSON='+readFileSync('results/results.json','utf8'))
          for(const file of readdirSync(root).filter(f=>/phase-.*-start.srj.json/.test(f))) {
            const input=JSON.parse(readFileSync(root+'/'+file,'utf8'))
            console.log('EXACT_CORE_INPUT_JSON='+JSON.stringify({file,connections:input.connections.length,obstacles:input.obstacles.length,traces:input.traces?.length??0,fixedTraces:input.traces?.filter(t=>t.isFixed).length??0}))
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-fixed-copper-${{ matrix.circuit }}
          path: results/
          retention-days: 14

name: Smoke Test Dist

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare unreleased bullet dependencies for PR tests
        run: bun scripts/prepare-bullet-preview-dependencies.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Project
        run: bun run build

      - name: Run smoke test script
        run: bun run smoke-test:dist

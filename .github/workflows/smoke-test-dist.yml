name: Smoke Test Dist

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Project
        run: bun run build

      - name: Run smoke test script
        run: bun run smoke-test:dist

      - name: Smoke test standalone packed install
        run: |
          TARBALL="$(npm pack)"
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR" "$GITHUB_WORKSPACE/$TARBALL"' EXIT
          cd "$SMOKE_DIR"
          echo '{"type":"module"}' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"
          node -e 'import("@tscircuit/core")'

      - name: Build browser benchmarks
        run: bun run build:benchmarking

   (route) => route.isFixed === true,\n    )\n    let regionalCopperRoutes: HighDensityRoute[] =\n      this.activeFallbackFixedObstacleRoutes\n    if (hasImmutablePreload) {\n      // Native-copper repairs can leave the mesh cell. Keep completed neighbors\n      // in their physical frame along with the immutable preloaded paths.\n      const regionalBounds = getNodeBounds(regionalNode, this.obstacleMargin)\n      const routedCopperRoutes = this.routes.filter((route) =>\n        routeOverlapsNode(\n          route,\n          regionalNode,\n          regionalBounds,\n          Math.max(this.traceWidth, this.viaDiameter) / 2,\n          this,\n        ),\n      )\n      regionalCopperRoutes = [...regionalCopperRoutes, ...routedCopperRoutes]\n    }\n\n    if (hasImmutablePreload) {\n      const getBlockedPortCount = (routes: HighDensityRoute[], clearance: number): number =>\n        fallbackProblem.nodeWithPortPoints.portPoints.filter((point) => {\n          const route: HighDensityRoute = {\n            connectionName: point.connectionName,\n            rootConnectionName: point.rootConnectionName,\n            traceThickness: this.traceWidth,\n            viaDiameter: this.viaDiameter,\n            route: [point, { ...point, x: point.x + 1e-7 }],\n            vias: [],\n          }\n          return routes.some((fixed) =>\n            !arePipeline9RoutesOnSameNet(route, fixed, this.connMap) &&\n            doPipeline9RoutesHaveCopperConflict({\n              left: route, right: fixed, clearance,\n              layerCount: this.layerCount,\n              allowBlindAndBuriedVias: this.allowBlindAndBuriedVias,\n            }),\n          )\n        }).length\n      const fixed = this.activeFallbackFixedObstacleRoutes\n      const ports = fallbackProblem.nodeWithPortPoints.portPoints\n      console.log(\"REGIONAL_ACCESS_PROFILE\", JSON.stringify({\n        solvedNodes: this.stats.solvedNodeCount,\n        remainingNodes: this.unsolvedNodePortPoints.length,\n        por
name: Diagnose fresh DDR regional terminal access
on:
  push:
    branches: [analysis/core-native-complete-ci]
    paths: [.github/workflows/native-ddr-access.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'blacksmith-8vcpu-ubuntu-2404-arm' }}
    timeout-minutes: 35
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: aa55c35bfbb3229fe6670a658379541f18e5f6b0
          path: autorouter
          persist-credentials: false
      - name: Build exact bounded-query candidate
        working-directory: autorouter
        run: |
          bun install
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts")
          p.write_text("import type { SolverRuntimeExecutor } from \"@tscircuit/solver-utils\"\nimport { Pipeline9HighDensityBatchSolver } from \"./Pipeline9HighDensityBatchSolver\"\nimport {\n  defaultB01Params,\n  HighDensitySolverB01,\n  type HighDensityObstacle,\n  type HighDensityRectObstacle,\n  type HighDensityRouteObstacle,\n  type NodeWithPortPoints as B01NodeWithPortPoints,\n} from \"@tscircuit/high-density-b01\"\nimport type { ConnectivityMap } from \"circuit-json-to-connectivity-map\"\nimport type { GraphicsObject } from \"graphics-debug\"\nimport type { CapacityMeshNodeId } from \"lib/types/capacity-mesh-types\"\nimport type { HighDensityBoardGeometry } from \"lib/types/high-density-board-geometry\"\nimport type {\n  HighDensityIntraNodeRoute,\n  HighDensityRoute,\n  NodeWithPortPoints,\n  PortPoint,\n} from \"lib/types/high-density-types\"\nimport type { Obstacle, SimpleRouteJson } from \"lib/types/srj-types\"\nimport { isObstacleConnectedToRoute } from \"lib/solvers/TraceWidthSolver/isObstacleConnectedToRoute\"\nimport { isPointInRect } from \"lib/utils/isPointInRect\"\nimport { mapLayerNameToZ } from \"lib/utils/mapLayerNameToZ\"\nimport { mapZToLayerName } from \"lib/utils/mapZToLayerName\"\nimport { BaseSolver } from \"../../solvers/BaseSolver\"\nimport { HighDensitySolver } from \"../../solvers/HighDensitySolver/HighDensitySolver\"\nimport type { PreloadedHighDensityRoute } from \"./convertPreloadedTraceToHdRoutes\"\nimport {\n  arePipeline9RoutesOnSameNet,\n  doPipeline9RoutesHaveCopperConflict,\n  getPipeline9RouteCopperGeometry,\n} from \"./pipeline9FixedRouteCopper\"\nimport {\n  createRegionalFallbackProblem,\n  type FixedRouteSection,\n  spliceFixedRouteSectionWithMutationMask,\n} from \"./pipeline9RegionalFallback\"\nimport { Pipeline9RegionalFallbackSolver } from \"./Pipeline9RegionalFallbackSolver\"\n\nexport type Pipeline9HighDensitySolverParams = {\n  nodePortPoints: NodeWithPortPoints[]\n  fixedHdRoutes: PreloadedHighDensityRoute[]\n  connMap: ConnectivityMap\n  colorMap?: Record<string, string>\n  obstacles: Obstacle[]\n  boardGeometry?: HighDensityBoardGeometry\n  layerCount: number\n  allowBlindAndBuriedVias?: boolean\n  viaDiameter: number\n  viaHoleDiameter?: number\n  minViaHoleEdgeToViaHoleEdgeClearance?: number\n  traceWidth: number\n  obstacleMargin: number\n  minClearance?: number\n  viaCopperClearance?: number\n  viaToPadClearance?: number\n  effort: number\n  nodePfById?:\n    | Map<CapacityMeshNodeId, number | null>\n    | Record<string, number | null>\n  preserveTerminalPcbPortIds?: boolean\n  includeBoardObstacles?: boolean\n  enableRegionalFallback?: boolean\n  maxB01Rips?: number\n  b01RepairOptions?: Pick<\n    ConstructorParameters<typeof HighDensitySolverB01>[0],\n    \"lowResolutionCellSize\" | \"obstacleClearanceMargin\"\n  >\n  captureSearchDebug?: boolean\n}\n\ntype NodeBounds = {\n  minX: number\n  maxX: number\n  minY: number\n  maxY: number\n}\n\nconst getNodeBounds = (\n  node: NodeWithPortPoints,\n  margin: number,\n): NodeBounds => ({\n  minX: node.center.x - node.width / 2 - margin,\n  maxX: node.center.x + node.width / 2 + margin,\n  minY: node.center.y - node.height / 2 - margin,\n  maxY: node.center.y + node.height / 2 + margin,\n})\n\nconst pointRadiusOverlapsNode = (\n  point: { x: number; y: number },\n  radius: number,\n  nodeBounds: NodeBounds,\n): boolean => {\n  const dx = Math.max(nodeBounds.minX - point.x, 0, point.x - nodeBounds.maxX)\n  const dy = Math.max(nodeBounds.minY - point.y, 0, point.y - nodeBounds.maxY)\n  return dx * dx + dy * dy <= radius * radius\n}\n\nconst segmentBoundsOverlapNode = (\n  start: { x: number; y: number },\n  end: { x: number; y: number },\n  radius: number,\n  nodeBounds: NodeBounds,\n): boolean =>\n  Math.min(start.x, end.x) - radius <= nodeBounds.maxX &&\n  Math.max(start.x, end.x) + radius >= nodeBounds.minX &&\n  Math.min(start.y, end.y) - radius <= nodeBounds.maxY &&\n  Math.max(start.y, end.y) + radius >= nodeBounds.minY\n\nconst routeOverlapsNode = (\n  route: HighDensityRoute,\n  node: NodeWithPortPoints,\n  nodeBounds: NodeBounds,\n  routedCopperRadius: number,\n  board: Pick<SimpleRouteJson, \"layerCount\" | \"allowBlindAndBuriedVias\">,\n): boolean => {\n  const availableZ = new Set(\n    node.availableZ ?? node.portPoints.map((portPoint) => portPoint.z),\n  )\n  const geometry = getPipeline9RouteCopperGeometry(route, board)\n  return (\n    geometry.wireSegments.some(\n      (segment) =>\n        availableZ.has(segment.z) &&\n        segmentBoundsOverlapNode(\n          segment.start,\n          segment.end,\n          segment.width / 2 + routedCopperRadius,\n          nodeBounds,\n        ),\n    ) ||\n    geometry.viaSpans.some(\n      (via) =>\n        [...availableZ].some((z) => z >= via.minZ && z <= via.maxZ) &&\n        pointRadiusOverlapsNode(\n          via.center,\n          via.diameter / 2 + routedCopperRadius,\n          nodeBounds,\n        ),\n    )\n  )\n}\n\nconst convertFixedRouteToB01Obstacles = (\n  route: PreloadedHighDensityRoute,\n  node: NodeWithPortPoints,\n  board: Pick<SimpleRouteJson, \"layerCount\" | \"allowBlindAndBuriedVias\">,\n): HighDensityRouteObstacle[] => {\n  const availableZ = new Set(\n    node.availableZ ?? node.portPoints.map((portPoint) => portPoint.z),\n  )\n  if (availableZ.size === 0) {\n    throw new Error(\n      `Pipeline9 B01 node \"${node.capacityMeshNodeId}\" has no available layers`,\n    )\n  }\n\n  const baseObstacle = {\n    type: \"route\" as const,\n    connectionName: route.connectionName,\n    rootConnectionName: route.rootConnectionName,\n    traceThickness: route.traceThickness,\n    viaDiameter: route.viaDiameter,\n  }\n  const obstacles: HighDensityRouteObstacle[] = []\n  const geometry = getPipeline9RouteCopperGeometry(route, board)\n  for (const segment of geometry.wireSegments) {\n    if (!availableZ.has(segment.z)) continue\n    obstacles.push({\n      ...baseObstacle,\n      traceThickness: segment.width,\n      route: [segment.start, segment.end],\n      vias: [],\n    })\n  }\n  for (const via of geometry.viaSpans) {\n    if (![...availableZ].some((z) => z >= via.minZ && z <= via.maxZ)) continue\n    obstacles.push({\n      ...baseObstacle,\n      viaDiameter: via.diameter,\n      route: [\n        { ...via.center, z: via.minZ },\n        { ...via.center, z: via.maxZ },\n      ],\n      vias: [\n        {\n          ...via.center,\n          zStart: via.minZ,\n          zEnd: via.maxZ,\n        },\n      ],\n    })\n  }\n  return obstacles\n}\n\nconst obstacleOverlapsNode = (\n  obstacle: Obstacle,\n  nodeBounds: NodeBounds,\n): boolean => {\n  const rotationRadians = ((obstacle.ccwRotationDegrees ?? 0) * Math.PI) / 180\n  const cos = Math.abs(Math.cos(rotationRadians))\n  const sin = Math.abs(Math.sin(rotationRadians))\n  const rotatedHalfWidth =\n    (obstacle.width / 2) * cos + (obstacle.height / 2) * sin\n  const rotatedHalfHeight =\n    (obstacle.width / 2) * sin + (obstacle.height / 2) * cos\n  return (\n    obstacle.center.x - rotatedHalfWidth <= nodeBounds.maxX &&\n    obstacle.center.x + rotatedHalfWidth >= nodeBounds.minX &&\n    obstacle.center.y - rotatedHalfHeight <= nodeBounds.maxY &&\n    obstacle.center.y + rotatedHalfHeight >= nodeBounds.minY\n  )\n}\n\nconst convertObstacleToB01Obstacle = ({\n  obstacle,\n  node,\n  connMap,\n  layerCount,\n}: {\n  obstacle: Obstacle\n  node: NodeWithPortPoints\n  connMap: ConnectivityMap\n  layerCount: number\n}): HighDensityRectObstacle | undefined => {\n  const availableZ = new Set(\n    node.availableZ ?? node.portPoints.map((portPoint) => portPoint.z),\n  )\n  const zLayers = (\n    obstacle.zLayers ??\n    obstacle.layers.map((layer) => mapLayerNameToZ(layer, layerCount))\n  ).filter((z) => availableZ.has(z))\n  if (zLayers.length === 0) return undefined\n  const connectionName =\n    obstacle.connectedTo[0] ??\n    obstacle.obstacleId ??\n    `pipeline9_obstacle_${obstacle.center.x}_${obstacle.center.y}`\n  return {\n    type: \"rect\",\n    connectionName,\n    rootConnectionName:\n      connMap.getNetConnectedToId(connectionName) ?? connectionName,\n    center: obstacle.center,\n    width: obstacle.width,\n    height: obstacle.height,\n    ccwRotationDegrees: obstacle.ccwRotationDegrees,\n    zLayers,\n  }\n}\n\n// Match board-world points in mm (+X right, +Y up) to physical terminals.\nconst addTerminalPcbPortIds = <Route extends HighDensityRoute>({\n  routes,\n  portPoints,\n  connMap,\n}: {\n  routes: Route[]\n  portPoints: PortPoint[]\n  connMap: ConnectivityMap\n}): Route[] => {\n  const terminalPorts = portPoints.filter(\n    (port) => port.pcb_port_id !== undefined,\n  )\n  return routes.map((route): Route => {\n    const start = route.route[0]\n    const end = route.route.at(-1)\n    const netId =\n      connMap.getNetConnectedToId(route.connectionName) ??\n      route.rootConnectionName ??\n      route.connectionName\n    const sameNetTerminals = terminalPorts.filter(\n      (terminal) =>\n        (connMap.getNetConnectedToId(terminal.connectionName) ??\n          terminal.rootConnectionName ??\n          terminal.connectionName) === netId,\n    )\n    const startTerminal = sameNetTerminals.find(\n      (terminal) =>\n        start !== undefined &&\n        terminal.x === start.x &&\n        terminal.y === start.y &&\n        terminal.z === start.z,\n    )\n    const endTerminal = sameNetTerminals.find(\n      (terminal) =>\n        end !== undefined &&\n        terminal.x === end.x &&\n        terminal.y === end.y &&\n        terminal.z === end.z,\n    )\n\n    const startPcbPortId = route.startPcbPortId ?? startTerminal?.pcb_port_id\n    const endPcbPortId = route.endPcbPortId ?? endTerminal?.pcb_port_id\n    if (\n      startPcbPortId === route.startPcbPortId &&\n      endPcbPortId === route.endPcbPortId\n    ) {\n      return route\n    }\n    return { ...route, startPcbPortId, endPcbPortId }\n  })\n}\n\nexport const normalizePipeline9NodeRootConnectionNames = (\n  node: NodeWithPortPoints,\n  connMap: ConnectivityMap,\n): NodeWithPortPoints => {\n  const normalizePortPoint = (\n    portPoint: NodeWithPortPoints[\"portPoints\"][number],\n  ): NodeWithPortPoints[\"portPoints\"][number] => ({\n    ...portPoint,\n    rootConnectionName:\n      connMap.getNetConnectedToId(\n        portPoint.rootConnectionName ?? portPoint.connectionName,\n      ) ??\n      portPoint.rootConnectionName ??\n      portPoint.connectionName,\n  })\n  return {\n    ...node,\n    portPoints: node.portPoints.map(normalizePortPoint),\n    portPointsInPairs: node.portPointsInPairs?.map(([start, end]) => [\n      normalizePortPoint(start),\n      normalizePortPoint(end),\n    ]),\n  }\n}\n\nconst restoreRootConnectionNames = (\n  routes: HighDensityIntraNodeRoute[],\n  node: NodeWithPortPoints,\n): HighDensityIntraNodeRoute[] =>\n  routes.map((route) => ({\n    ...route,\n    rootConnectionName:\n      node.portPoints.find(\n        (portPoint) => portPoint.connectionName === route.connectionName,\n      )?.rootConnectionName ?? route.rootConnectionName,\n  }))\n\nexport type Pipeline9RegularNodeSolverParams = {\n  nodeWithPortPoints: NodeWithPortPoints\n  connMap: ConnectivityMap\n  colorMap: Record<string, string>\n  viaDiameter: number\n  viaHoleDiameter?: number\n  minViaHoleEdgeToViaHoleEdgeClearance?: number\n  traceWidth: number\n  obstacleMargin: number\n  effort: number\n  nodePfById:\n    | Map<CapacityMeshNodeId, number | null>\n    | Record<string, number | null>\n  obstacles: Obstacle[]\n  boardGeometry?: HighDensityBoardGeometry\n  allowBlindAndBuriedVias?: boolean\n  priorityDagSearch?: boolean\n  priorityDiagnostics?: Record<string, number>\n  captureSearchDebug?: boolean\n  layerCount: number\n}\n\n/**\n * Creates the regular high-density configuration. The priority policy is\n * explicit and requires the caller's full drill context. Projected\n * network requests leave it disabled; owned local routing supplies that context.\n */\nexport const createPipeline9RegularNodeSolver = ({\n  nodeWithPortPoints,\n  connMap,\n  colorMap,\n  viaDiameter,\n  viaHoleDiameter,\n  minViaHoleEdgeToViaHoleEdgeClearance,\n  allowBlindAndBuriedVias,\n  priorityDiagnostics,\n  priorityDagSearch = false,\n  captureSearchDebug = false,\n  traceWidth,\n  obstacleMargin,\n  effort,\n  nodePfById,\n  obstacles,\n  boardGeometry,\n  layerCount,\n}: Pipeline9RegularNodeSolverParams): HighDensitySolver =>\n  new HighDensitySolver({\n    nodePortPoints: [\n      normalizePipeline9NodeRootConnectionNames(nodeWithPortPoints, connMap),\n    ],\n    colorMap,\n    connMap,\n    viaDiameter,\n    traceWidth,\n    obstacleMargin,\n    effort,\n    nodePfById,\n    obstacles,\n    layerCount,\n    useGrowShrinkHighDensityIntraNodeSolver: true,\n    enableNegotiatedSearch: true,\n    gridSearchSegmentWork: 500,\n    gridSearchWorkScale: layerCount > 2 ? 0.25 : 1,\n    rejectOverlappingTerminals: layerCount > 2,\n    boardGeometry,\n    preserveTerminalPcbPortIds: false,\n    growShrinkFallbackToInvalidGeometryOnFailure: false,\n    captureSearchDebug,\n    priorityDagSearch,\n    priorityDiagnostics,\n    viaHoleDiameter,\n    minViaHoleEdgeToViaHoleEdgeClearance,\n    allowBlindAndBuriedVias,\n  })\n\n/**\n * Uses Pipeline7's detailed solver for ordinary nodes and B01 where local\n * preloaded copper must remain a layer-aware obstacle. If B01 cannot finish,\n * the regional adapter reroutes and splices only the intersecting preload.\n */\nexport class Pipeline9HighDensitySolver extends BaseSolver {\n  readonly fixedHdRoutes: PreloadedHighDensityRoute[]\n  readonly connMap: ConnectivityMap\n  readonly colorMap: Record<string, string>\n  readonly obstacles: Obstacle[]\n  readonly boardGeometry?: HighDensityBoardGeometry\n  readonly layerCount: number\n  readonly allowBlindAndBuriedVias: boolean\n  readonly viaDiameter: number\n  readonly traceWidth: number\n  readonly obstacleMargin: number\n  readonly viaToPadClearance?: number\n  readonly effort: number\n  readonly nodePfById: Map<CapacityMeshNodeId, number | null>\n  readonly preserveTerminalPcbPortIds: boolean\n  readonly includeBoardObstacles: boolean\n  readonly enableRegionalFallback: boolean\n  readonly maxB01Rips?: number\n  readonly routes: HighDensityIntraNodeRoute[] = []\n  readonly failedSolvers: HighDensitySolverB01[] = []\n  readonly unsolvedNodePortPoints: NodeWithPortPoints[]\n  readonly fixedRouteReplacements = new Map<string, PreloadedHighDensityRoute>()\n  readonly removedFixedRouteConnectionNames = new Set<string>()\n  readonly preloadedTraceMutationMasks = new Map<string, boolean[]>()\n\n  activeRegularSolver: HighDensitySolver | null = null\n  activeB01Solver: HighDensitySolverB01 | null = null\n  activeFallbackSolver: Pipeline9RegionalFallbackSolver | null = null\n  activeFallbackFixedRouteSections = new Map<string, FixedRouteSection>()\n  activeFallbackFixedObstacleRoutes: PreloadedHighDensityRoute[] = []\n  activeFallbackPromotedFixedRouteConnectionNames = new Set<string>()\n  activeFallbackReason: string | null = null\n  activeNode: NodeWithPortPoints | null = null\n\n  private asyncRunning = false\n\n  constructor(private readonly params: Pipeline9HighDensitySolverParams) {\n    super()\n    this.connMap = params.connMap\n    this.fixedHdRoutes = addTerminalPcbPortIds({\n      routes: params.fixedHdRoutes,\n      portPoints: params.nodePortPoints.flatMap((node) => node.portPoints),\n      connMap: params.connMap,\n    }).map((route): PreloadedHighDensityRoute => {\n      const hasTerminal =\n        route.startPcbPortId !== undefined || route.endPcbPortId !== undefined\n      const isInsideConnectedPad =\n        hasTerminal &&\n        route.vias.length === 0 &&\n        params.obstacles.some((obstacle) => {\n          const isRectangularPad = obstacle.type === \"rect\" && !obstacle.shape\n          if (!isRectangularPad) return false\n          if (!isObstacleConnectedToRoute(obstacle, route, params.connMap)) {\n            return false\n          }\n          return route.route.every(\n            (point) =>\n              obstacle.layers.includes(\n                mapZToLayerName(point.z, params.layerCount),\n              ) && isPointInRect(point, obstacle),\n          )\n        })\n      if (!isInsideConnectedPad) return route\n      // This path is component copper; regional repair must preserve it.\n      return { ...route, isThroughObstacle: true }\n    })\n    this.colorMap = params.colorMap ?? {}\n    this.obstacles = params.obstacles\n    this.boardGeometry = params.boardGeometry\n    this.layerCount = params.layerCount\n    this.allowBlindAndBuriedVias = params.allowBlindAndBuriedVias ?? false\n    this.viaDiameter = params.viaDiameter\n    this.traceWidth = params.traceWidth\n    this.obstacleMargin = params.obstacleMargin\n    this.viaToPadClearance = params.viaToPadClearance\n    this.effort = params.effort\n    this.nodePfById =\n      params.nodePfById instanceof Map\n        ? new Map(params.nodePfById)\n        : new Map(Object.entries(params.nodePfById ?? {}))\n    this.preserveTerminalPcbPortIds = params.preserveTerminalPcbPortIds ?? false\n    this.includeBoardObstacles = params.includeBoardObstacles ?? false\n    this.enableRegionalFallback = params.enableRegionalFallback ?? true\n    this.maxB01Rips = params.maxB01Rips\n    this.unsolvedNodePortPoints = [...params.nodePortPoints]\n    this.MAX_ITERATIONS = 100e6 * this.effort\n    this.stats = {\n      nodeCount: params.nodePortPoints.length,\n      solvedNodeCount: 0,\n      fixedObstacleCount: params.fixedHdRoutes.length,\n      fixedObstacleUses: 0,\n      boardObstacleUses: 0,\n      fallbackNodeCount: 0,\n      regularNodeCount: 0,\n      b01NodeCount: 0,\n      reroutedFixedRouteCount: 0,\n      reroutedFixedRouteSectionCount: 0,\n      promotedFallbackAttemptCount: 0,\n      promotedFixedRouteCount: 0,\n      regionalPreloadedViaCandidateRejectionCount: 0,\n      regionalForceImproveCandidateRejectionCount: 0,\n      regionalRepairCandidateRejectionCount: 0,\n    }\n  }\n\n  readonly benchmarkDiagnosticCounters: Record<string, number> = {}\n\n  override getSolverName(): string {\n    return \"Pipeline9HighDensitySolver\"\n  }\n\n  /** Independent batches use the host runtime; preloaded repairs retain serial visibility. */\n  async solveAsync(\n    runtime?: SolverRuntimeExecutor,\n    stopAtIteration = Infinity,\n  ): Promise<void> {\n    if (this.asyncRunning)\n      throw new Error(\"High-density solveAsync is already running\")\n    if (this.solved || this.failed || this.iterations >= stopAtIteration) return\n    const startTime = performance.now()\n    try {\n      if (runtime === undefined) {\n        if (stopAtIteration === Infinity) this.solve()\n        else this.solveUntilIteration(stopAtIteration)\n        return\n      }\n      if (this.fixedHdRoutes.length > 0) {\n        this.solveUntilIteration(stopAtIteration)\n        return\n      }\n      while (\n        this.activeNode &&\n        !this.solved &&\n        !this.failed &&\n        this.iterations < stopAtIteration\n      )\n        this.step()\n      if (this.solved || this.failed || this.iterations >= stopAtIteration)\n        return\n      this.asyncRunning = true\n      const nodes = [...this.unsolvedNodePortPoints].reverse()\n      const { connMap, nodePortPoints: _, ...params } = this.params\n      // Keep the expensive board context to a bounded number of messages.\n      // Assign crowded nodes first so a difficult node does not start only\n      // after hundreds of inexpensive nodes have passed through the pool.\n      const batches = Array.from(\n        { length: Math.min(16, nodes.length) },\n        () => ({\n          work: 0,\n          nodes: [] as { node: NodeWithPortPoints; index: number }[],\n        }),\n      )\n      const plannedNodes = nodes\n        .map((node, index) => ({ node, index }))\n        .sort((a, b) => b.node.portPoints.length - a.node.portPoints.length)\n      for (const entry of plannedNodes) {\n        const batch = batches.reduce((best, candidate) =>\n          candidate.work < best.work ? candidate : best,\n        )\n        batch.nodes.push(entry)\n        batch.work += Math.max(1, entry.node.portPoints.length) ** 3\n      }\n      const pending = []\n      for (const batch of batches) {\n        const nodePfById = new Map(\n          batch.nodes.map(({ node }) => [\n            node.capacityMeshNodeId,\n            this.nodePfById.get(node.capacityMeshNodeId) ?? null,\n          ]),\n        )\n        const promise = runtime\n          .executeAsync(Pipeline9HighDensityBatchSolver, {\n            ...params,\n            nodePortPoints: batch.nodes.map(({ node }) => node),\n            nodePfById,\n            connectivityNetMap: connMap.netMap,\n            maxIterations: this.MAX_ITERATIONS,\n          })\n          .then(\n            (results) => {\n              // Each batch promise owns execution telemetry exactly once,\n              // including completed nodes outside the accepted serial prefix.\n              for (const result of results) {\n                for (const [key, value] of Object.entries(\n                  result.benchmarkDiagnosticCounters,\n                )) {\n                  this.benchmarkDiagnosticCounters[key] =\n                    (this.benchmarkDiagnosticCounters[key] ?? 0) + value\n                }\n              }\n              this.benchmarkDiagnosticCounters.priorityWorkerBatchesCompleted =\n                (this.benchmarkDiagnosticCounters\n                  .priorityWorkerBatchesCompleted ?? 0) + 1\n              this.benchmarkDiagnosticCounters.priorityWorkerNodesCompleted =\n                (this.benchmarkDiagnosticCounters\n                  .priorityWorkerNodesCompleted ?? 0) + results.length\n              return { type: \"result\" as const, results }\n            },\n            (error: unknown) => ({ type: \"error\" as const, error }),\n          )\n        for (const [batchIndex, { index }] of batch.nodes.entries()) {\n          pending[index] = promise.then((outcome) =>\n            outcome.type === \"error\"\n              ? outcome\n              : {\n                  type: \"result\" as const,\n                  result: outcome.results[batchIndex]!,\n                },\n          )\n        }\n      }\n      this.benchmarkDiagnosticCounters.priorityWorkerBatchesDispatched =\n        (this.benchmarkDiagnosticCounters.priorityWorkerBatchesDispatched ??\n          0) + batches.length\n      this.benchmarkDiagnosticCounters.priorityWorkerNodesDispatched =\n        (this.benchmarkDiagnosticCounters.priorityWorkerNodesDispatched ?? 0) +\n        nodes.length\n      for (const promise of pending) {\n        const outcome = await promise\n        if (outcome.type === \"error\") throw outcome.error\n        const result = outcome.result\n        const logicalIterations = result.iterations - (result.solved ? 1 : 0)\n        if (\n          this.iterations + logicalIterations >\n          Math.min(this.MAX_ITERATIONS, stopAtIteration)\n        ) {\n          // Replay only the remaining serial prefix when a batch crosses a budget.\n          this.asyncRunning = false\n          this.solveUntilIteration(stopAtIteration)\n          return\n        }\n        this.benchmarkDiagnosticCounters.priorityWorkerNodesAccepted =\n          (this.benchmarkDiagnosticCounters.priorityWorkerNodesAccepted ?? 0) +\n          1\n        this.iterations += logicalIterations\n        this.routes.push(...result.routes)\n        for (const [key, value] of Object.entries(result.stats)) {\n          if (key !== \"nodeCount\" && key !== \"fixedObstacleCount\")\n            this.stats[key] += value\n        }\n        this.unsolvedNodePortPoints.splice(\n          -result.consumedNodeCount,\n          result.consumedNodeCount,\n        )\n        this.progress = this.computeProgress()\n        if (!result.solved) {\n          this.error =
name: Verify canonical pad ownership through Core
on:
  push:
    branches: [analysis/core-native-complete-ci]
    paths: [.github/workflows/native-complete-ci.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [a3011ea856de9661404a115ed2050d9e0a1bff77, 93f449589c8748916c2105a5efab437c0908269a]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.source }}
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Correct canonical ownership in the existing helper
        working-directory: autorouter
        run: |
          cat > lib/solvers/TraceWidthSolver/isObstacleConnectedToRoute.ts <<'TS'
          import type { ConnectivityMap } from "circuit-json-to-connectivity-map"
          import type { Obstacle } from "lib/types/srj-types"
          
          type RouteConnection = {
            connectionName: string
            rootConnectionName?: string
          }
          
          export const isObstacleConnectedToRoute = (
            obstacle: Obstacle,
            route: RouteConnection,
            connMap?: ConnectivityMap,
          ): boolean => {
            if (!connMap) {
              return obstacle.connectedTo.some(
                (connectedId) =>
                  connectedId === route.connectionName ||
                  connectedId === route.rootConnectionName,
              )
            }
          
            let routeNetId = connMap.getNetConnectedToId(route.connectionName)
            if (routeNetId === undefined && route.rootConnectionName !== undefined) {
              if (Object.hasOwn(connMap.netMap, route.rootConnectionName)) {
                routeNetId = route.rootConnectionName
              } else {
                routeNetId = connMap.getNetConnectedToId(route.rootConnectionName)
              }
            }
            routeNetId ??= route.rootConnectionName ?? route.connectionName
          
            return obstacle.connectedTo.some(
              (connectedId) =>
                (connMap.getNetConnectedToId(connectedId) ?? connectedId) === routeNetId,
            )
          }
          TS
      - run: bun install && bun run build
        working-directory: autorouter
      - name: Pack the exact source candidate
        working-directory: autorouter
        run: |
          mkdir ../candidate
          npm pack --pack-destination ../candidate
          mv ../candidate/*.tgz ../candidate/autorouter.tgz
      - uses: actions/checkout@v4
        with:
          ref: f2dc346dfa3a4c065b69c698c9377391e919fa67
          path: core
          persist-credentials: false
      - name: Install exact source-built autorouter
        working-directory: core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("package.json")
          data=json.loads(p.read_text())
          data["devDependencies"]["@tscircuit/capacity-autorouter"]="file:../candidate/autorouter.tgz"
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
          bun install
      - name: Keep original 36-via fanout and both SEPIC clearance assertions
        working-directory: core
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repros/repro-fanout-routed-layer-impact.test.tsx tests/repros/repro-autorouter-clearance-board.test.tsx

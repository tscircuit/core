name: Class Exports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  class-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test tests/scripts/check-class-exports.test.ts
      - run: bun run check:class-exports

name: Profile published A13 remaining routing
on:
  push:
    branches: [artifacts/ddr-3209-repair-capture]
permissions:
  contents: read
jobs:
  profile:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: dd3383cfcb5c82960952bd44e6e1dc1d95a7f84f
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: published-ddr-3209-a13
          run-id: 44050671541
          github-token: ${{ github.token }}
          path: captured
      - run: bun install --ignore-scripts
      - name: CPU-profile the real Core request
        run: |
          cat > profile-a13.private.ts <<'TS'
          import {readFileSync} from 'node:fs'
          import {AutoroutingPipelineSolver9_PreloadedTraceGraph} from './lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph'
          const input=JSON.parse(readFileSync('captured/head/a13/phase-5-start.srj.json','utf8'))
          const solver=new AutoroutingPipelineSolver9_PreloadedTraceGraph(input,{cacheProvider:null})
          solver.solve()
          console.log('CPU_SOLVER_JSON='+JSON.stringify({solved:solver.solved,failed:solver.failed,times:solver.timeSpentOnPhase,stats:solver.pipeline9JointDrcRepairSolver?.stats}))
          TS
          bun --cpu-prof profile-a13.private.ts
      - name: Report sampled hot functions
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {readdirSync,readFileSync} from 'node:fs'
          for(const file of readdirSync('.').filter(p=>p.endsWith('.cpuprofile'))) {
            const p=JSON.parse(readFileSync(file,'utf8'))
            const nodes=new Map(p.nodes.map(n=>[n.id,n]))
            const parents=new Map()
            for(const n of p.nodes)for(const child of n.children??[])parents.set(child,n.id)
            const grouped=new Map()
            let total=0
            for(let i=0;i<p.samples.length;i++) {
              const duration=p.timeDeltas?.[i]??1000
              total+=duration
              let id=p.samples[i],first=true
              while(id!==undefined) {
                const n=nodes.get(id)
                if(!n)break
                const frame=n.callFrame
                const key=frame.url+':'+frame.lineNumber+':'+frame.functionName
                let row=grouped.get(key)
                if(!row){row={name:frame.functionName,file:frame.url,line:frame.lineNumber+1,self:0,inclusive:0};grouped.set(key,row)}
                row.inclusive+=duration
                if(first)row.self+=duration
                first=false
                id=parents.get(id)
              }
            }
            const rows=[...grouped.values()].map(r=>({...r,selfSeconds:r.self/1e6,inclusiveSeconds:r.inclusive/1e6,self:undefined,inclusive:undefined}))
            console.log('CPU_PROFILE_SUMMARY_JSON='+JSON.stringify({file,totalSeconds:total/1e6,topSelf:rows.toSorted((a,b)=>b.selfSeconds-a.selfSeconds).slice(0,35),topInclusive:rows.toSorted((a,b)=>b.inclusiveSeconds-a.inclusiveSeconds).slice(0,35)}))
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a13-routing-cpu-profile
          path: '*.cpuprofile'
          retention-days: 14

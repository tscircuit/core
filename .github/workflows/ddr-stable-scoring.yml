name: Benchmark A13 repair safeguards
on:
  push:
    branches: [artifacts/ddr-stable-fixed-copper-experiment]
permissions:
  contents: read
concurrency:
  group: stable-ddr-scoring
  cancel-in-progress: true
jobs:
  benchmark:
    name: A13 ${{ matrix.variant }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [regional-contact]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: dd3383cfcb5c82960952bd44e6e1dc1d95a7f84f
          path: router
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: published-ddr-3209-a13
          run-id: 44050671541
          github-token: ${{ github.token }}
          path: captured
      - name: Install and apply isolated scoring experiment
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cd router
          bun install --frozen-lockfile --ignore-scripts
          python3 - <<'PY'
          import os,pathlib
          variant=os.environ['VARIANT']
          root=pathlib.Path('lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph')
          if variant=='exact-reference':
              p=root/'Pipeline9JointDrcRepairSolver.ts'
              source=p.read_text()
              old='      viaInPadDrcEvaluator: drcEvaluator,\n'
              assert source.count(old)==1
              p.write_text(source.replace(old,old+'      referenceDrcEvaluator: cachedReferenceDrcEvaluator,\n'))
          elif variant=='regional-contact':
              p=root/'Pipeline9BoundedRegionalRepairSolver.ts'
              source=p.read_text()
              source=source.replace('import type { DrcEvaluator } from "high-density-repair03/lib"','import { type DrcEvaluator, TraceContactGuard, type SimpleRouteJson as RepairSimpleRouteJson } from "high-density-repair03/lib"')
              source=source.replace('  private reservedChildMaximum = 0','  private reservedChildMaximum = 0\n  private readonly traceContactGuard: TraceContactGuard')
              source=source.replace('    this.params = params','    this.params = params\n    this.traceContactGuard = new TraceContactGuard({\n      srj: params.originalSrj as RepairSimpleRouteJson,\n      inputRoutes: params.routes,\n      connMap: params.connMap,\n    })')
              old='      }).length > 0\n    ) {'
              assert source.count(old)==1
              source=source.replace(old,'      }).length > 0 ||\n      this.traceContactGuard.getNewContactPairs(candidateRoutes).length > 0\n    ) {')
              source=source.replace('    const { context, candidateRoutes } = state\n','    const { context, candidateRoutes } = state\n    this.traceContactGuard.preserveClearedContacts(context.currentRoutes)\n')
              p.write_text(source)
          else:
              raise Exception(variant)
          print('SCORING_VARIANT='+variant)
          PY
      - name: Solve the same native Core remaining request
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cat > router/experiment.private.ts <<'TS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          import {AutoroutingPipelineSolver9_PreloadedTraceGraph} from './lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph'
          import {getBugReportSnapshotSvg} from './lib/testing/getBugReportSnapshotSvg'
          import {evaluateRelaxedDrc} from './lib/testing/evaluate-relaxed-drc'
          const input=JSON.parse(readFileSync('../captured/head/a13/phase-5-start.srj.json','utf8'))
          mkdirSync('../results',{recursive:true})
          const started=performance.now()
          const solver=new AutoroutingPipelineSolver9_PreloadedTraceGraph(input,{cacheProvider:null})
          solver.solve()
          if(!solver.solved||solver.failed)throw Error(solver.error??'A13 did not solve')
          const traces=solver.getOutputSimplifiedPcbTraces()
          const drcInput={inputSrj:input,srjWithPointPairs:solver.srjWithPointPairs!,routedTraces:traces,drcOptions:{traceClearance:input.minTraceToPadEdgeClearance,viaToPadClearance:input.minViaEdgeToPadEdgeClearance}}
          const drc=evaluateRelaxedDrc(drcInput)
          const summary={variant:process.env.VARIANT,seconds:(performance.now()-started)/1000,traces:traces.length,errors:drc.errors,stats:solver.pipeline9JointDrcRepairSolver?.stats,timeSpent:solver.timeSpentOnPhase,copperHash:createHash('sha256').update(JSON.stringify(traces)).digest('hex')}
          console.log('SCORING_EXPERIMENT_JSON='+JSON.stringify(summary))
          writeFileSync('../results/summary.json',JSON.stringify(summary,null,2))
          writeFileSync('../results/output.srj.json',JSON.stringify(solver.getOutputSimpleRouteJson()))
          writeFileSync('../results/board.svg',getBugReportSnapshotSvg(drcInput))
          TS
          cd router
          bun experiment.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a13-stable-scoring-${{ matrix.variant }}
          path: results/
          retention-days: 14

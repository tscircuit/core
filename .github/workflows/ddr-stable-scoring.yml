name: Native immutable DDR copper routing
on:
  push:
    branches: [artifacts/ddr-stable-fixed-copper-experiment]
permissions:
  contents: read
jobs:
  benchmark:
    name: Immutable ${{ matrix.variant }} ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [endcaps, validation]
        circuit: [a13, butterstick]
        include:
          - {variant: endcaps, ref: 6bc2f5ad26d09f59aad8ccb705a6f5ea496603a5}
          - {variant: validation, ref: 9ddd7a2c8c13374620afe51e922902349eee11b3}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: exact-fixed-copper-${{ matrix.circuit }}
          run-id: 44090035121
          github-token: ${{ github.token }}
          path: captured
      - run: bun install --ignore-scripts
      - name: Solve the actual Core request
        env:
          CIRCUIT: ${{ matrix.circuit }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cat > immutable.private.ts <<'TS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs'
          import {AutoroutingPipelineSolver9_PreloadedTraceGraph} from './lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph'
          import {evaluateRelaxedDrc} from './lib/testing/evaluate-relaxed-drc'
          const circuit=process.env.CIRCUIT!
          const phase=circuit==='a13'?5:3
          const input=JSON.parse(readFileSync('captured/'+circuit+'/phase-'+phase+'-start.srj.json','utf8'))
          const started=performance.now()
          const solver=new AutoroutingPipelineSolver9_PreloadedTraceGraph(input,{cacheProvider:null})
          solver.solve()
          const summary={circuit,variant:process.env.VARIANT,solved:solver.solved,failed:solver.failed,error:solver.error,seconds:(performance.now()-started)/1000,stats:solver.highDensityRouteSolver?.stats,timeSpent:solver.timeSpentOnPhase}
          mkdirSync('results',{recursive:true})
          if(solver.solved) {
            const output=solver.getOutputSimplifiedPcbTraces()
            const drc=evaluateRelaxedDrc({inputSrj:input,srjWithPointPairs:solver.srjWithPointPairs!,routedTraces:output,drcOptions:{traceClearance:input.minTraceToPadEdgeClearance,viaToPadClearance:input.minViaEdgeToPadEdgeClearance}})
            Object.assign(summary,{traces:output.length,drcErrors:drc.errors})
            writeFileSync('results/output.srj.json',JSON.stringify(solver.getOutputSimpleRouteJson()))
          }
          console.log('IMMUTABLE_EXPERIMENT_JSON='+JSON.stringify(summary))
          writeFileSync('results/result.json',JSON.stringify(summary,null,2))
          TS
          bun immutable.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immutable-${{ matrix.variant }}-${{ matrix.circuit }}
          path: results/
          retention-days: 14

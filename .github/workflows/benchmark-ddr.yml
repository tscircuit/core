name: Profile existing matching search without changing the benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, glider, h616]
    steps:
      - uses: actions/checkout@v4
        with:
          path: analysis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: abe9820189e7a1b83c00afe31a1a5a6a159268ab
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install original benchmark without request or rule changes
        run: |
          cp analysis/intercept-matching-search.ts core/intercept-matching-search.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('core/package.json');s=json.loads(p.read_text())
          pins={'@tscircuit/checks':'0.0.283','@tscircuit/props':'0.0.746','circuit-json':'0.0.562','@tscircuit/core-ddr-benchmark':'github:ShiboSoftwareDev/core-ddr-benchmark#16b6352dc25e951192d88cb99a7cfe96abf62285'}
          s['devDependencies'].update(pins);p.write_text(json.dumps(s,indent=2)+'\n')
          PY
          cd core
          bun install --ignore-scripts --backend=copyfile
          sha256sum node_modules/@tscircuit/capacity-autorouter/dist/index.js node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Run unchanged shared 120 second benchmark
        working-directory: core
        run: |
          export BUN_OPTIONS="--preload $PWD/intercept-matching-search.ts"
          bun scripts/benchmark-ddr/run.ts --out ../results --circuit '${{ matrix.board }}' --timeout 120
          unset BUN_OPTIONS
          python3 - <<'PY'
          import json
          from pathlib import Path
          print('UNCHANGED_GEOMETRY_RESULT='+json.dumps(json.loads(Path('../results/results.json').read_text()),separators=(',',':')))
          for p in Path('../results').rglob('render.log'):
              for line in p.read_text().splitlines():
                  if line.startswith('MATCH_SEARCH_PROFILE='): print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-profile-${{ matrix.board }}
          path: |
            results/results.json
            results/**/render.log
            results/**/progress.json

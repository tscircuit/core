name: Refresh affected native bus snapshots after numerical reserve
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3c29d979a8ab96a1536fc1657c4b24fedcde763
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --ignore-scripts --backend=copyfile
      - name: Rerun the complete Core connectivity, timing, coupling and DRC assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: |
          bun test tests/features/autorouter-bus-lanes-am3352.test.tsx --timeout 120000
          git diff --numstat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bus-core-snapshots
          path: tests/features/__snapshots__/autorouter-bus-lanes-am3352-*-pcb.snap.svg

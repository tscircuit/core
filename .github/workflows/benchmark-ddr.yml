name: Audit saved DDR circuit results
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the completed comparison artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for audit_attempt in $(seq 1 120); do
            artifact_count=$(gh api repos/tscircuit/core/actions/runs/43879593088/artifacts --jq '.artifacts | length')
            if [ "$artifact_count" -gt 0 ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: ddr-benchmark-results
          run-id: 43879593088
          github-token: ${{ github.token }}
          path: results
      - name: Audit actual assessments, copper and routing inputs
        run: |
          python3 - <<'AUDIT_PY'
          import json, pathlib, hashlib, base64
          r = pathlib.Path('results')
          a = json.loads((r/'base/results.json').read_text())
          b = json.loads((r/'head/results.json').read_text())
          prior = json.loads(base64.b64decode(''))
          def fingerprint(obj):
              return hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          for key in ['benchmarkRevision','assessmentRevision','fixtureHashes','bunVersion','platform','cpu','dependencies','timeoutSeconds']:
              assert a[key] == b[key], key
          assert len(a['cases']) == len(b['cases']) == 10
          rows = []
          for x,y in zip(a['cases'],b['cases']):
              name = x['circuit']
              assert name == y['circuit']
              aa = {k:v for k,v in x['assessment'].items() if k != 'validationMs'}
              bb = {k:v for k,v in y['assessment'].items() if k != 'validationMs'}
              copper=[]
              for ref in ['base','head']:
                  elements=json.loads((r/ref/name/'circuit.json').read_text())
                  copper.append([e for e in elements if e.get('type') in ['pcb_trace','pcb_via']])
              starts = sorted((r/'base'/name).glob('phase-*-start.srj.json'))
              original_input = json.loads(starts[-1].read_text())
              previous = prior[name]
              rows.append({'circuit':name,'requested':aa['requestedNets'],'beforeConnected':aa['connectedNets'],'afterConnected':bb['connectedNets'],'beforeStatus':x['status'],'afterStatus':y['status'],'beforeSeconds':x['wallMs']/1000,'afterSeconds':y['wallMs']/1000,'beforeRss':x['peakRssMb'],'afterRss':y['peakRssMb'],'sameAssessment':aa==bb,'sameCopper':copper[0]==copper[1],'previousConnected':previous['assessment']['connectedNets'],'previousStatus':previous['status'],'samePriorAssessment':previous['assessment']==aa,'samePriorCopper':previous['copperHash']==fingerprint(copper[0]),'samePriorInput':previous['inputHash']==fingerprint(original_input),'beforeFindings':aa['findings'],'afterFindings':bb['findings'],'beforeGeometryErrors':aa['geometryErrors'],'afterGeometryErrors':bb['geometryErrors'],'beforePhases':x['progress']['phases'],'afterPhases':y['progress']['phases'],'beforeErrors':x['progress']['errors'],'afterErrors':y['progress']['errors']})
          report={'baseCommit':a['coreCommit'],'headCommit':b['coreCommit'],'dependencies':a['dependencies'],'runtime':{'bun':a['bunVersion'],'cpu':a['cpu'],'timeout':a['timeoutSeconds']},'cases':rows,'baseSeconds':sum(c['wallMs'] for c in a['cases'])/1000,'headSeconds':sum(c['wallMs'] for c in b['cases'])/1000}
          print('AUDIT_JSON='+json.dumps(report,separators=(',',':')))
          AUDIT_PY

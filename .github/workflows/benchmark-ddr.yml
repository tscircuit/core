name: Isolate visibility cache allocation on real routing searches
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      BUN_JSC_forceRAMSize: '2147483648'
      BUN_JSC_miniVMHeapGrowthFactor: '1.05'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          path: base
          ref: 7f71524bc8d7d82e31528d8533226d03ec33e9e8
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          path: eager
          ref: edbcad227ce06ac4f6a6c78629d906ab34c5bcc6
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          path: lazy
          ref: 1cc12c68175b9047ef8fddedbf6b67061a48dc6b
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Prepare independent installations before timing
        run: |
          for side in base eager lazy; do
            (cd "$side" && bun install --ignore-scripts --backend=copyfile)
          done
      - name: Balanced base-eager-lazy-lazy-eager-base routing controls
        run: |
          mkdir -p results
          iteration=0
          for side in base eager lazy lazy eager base; do
            iteration=$((iteration+1))
            bun base/scripts/benchmark.ts --worker inner-layers-right --solver "$GITHUB_WORKSPACE/$side/lib/index.ts" --timeout-seconds 3600 > "results/$iteration-$side-am.log" 2>&1
            grep '^REPORT ' "results/$iteration-$side-am.log"
            (cd "$side" && bun test tests/orangecrab-native-control.test.ts) > "results/$iteration-$side-orange.log" 2>&1
            cat "results/$iteration-$side-orange.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visibility-allocation-isolation
          path: results/

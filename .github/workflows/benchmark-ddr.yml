name: Audit A13 escape diagnostic provenance
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ddr-benchmark-results
          run-id: 43921005346
          github-token: ${{ github.token }}
          path: results
      - name: Verify retained native routing-phase inputs against published 1109
        run: |
          python3 - <<'PROVENANCE_PY'
          import json,hashlib,pathlib
          expected={'phase-3-end.srj.json': 'b26f0a38795d696230e97efdb8f763f2f69c59bfb66be07f521ad4da79bb61b7', 'phase-4-end.srj.json': 'b32fc5a364a53f16ad9a6ea7536a054bd5bc8bdaeda600454205a5c94f5ef760', 'phase-5-start.srj.json': '83ce8fbf3fef7562628690116b8a2033ac4bba182f10a86502ee12cae03e8cf3'}
          result={}
          for name,reference in expected.items():
              s=json.loads((pathlib.Path('results/head/a13')/name).read_text())
              actual=hashlib.sha256(json.dumps(s,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              result[name]={'same':actual==reference,'sha256':actual,'traces':len(s.get('traces') or [])}
          assert all(v['same'] for v in result.values()),result
          print('PROVENANCE_JSON='+json.dumps(result,separators=(',',':')))
          PROVENANCE_PY

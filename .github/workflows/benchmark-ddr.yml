name: Unchanged DDR benchmark with finished-length route comparison
on:
  workflow_dispatch:
  push:
    branches: [analysis/ddr-native-constraints-20261125]
    paths: [.github/workflows/benchmark-ddr.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h3, a64, stmp157, a13, h616, butterstick, glider, imx6, icepi]
        side: [main, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          path: analysis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9b09ef9dc4565474d101c47f7ee5eaa29020729d
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ matrix.side == 'main' && '2718df9b52937392f648612ca4a31d6352b585a5' || '01212d0e75d7a2cf865e81e79ab0b77beb8b1e4f' }}
          path: bus
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build actual bus solver source for the benchmark
        working-directory: bus
        run: |
          bun install --ignore-scripts --backend=copyfile
          bunx tsup
      - name: Install original benchmark without request or rule changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('core/package.json');s=json.loads(p.read_text())
          pins={'@tscircuit/checks':'0.0.283','@tscircuit/props':'0.0.746','circuit-json':'0.0.562','@tscircuit/core-ddr-benchmark':'github:ShiboSoftwareDev/core-ddr-benchmark#16b6352dc25e951192d88cb99a7cfe96abf62285'}
          s['devDependencies'].update(pins);p.write_text(json.dumps(s,indent=2)+'\n')
          PY
          cd core
          bun install --ignore-scripts --backend=copyfile
          cp -r ../bus/dist/. node_modules/@tscircuit/bus-lanes-solver/dist/
          sha256sum node_modules/@tscircuit/capacity-autorouter/dist/index.js node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Run unchanged shared 120 second benchmark
        working-directory: core
        run: |
          bun scripts/benchmark-ddr/run.ts --out ../results --circuit '${{ matrix.board }}' --timeout 120
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('../results').rglob('attempts/matching/assessment.json'):
              a=json.loads(p.read_text());print('GLIDER_MATCHING_PHYSICAL='+json.dumps({'connected':a['connectedNets'],'findings':a['findings']},separators=(',',':')))
          print('ALL_TEN_LENGTH_RESULT='+json.dumps(json.loads(Path('../results/results.json').read_text()),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-length-${{ matrix.board }}-${{ matrix.side }}
          path: |
            results/results.json
            results/**/render.log
            results/**/progress.json

name: Capture native A13 mask snapshots
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
      source_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --ignore-scripts
      - name: Fresh TSX and Core solve
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test tests/repros/repro-a13-data-dm0.test.tsx
      - name: Emit generated SVGs for review
        run: |
          python3 - <<'PY'
          import pathlib,gzip,base64,json
          for path in sorted(pathlib.Path('tests/repros/__snapshots__').glob('repro-a13-data-dm0*.snap.svg')):
              print('SVG_JSON='+json.dumps({'name':path.name,'gzipBase64':base64.b64encode(gzip.compress(path.read_bytes())).decode()},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a13-mask-proof
          path: tests/repros/__snapshots__/repro-a13-data-dm0*
          retention-days: 14

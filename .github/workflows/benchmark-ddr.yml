name: Render full native A13 benchmark copper
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecf9bb8a418beacde11c14d8f5b44c423eb65a03
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ddr-benchmark-results
          run-id: 43958176525
          github-token: ${{ github.token }}
          path: results
      - name: Render the saved native Core circuit JSON
        run: |
          cat > render-full-a13.private.ts <<'TS'
          import {convertCircuitJsonToPcbSvg} from 'circuit-to-svg'
          import {mkdirSync} from 'node:fs'
          mkdirSync('review',{recursive:true})
          for(const ref of ['base','head']){
            const circuit=await Bun.file(`results/${ref}/a13/circuit.json`).json()
            const results=await Bun.file(`results/${ref}/results.json`).json()
            const report=results.cases.find(c=>c.circuit==='a13')
            const physical=Object.entries(report.assessment.findings).filter(([key])=>!['missing_traces','disconnected_ports'].includes(key)).reduce((sum,[,count])=>sum+Number(count),0)
            const caption=ref==='base'?'BASELINE: 300 s timeout; no final copper exported':`${report.assessment.connectedNets}/96 connected; ${physical} physical findings; NOT DRC-CLEAN`
            circuit.push({type:'pcb_note_text',pcb_note_text_id:`a13_full_${ref}`,text:caption,anchor_position:{x:12,y:16.5},anchor_alignment:'center',font:'tscircuit2024',layer:'top',font_size:0.5})
            const svg=convertCircuitJsonToPcbSvg(circuit,{backgroundColor:'white',width:1400,height:1000,viewport:{minX:-10,maxX:38,minY:-19,maxY:18},shouldDrawErrors:false,shouldDrawRatsNest:false,showErrorsInTextOverlay:false})
            await Bun.write(`review/a13-full-${ref}.svg`,svg)
            console.log(JSON.stringify({ref,connected:report.assessment.connectedNets,physical,traces:circuit.filter(e=>e.type==='pcb_trace').length}))
          }
          TS
          bun render-full-a13.private.ts
          python3 - <<'PY'
          import pathlib,gzip,base64,json
          for p in sorted(pathlib.Path('review').glob('*.svg')):
            print('FULL_A13_SVG='+json.dumps({'name':p.name,'gzipBase64':base64.b64encode(gzip.compress(p.read_bytes())).decode()},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-a13-rendered-benchmark-copper
          path: review/

name: Verify published autorouter 1110 on all DDR circuits
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'blacksmith-8vcpu-ubuntu-2404-arm' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 003a3caee8df5a49d4fa5cbc9b5b6f0d22e142f5
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the frozen published dependency graph
        working-directory: core
        run: bun install --ignore-scripts
      - name: Route all ten real TSX circuits using published autorouter 1110
        run: |
          bun "$GITHUB_WORKSPACE/core/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" --core "$GITHUB_WORKSPACE/core" --out "$GITHUB_WORKSPACE/results/head" --timeout 300
      - uses: actions/download-artifact@v4
        with:
          name: ddr-benchmark-results
          run-id: 43921005346
          github-token: ${{ github.token }}
          path: previous
      - name: Compare the actual circuits with the preceding 1109 release run
        run: |
          python3 - <<'AUDIT_PY'
          import json,pathlib
          old=pathlib.Path('previous/head'); new=pathlib.Path('results/head')
          a=json.loads((old/'results.json').read_text());b=json.loads((new/'results.json').read_text())
          for field in ['benchmarkRevision','assessmentRevision','fixtureHashes','bunVersion','platform','timeoutSeconds']:
              assert a[field]==b[field],field
          assert len(a['cases'])==len(b['cases'])==10
          rows=[]
          for x,y in zip(a['cases'],b['cases']):
              name=x['circuit']; assert name==y['circuit']
              aa={k:v for k,v in x['assessment'].items() if k!='validationMs'};bb={k:v for k,v in y['assessment'].items() if k!='validationMs'}
              copper=[]
              for folder in [old,new]:
                  elements=json.loads((folder/name/'circuit.json').read_text());copper.append([e for e in elements if e.get('type') in ['pcb_trace','pcb_via']])
              rows.append({'circuit':name,'beforeStatus':x['status'],'afterStatus':y['status'],'beforeSeconds':x['wallMs']/1000,'afterSeconds':y['wallMs']/1000,'beforeAssessment':aa,'afterAssessment':bb,'sameAssessment':aa==bb,'sameCopper':copper[0]==copper[1],'beforePhases':x['progress']['phases'],'afterPhases':y['progress']['phases'],'beforeErrors':x['progress']['errors'],'afterErrors':y['progress']['errors']})
          report={'beforeCommit':a['coreCommit'],'afterCommit':b['coreCommit'],'beforeDependencies':a['dependencies'],'afterDependencies':b['dependencies'],'runtime':{'bun':a['bunVersion'],'platform':a['platform'],'timeout':a['timeoutSeconds']},'pairedMachine':False,'cases':rows,'beforeSeconds':sum(x['wallMs'] for x in a['cases'])/1000,'afterSeconds':sum(x['wallMs'] for x in b['cases'])/1000}
          pathlib.Path('results/comparison.json').write_text(json.dumps(report,indent=2))
          print('AUDIT_JSON='+json.dumps(report,separators=(',',':')))
          AUDIT_PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-ddr-results
          path: results/
          retention-days: 14

name: Incremental native DDR benchmark
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Incremental candidate label
        type: string
        required: true
      base_ref:
        description: Immutable Core baseline commit
        type: string
        required: true
      head_ref:
        description: Immutable Core candidate commit
        type: string
        required: true
      probe_refinement:
        description: Inspect existing bus refinement on the captured H616 phase
        type: boolean
        default: false
      bus_ref:
        description: Optional immutable bus-lanes source revision for head only
        type: string
        default: ''
      benchmark_ref:
        description: Optional immutable adapter revision, identical on base and head
        type: string
        default: ''
      matching_probe:
        description: Separate H616 matching diagnostic, outside benchmark acceptance
        type: boolean
        default: false
      circuits:
        description: JSON board list for focused timing controls
        type: string
        default: '["h3","a64","stmp157","orangecrab","a13","h616","butterstick","glider","imx6","icepi"]'
      order:
        description: Base/head execution order
        type: choice
        options: [base_head, head_base]
        default: base_head
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    name: ${{ inputs.stage }} / ${{ matrix.circuit }}
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'blacksmith-8vcpu-ubuntu-2404-arm' }}
    strategy:
      fail-fast: false
      matrix:
        circuit: ${{ fromJSON(inputs.circuits) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          path: head
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/checkout@v4
        if: inputs.bus_ref != ''
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ inputs.bus_ref }}
          path: bus-source
          persist-credentials: false
      - name: Build exact bus source candidate
        if: inputs.bus_ref != ''
        working-directory: bus-source
        run: |
          bun install --ignore-scripts --backend=copyfile
          bun run build
          bun pm pack --filename ../bus-candidate.tgz
          sha256sum dist/index.js
      - name: Freeze common validators and install independent dependency files
        env:
          BUS_REF: ${{ inputs.bus_ref }}
          BENCHMARK_REF: ${{ inputs.benchmark_ref }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for revision in ['tooling', 'base', 'head']:
              path = Path(revision) / 'package.json'
              manifest = json.loads(path.read_text())
              for name, version in {'@tscircuit/checks':'0.0.283', '@tscircuit/props':'0.0.746', 'circuit-json':'0.0.561'}.items():
                  if revision == 'head' and name != '@tscircuit/checks':
                      continue
                  section = 'devDependencies' if name in manifest.get('devDependencies', {}) else 'dependencies'
                  for group in ['dependencies', 'devDependencies']:
                      manifest.get(group, {}).pop(name, None)
                  manifest.setdefault(section, {})[name] = version
              assert manifest['devDependencies']['@tscircuit/core-ddr-benchmark'].endswith('16b6352dc25e951192d88cb99a7cfe96abf62285')
              if os.environ.get('BENCHMARK_REF'):
                  manifest['devDependencies']['@tscircuit/core-ddr-benchmark'] = 'github:ShiboSoftwareDev/core-ddr-benchmark#' + os.environ['BENCHMARK_REF']
              if revision == 'head' and os.environ.get('BUS_REF'):
                  for group in ['dependencies', 'devDependencies']:
                      manifest.get(group, {}).pop('@tscircuit/bus-lanes-solver', None)
                  manifest.setdefault('devDependencies', {})['@tscircuit/bus-lanes-solver'] = 'file:../bus-candidate.tgz'
              path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          for revision in tooling base head; do
            (cd "$revision" && bun install --ignore-scripts --backend=copyfile)
          done
          python3 tooling/scripts/benchmark-ddr/verify-incremental-preview.py
          bun tooling/scripts/benchmark-ddr/inspect-incremental-packages.mjs
          if [ -n "$BUS_REF" ]; then
            cmp bus-source/dist/index.js head/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
          fi
      - name: Typecheck and build exact Core candidate
        if: matrix.circuit == 'h616'
        working-directory: head
        run: |
          bunx tsc --noEmit > ../head-typecheck.log 2>&1 || { tail -n 100 ../head-typecheck.log; exit 1; }
          bun run build
      - name: Run matched base and head on one board
        env:
          CIRCUIT: ${{ matrix.circuit }}
          RUN_ORDER: ${{ inputs.order }}
        run: |
          benchmark="$GITHUB_WORKSPACE/tooling/node_modules/@tscircuit/core-ddr-benchmark/scripts"
          run_status=0
          case "$RUN_ORDER" in
            base_head) revisions=(base head) ;;
            head_base) revisions=(head base) ;;
            *) exit 1 ;;
          esac
          for revision in "${revisions[@]}"; do
            bun "$benchmark/run.ts" --core "$GITHUB_WORKSPACE/$revision" --out "$GITHUB_WORKSPACE/results/$revision" --circuit "$CIRCUIT" --timeout 120 || run_status=$?
          done
          python3 - <<'PY_HASH'
          import hashlib, json
          from pathlib import Path
          fingerprints = {}
          for revision in ['base', 'head']:
              path = Path('results') / revision / 'results.json'
              result = json.loads(path.read_text())
              circuit = result['cases'][0]['circuit']
              copper = json.loads((Path('results') / revision / circuit / 'circuit.json').read_text())
              records = sorted((element for element in copper if element.get('type') in ['pcb_trace', 'pcb_via']), key=lambda element: json.dumps(element, sort_keys=True, separators=(',', ':')))
              canonical = json.dumps(records, sort_keys=True, separators=(',', ':')).encode()
              geometry = []
              for record in records:
                  if record['type'] == 'pcb_trace':
                      geometry.append({'type': 'pcb_trace', 'route': [{key: value for key, value in point.items() if key in ['route_type', 'x', 'y', 'width', 'layer', 'from_layer', 'to_layer', 'via_diameter', 'via_hole_diameter']} for point in record['route']]})
                  else:
                      geometry.append({key: value for key, value in record.items() if key in ['type', 'x', 'y', 'outer_diameter', 'hole_diameter', 'layers', 'from_layer', 'to_layer']})
              geometry.sort(key=lambda item: json.dumps(item, sort_keys=True, separators=(',', ':')))
              geometry_bytes = json.dumps(geometry, sort_keys=True, separators=(',', ':')).encode()
              fingerprints[revision] = {'copperSha256': hashlib.sha256(canonical).hexdigest(), 'geometrySha256': hashlib.sha256(geometry_bytes).hexdigest(), 'records': len(records)}
          Path('results/copper-fingerprints.json').write_text(json.dumps(fingerprints, indent=2) + '\n')
          PY_HASH
          python3 - <<'PY_ATTEMPTS'
          import json, os
          from pathlib import Path
          circuit = os.environ['CIRCUIT']
          for revision in ['base','head']:
              for mode in ['routing','matching']:
                  root=Path('results')/revision/circuit/'attempts'/mode
                  if not (root/'progress.json').exists():continue
                  progress=json.loads((root/'progress.json').read_text())
                  assessment=json.loads((root/'assessment.json').read_text()) if (root/'assessment.json').exists() else {}
                  groups=assessment.get('ddrSkew',{})
                  targets=[{key:value for key,value in target.items() if key in ['name','status','severity','assessmentOnly','maxLengthSkew','minLength','maxLength','actualMinMm','actualMaxMm','actualSkewMm','marginMm','lengthsMm','referenceNets','skewReference','routerSkippedNets']} for target in assessment.get('ddrConstraints',[])]
                  print('DDR_ATTEMPT='+json.dumps({'revision':revision,'circuit':circuit,'mode':mode,'progress':progress,'connected':assessment.get('connectedNets'),'requested':assessment.get('requestedNets'),'groups':groups,'targets':targets},separators=(',',':')))
          PY_ATTEMPTS
          cp package-provenance.json results/package-provenance.json
          if (( run_status != 0 )); then exit 1; fi
      - name: Inspect a fresh matching attempt separately from benchmark acceptance
        if: inputs.matching_probe == true && matrix.circuit == 'h616'
        run: |
          benchmark="$GITHUB_WORKSPACE/tooling/node_modules/@tscircuit/core-ddr-benchmark/scripts"
          output="$GITHUB_WORKSPACE/results/matching-probe/h616"
          mkdir -p "$output"
          timeout -s KILL 120s bun --tsconfig-override head/tsconfig.json "$benchmark/worker.tsx" "$GITHUB_WORKSPACE/head" h616 "$output" matching > "$output/render.log" 2>&1 || true
          if [ -f "$output/circuit.json" ]; then
            timeout -s KILL 120s bun "$benchmark/assess.ts" "$GITHUB_WORKSPACE/head" h616 "$output" > "$output/validation.log" 2>&1 || true
          fi
          python3 - <<'PY_MATCHING'
          import json
          from pathlib import Path
          root=Path('results/matching-probe/h616')
          progress=json.loads((root/'progress.json').read_text()) if (root/'progress.json').exists() else {}
          assessment=json.loads((root/'assessment.json').read_text()) if (root/'assessment.json').exists() else {}
          print('MATCHING_PROBE='+json.dumps({'progress':progress,'assessment':assessment},separators=(',',':')))
          PY_MATCHING
      - name: Probe existing bus matching APIs without changing the benchmark
        if: inputs.probe_refinement == true && matrix.circuit == 'h616'
        run: |
          for mode in constrained without_lengths refine_completed; do
            status=0
            timeout 75s bun --tsconfig-override head/tsconfig.json tooling/scripts/benchmark-ddr/probe-existing-skew.mjs "$GITHUB_WORKSPACE/head" "$GITHUB_WORKSPACE/results/head" "$mode" || status=$?
            echo "SKEW_PROBE_EXIT=$mode:$status"
          done
      - name: Export validated full H616 before and after views
        if: matrix.circuit == 'h616'
        run: |
          cat > tooling/render-h616.mjs <<'JS'
          import { readFileSync } from 'node:fs'
          import { gzipSync } from 'node:zlib'
          import { convertCircuitJsonToPcbSvg } from 'circuit-to-svg'
          for (const revision of ['base','head']) {
            const root=`results/${revision}/h616`
            const assessment=JSON.parse(readFileSync(`${root}/assessment.json`,'utf8'))
            const physical=Object.entries(assessment.findings).filter(([name])=>!name.startsWith('ddr_')).reduce((sum,[,count])=>sum+count,0)
            if (assessment.connectedNets!==53 || physical || assessment.geometryErrors.length) throw Error('Refusing incomplete or physically invalid H616 image')
            const copper=JSON.parse(readFileSync(`${root}/circuit.json`,'utf8'))
            const svg=convertCircuitJsonToPcbSvg(copper,{width:1200,height:1200})
            console.log('H616_VALIDATED_SVG='+JSON.stringify({revision,gzipBase64:gzipSync(svg).toString('base64')}))
          }
          JS
          bun tooling/render-h616.mjs
      - name: Capture H616 diagnostic inputs
        if: matrix.circuit == 'h616'
        run: |
          python3 - <<'PY_CAPTURE'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path('results/head/h616')
          paths = list(root.rglob('*.srj.json'))
          paths += list(root.rglob('assessment.json'))
          paths += [root / 'circuit.json']
          probe = Path('results/matching-probe/h616')
          if probe.exists():
              paths += list(probe.rglob('*.srj.json'))
              paths += list(probe.rglob('assessment.json'))
              paths += list(probe.rglob('circuit.json'))
          paths += [Path('head/node_modules/@tscircuit/bus-lanes-solver/dist/index.js')]
          for path in paths:
              payload = path.read_bytes()
              print('SKEW_CAPTURE=' + json.dumps({'path':str(path), 'bytes':len(payload), 'sha256':hashlib.sha256(payload).hexdigest(), 'gzipBase64':base64.b64encode(gzip.compress(payload)).decode()}, separators=(',', ':')))
          PY_CAPTURE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.circuit }}
          path: |
            results/base/results.json
            results/head/results.json
            results/package-provenance.json
            results/copper-fingerprints.json
  report:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install identical report implementation
        working-directory: tooling
        run: bun install --ignore-scripts --backend=copyfile
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Merge original benchmark records and print named numeric metrics
        env:
          DDR_CIRCUITS: ${{ inputs.circuits }}
        run: bun tooling/scripts/benchmark-ddr/merge-incremental-results.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incremental-comparison
          path: aggregate

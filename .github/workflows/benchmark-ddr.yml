name: Read centered-grid DDR comparisons
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ddr-benchmark-results
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: current
      - uses: actions/download-artifact@v4
        with:
          name: ddr-benchmark-results
          run-id: 43958176525
          github-token: ${{ github.token }}
          path: previous
      - run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          result={}
          for tag,root in [('base',pathlib.Path('current/base')),('head',pathlib.Path('current/head')),('previousHead',pathlib.Path('previous/head'))]:
              report=json.loads((root/'results.json').read_text())
              metadata={k:v for k,v in report.items() if k!='cases'}
              rows=[]
              for c in report['cases']:
                  assessment=c.get('assessment') or {}
                  circuit=root/c['circuit']/'circuit.json'
                  copper_hash=None
                  if circuit.exists():
                      elements=json.loads(circuit.read_text())
                      copper=[e for e in elements if e['type'] in ['pcb_trace','pcb_via']]
                      copper_hash=hashlib.sha256(json.dumps(copper,sort_keys=True,separators=(',',':')).encode()).hexdigest()
                  findings=assessment.get('findings',{})
                  rows.append({'circuit':c['circuit'],'status':c['status'],'seconds':c['wallMs']/1000,'peakRssMb':c['peakRssMb'],'connected':assessment.get('connectedNets'),'requested':assessment.get('requestedNets'),'findings':findings,'physicalFindings':sum(v for k,v in findings.items() if k not in ['missing_traces','disconnected_ports']),'geometryErrors':assessment.get('geometryErrors'),'copperSha256':copper_hash,'progress':c.get('progress')})
              result[tag]={'metadata':metadata,'cases':rows}
          print('CORE_COMPARISON_JSON='+json.dumps(result,separators=(',',':')))
          print(pathlib.Path('current/comparison.md').read_text())
          assert all(len(x['cases'])==10 for x in result.values())
          PY

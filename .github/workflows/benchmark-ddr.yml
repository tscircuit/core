name: Profile unchanged DDR benchmark main
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        board: [glider, h616]
    steps:
      - uses: actions/checkout@v4
        with:
          path: analysis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: abe9820189e7a1b83c00afe31a1a5a6a159268ab
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install the unchanged original Core and benchmark
        run: |
          cp analysis/intercept-native-stages.ts core/intercept-native-stages.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('core/package.json');s=json.loads(p.read_text())
          pins={'@tscircuit/checks':'0.0.283','@tscircuit/props':'0.0.746','circuit-json':'0.0.562','@tscircuit/core-ddr-benchmark':'github:ShiboSoftwareDev/core-ddr-benchmark#16b6352dc25e951192d88cb99a7cfe96abf62285'}
          s['devDependencies'].update(pins);p.write_text(json.dumps(s,indent=2)+'\n')
          PY
          cd core
          bun install --ignore-scripts --backend=copyfile
          sha256sum node_modules/@tscircuit/capacity-autorouter/dist/index.js node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Profile the official unchanged 120 second benchmark
        working-directory: core
        run: |
          mkdir -p ../profiles
          export BUN_OPTIONS="--preload $PWD/intercept-native-stages.ts --cpu-prof --cpu-prof-dir=$GITHUB_WORKSPACE/profiles"
          bun scripts/benchmark-ddr/run.ts --out ../results --circuit '${{ matrix.board }}' --timeout 120
          unset BUN_OPTIONS
          python3 - <<'PY'
          import json,collections
          from pathlib import Path
          for p in Path('../profiles').glob('*.cpuprofile'):
              j=json.loads(p.read_text());nodes={n['id']:n for n in j['nodes']};times=collections.Counter()
              for node,delta in zip(j.get('samples',[]),j.get('timeDeltas',[])):
                  f=nodes[node]['callFrame'];times[(f['functionName'],f.get('url',''),f.get('lineNumber'))]+=delta
              print('NATIVE_CPU_PROFILE='+json.dumps({'file':p.name,'frames':[{'function':n[0],'url':n[1],'line':n[2],'seconds':t/1e6} for n,t in times.most_common(25)]},separators=(',',':')))
          for p in Path('../results').rglob('render.log'):
              print('NATIVE_STAGE_LOG='+str(p))
              for line in p.read_text().splitlines():
                  if line.startswith('UNCHANGED_PIPELINE_STAGE='):print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-native-profile-${{ matrix.board }}
          path: |
            profiles/
            results/results.json
            results/**/render.log
            results/**/progress.json

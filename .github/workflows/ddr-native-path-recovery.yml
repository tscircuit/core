          repository: tscircuit/tscircuit-autorouter
          ref: 17cdc65e45269bc4229f891c0cc80cde7245a169
          path: ar-latest
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Port the existing layer filter and isolate native-trace inheritance
        run: |
          python3 - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          helper_paths=["lib/utils/getAllowedLayersByConnection.ts","lib/utils/assertRoutesStayOnAllowedLayers.ts"]
          helpers={path:urllib.request.urlopen("https://raw.githubusercontent.com/tscircuit/tscircuit-autorouter/5d94470d25b505fac0d4749ef497f9ee287c4587/"+path).read().decode() for path in helper_paths}
          for name in ['ar-latest']:
            root=Path(name)
            p=root/'package.json'

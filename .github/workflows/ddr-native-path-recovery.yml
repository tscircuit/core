name: Preserve normal routes and recover native A13 path access
on:
  push:
    branches: [analysis/ddr-3277-completion-20261122-1035]
    paths: [.github/workflows/ddr-native-path-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  build-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 17cdc65e45269bc4229f891c0cc80cde7245a169
          path: ar-previous
          persist-credentials: false
      - uses: actions/checkout@v4

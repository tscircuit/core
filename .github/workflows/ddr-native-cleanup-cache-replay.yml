name: Verify unchanged A13 copper after cleanup and cache replay
on:
  push:
    branches: [analysis/ddr-3277-completion-20261122-1035]
    paths: [.github/workflows/ddr-native-cleanup-cache-replay.yml]
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fec68cdfd923964d5b249578bf955d42653166d8
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --backend=copyfile
      - name: Verify the complete board after cache replay
        run: |
          cat > tests/repros/a13-cache-replay.private.test.tsx <<'TS'
          import { expect, test } from "bun:test"
          import { createHash } from "node:crypto"
          import { A13FullDdrBoard } from "tests/fixtures/a13-full-ddr/board"
          import { getTestFixture } from "tests/fixtures/get-test-fixture"
          import type { LocalCacheEngine } from "lib/local-cache-engine"
          
          test("the complete native A13 result survives a local-cache replay", async (): Promise<void> => {
            const entries = new Map<string, string>()
            const localCacheEngine: LocalCacheEngine = {
              getItem: (key) => entries.get(key) ?? null,
              setItem: (key, value) => { entries.set(key, value) },
            }
            const fresh = getTestFixture({ platform: { localCacheEngine } }).circuit
            fresh.add(<A13FullDdrBoard />)
            await fresh.renderUntilSettled()
            expect(fresh.db.pcb_autorouting_error.list()).toEqual([])
            const firstCopper = fresh.getCircuitJson().filter(element => element.type === "pcb_trace" || element.type === "pcb_via")
            const cached = getTestFixture({ platform: { localCacheEngine } }).circuit
            let hits = 0
            cached.on("autorouting:start", event => { if (event.cacheStatus === "hit") hits++ })
            cached.add(<A13FullDdrBoard />)
            await cached.renderUntilSettled()
            expect(cached.db.pcb_autorouting_error.list()).toEqual([])
            expect(hits).toBe(1)
            const secondCopper = cached.getCircuitJson().filter(element => element.type === "pcb_trace" || element.type === "pcb_via")
            expect(secondCopper).toEqual(firstCopper)
            console.log("A13_CACHE_REPLAY="+JSON.stringify({hits, entries:entries.size, copperHash:createHash("sha256").update(JSON.stringify(secondCopper)).digest("hex")}))
          }, 600_000)
          
          TS
          bun test --timeout 9999999 tests/repros/a13-cache-replay.private.test.tsx

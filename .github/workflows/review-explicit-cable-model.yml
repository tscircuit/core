name: Review explicit cable model snapshot
on:
  push:
    branches: [codex/review-explicit-cable-model-20261007]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun scripts/prepare-assembly-cable-preview.ts
        env:
          VERCEL_ENV: preview
      - run: bun install
      - run: bun test tests/assembly/assembly-cable-model.test.tsx --timeout 30000
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicit-cable-model-snapshot
          path: tests/assembly/__snapshots__/assembly-cable-model-annotated.snap.png

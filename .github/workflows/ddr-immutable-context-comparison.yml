name: Compare full immutable copper context on all DDR boards
on:
  push:
    branches: [analysis/ddr-3277-completion-20261122-1035]
    paths: [.github/workflows/ddr-immutable-context-comparison.yml]
permissions:
  contents: read
  actions: read
jobs:
  build-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 4c80cfe803046da0e8d989a673b8f2193b1b6851
          path: ar-previous
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 4c80cfe803046da0e8d989a673b8f2193b1b6851
          path: ar-latest
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Apply the focused immutable-context change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name in ['ar-previous','ar-latest']:
            p=Path(name)/'package.json'
            manifest=json.loads(p.read_text())
            manifest['devDependencies']['@tscircuit/checks']='0.0.282'
            p.write_text(json.dumps(manifest,indent=2)+'\n')
          p=Path('ar-latest/lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts')
          s=p.read_text()
          before="    let regionalCopperRoutes: HighDensityRoute[] =\n      this.activeFallbackFixedObstacleRoutes"
          after="    // Regional growth can leave the original mesh cell.\n    // Keep immutable copper in the search and candidate validation.\n    const immutableHdRoutes = fixedHdRoutes.filter(\n      (route) => route.isFixed === true || route.isThroughObstacle === true,\n    )\n    let regionalCopperRoutes: HighDensityRoute[] = [\n      ...new Set([\n        ...this.activeFallbackFixedObstacleRoutes,\n        ...immutableHdRoutes,\n      ]),\n    ]"
          assert s.count(before)==1
          s=s.replace(before,after)
          before="      immutableHdRoutes: this.activeFallbackFixedObstacleRoutes.filter(\n        (route) => route.isFixed === true || route.isThroughObstacle === true,\n      ),"
          assert s.count(before)==1
          p.write_text(s.replace(before,'      immutableHdRoutes,'))
          PY
          git -C ar-latest diff --numstat
          git -C ar-previous hash-object lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts
          git -C ar-latest hash-object lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts
      - name: Build both exact integration commits
        run: |
          python - <<'PYLOCK'
          from pathlib import Path
          for root in ['ar-previous','ar-latest']:
            config=Path(root)/'bunfig.toml'
            text=config.read_text()
            assert text.count('save = false')==1
            config.write_text(text.replace('save = false','save = true'))
          PYLOCK
          (cd ar-previous && bun install --save-text-lockfile --backend=copyfile)
          cp ar-previous/bun.lock ar-latest/bun.lock
          (cd ar-latest && bun install --frozen-lockfile --backend=copyfile)
          (cd ar-previous && bun run build)
          (cd ar-latest && bun run build)
          cmp ar-previous/package.json ar-latest/package.json
          cmp ar-previous/bun.lock ar-latest/bun.lock
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-context-builds
          path: |
            ar-previous/dist
            ar-latest/dist
            ar-previous/bun.lock
          retention-days: 7
  benchmark:
    needs: build-integration
    name: Native ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {circuit: h3, order: "previous latest"}
          - {circuit: a64, order: "previous latest"}
          - {circuit: stmp157, order: "previous latest"}
          - {circuit: orangecrab, order: "previous latest"}
          - {circuit: a13, order: "previous latest"}
          - {circuit: h616, order: "previous latest"}
          - {circuit: butterstick, order: "previous latest"}
          - {circuit: glider, order: "previous latest"}
          - {circuit: imx6, order: "previous latest"}
          - {circuit: icepi, order: "previous latest"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install exact published stacks and identical native fixtures
        run: |
          cat > prepare-published.private.mjs <<'JS'
          import {mkdir,writeFile,readFile,symlink} from "node:fs/promises"
          import path from "node:path"
          const benchmark="github:ShiboSoftwareDev/core-ddr-benchmark#24dc44c166d4258c3538f8b1f66953f1b6f58690"
          function exact(declared) {
           const version=declared.replace(/^[~^]/,"")
           if(!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(version))throw Error("Expected exact release: "+declared)
           return version
          }
          async function metadata(name,version) {
           const response=await fetch("https://registry.npmjs.org/"+name+"/"+version)
           if(!response.ok)throw Error("Registry request failed: "+name+" "+version+" "+response.status)
           return await response.json()
          }
          for(const release of [
           {label:"previous",tscircuit:"0.0.3278",core:"0.0.2459",autorouter:"0.0.1153",sourceRevision:"ar-main-4c80cfe803046da0e8d989a673b8f2193b1b6851"},
           {label:"latest",tscircuit:"0.0.3278",core:"0.0.2459",autorouter:"0.0.1153",sourceRevision:"ar-4c80cfe803046da0e8d989a673b8f2193b1b6851-full-immutable-context"}
          ]) {
           const published=await metadata("tscircuit",release.tscircuit)
           const core=await metadata("@tscircuit/core",release.core)
           const dependencies={"tscircuit":release.tscircuit,"@tscircuit/core":release.core,"@tscircuit/capacity-autorouter":release.autorouter,"@tscircuit/core-ddr-benchmark":benchmark}
           for(const name of ["@tscircuit/checks","@tscircuit/props","circuit-json","@tscircuit/fanout-solver"])
            dependencies[name]=exact(published.dependencies[name]??core.devDependencies[name])
           dependencies["@tscircuit/checks"]="0.0.282"
           dependencies["@tscircuit/bus-lanes-solver"]=core.devDependencies["@tscircuit/bus-lanes-solver"]
           await mkdir(release.label,{recursive:true})
           await writeFile(release.label+"/bunfig.toml","[install.lockfile]\nsave = true\n")
           await writeFile(release.label+"/package.json",JSON.stringify({name:"native-ddr-"+release.label,private:true,type:"module",dependencies},null,2))
           await writeFile(release.label+"/index.ts",'export { RootCircuit } from "tscircuit"\n')
           await writeFile(release.label+"/tsconfig.json",await readFile("tsconfig.json"))
           await symlink(path.resolve("lib"),release.label+"/lib","dir")
           await writeFile(release.label+"/published-runtime.json",JSON.stringify({...release,benchmark,tscircuitIntegrity:published.dist.integrity,coreIntegrity:core.dist.integrity,sourceTreeExecuted:true,dependencies},null,2))
          }
          JS
          node prepare-published.private.mjs
          (cd previous && bun install --ignore-scripts --backend=copyfile)
          cp previous/bun.lock latest/bun.lock
          (cd latest && bun install --frozen-lockfile --ignore-scripts --backend=copyfile)
      - uses: actions/download-artifact@v4
        with:
          name: immutable-context-builds
          path: compiled
      - name: Install the actual isolated autorouter builds
        run: |
          cat > install-actual-ar.private.ts <<'TS'
          import {readFileSync,writeFileSync,realpathSync,rmSync,cpSync,statSync} from "node:fs"
          import path from "node:path"
          import {createHash} from "node:crypto"
          const entries = ["previous", "latest"].map(release => realpathSync(Bun.resolveSync("@tscircuit/capacity-autorouter", path.resolve(release))))
          const [baseStat, headStat] = entries.map(entry => statSync(entry))
          if(entries[0] === entries[1] || (baseStat!.dev === headStat!.dev && baseStat!.ino === headStat!.ino)) throw Error("Benchmark runtimes must not share package files")
          for(const [index, release] of ["previous", "latest"].entries()) {
            const entry = entries[index]!
            if(!entry.startsWith(path.resolve(release) + path.sep) || path.basename(entry) !== "index.js") throw Error("Unexpected autorouter entry location: " + entry)
            const destination = path.dirname(entry)
            rmSync(destination, {recursive:true, force:true})
            cpSync(path.resolve("compiled", "ar-" + release, "dist"), destination, {recursive:true})
            console.log(release + " executes actual autorouter source: " + JSON.stringify({entry,sha256:createHash("sha256").update(readFileSync(entry)).digest("hex")}))
          }
          const hashes = entries.map(entry => createHash("sha256").update(readFileSync(entry)).digest("hex"))
          if(hashes[0] === hashes[1]) throw Error("Before and after must execute different autorouter bundles")
          TS
          bun install-actual-ar.private.ts
      - name: Route real TSX circuits through published Core
        env:
          CIRCUIT: ${{ matrix.circuit }}
          RELEASE_ORDER: ${{ matrix.order }}
        run: |
          mkdir -p results
          infrastructure_status=0
          for release in $RELEASE_ORDER; do
            bun "$GITHUB_WORKSPACE/$release/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" --core "$GITHUB_WORKSPACE/$release" --out "$GITHUB_WORKSPACE/results/$release" --circuit "$CIRCUIT" --timeout 1200 > "native-$release.private.log" 2>&1 || infrastructure_status=$?
            cp "$release/published-runtime.json" "results/$release/"
          done
          exit "$infrastructure_status"
      - name: Assess both releases with one validator
        if: always()
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          cat > inspect-published.private.ts <<'TS'
          import {readFileSync,writeFileSync,existsSync,mkdirSync,realpathSync,readdirSync} from "node:fs"
          import path from "node:path"
          import {createHash} from "node:crypto"
          const checks=await import(path.resolve("latest/node_modules/@tscircuit/checks/dist/index.js"))
          const assessmentScript=path.resolve("latest/node_modules/@tscircuit/core-ddr-benchmark/scripts/assess.ts")
          const circuitName=process.env.CIRCUIT
          mkdirSync("metrics",{recursive:true})
          for(const release of ["previous","latest"]) {
           const root=path.resolve("results",release)
           if(!existsSync(root+"/results.json"))throw Error("Missing native render results "+release)
           const report=JSON.parse(readFileSync(root+"/results.json","utf8"))
           const published=JSON.parse(readFileSync(root+"/published-runtime.json","utf8"))
           for(const row of report.cases) {
            const dir=path.join(root,row.circuit)
            const circuitFile=dir+"/circuit.json"
            if(!existsSync(circuitFile))throw Error("Missing Circuit JSON "+release)
            const circuit=JSON.parse(readFileSync(circuitFile,"utf8"))
            const reassessment=Bun.spawnSync([process.execPath,assessmentScript,path.resolve("latest"),row.circuit,dir],{stdout:"pipe",stderr:"pipe",timeout:120000})
            if(reassessment.exitCode!==0)throw Error("Shared-validator reassessment failed")
            const assessment=JSON.parse(readFileSync(dir+"/assessment.json","utf8"))
            const physicalFindings=Object.entries(assessment.findings).filter(([name])=>!["missing_traces","disconnected_ports"].includes(name)).reduce((sum,[,count])=>sum+Number(count),0)
            const options={minClearance:0}
            const zeroClearance=Object.fromEntries(Object.entries({trace_overlap:checks.checkEachPcbTraceNonOverlapping(circuit,options),pad_trace:checks.checkPadTraceClearance(circuit,options),via_trace:checks.checkViaTraceClearance(circuit,options),via_pad:checks.checkViaPadClearance(circuit,options)}).map(([kind,errors])=>[kind,errors.filter(e=>e.type.endsWith("_error")).length]))
            const releaseRoot=path.resolve(release)
            const coreEntry=Bun.resolveSync("@tscircuit/core",path.dirname(realpathSync(Bun.resolveSync("tscircuit",releaseRoot))))
            const executedAr=Bun.resolveSync("@tscircuit/capacity-autorouter",path.dirname(realpathSync(coreEntry)))
            const requestedAr=Bun.resolveSync("@tscircuit/capacity-autorouter",releaseRoot)
            if(realpathSync(executedAr)!==realpathSync(requestedAr))throw Error("Published Core did not execute the candidate package")
            const executedAutorouterSha256=createHash("sha256").update(readFileSync(executedAr)).digest("hex")
            const dependencies=Object.fromEntries(["tscircuit","@tscircuit/core","@tscircuit/capacity-autorouter","@tscircuit/bus-lanes-solver","@tscircuit/fanout-solver","@tscircuit/checks","@tscircuit/props","circuit-json"].map(name=>[name,JSON.parse(readFileSync(path.resolve(release,"node_modules",name,"package.json"),"utf8")).version]))
            if(dependencies.tscircuit!==published.tscircuit||dependencies["@tscircuit/core"]!==published.core||dependencies["@tscircuit/capacity-autorouter"]!==published.autorouter)throw Error("Unexpected installed routing versions")
            const errors=row.progress?.errors??[]
            const errorText=errors.join(" ")
            const reason=/time.?out|iteration/i.test(errorText)?"search_limit":/path|region|graph/i.test(errorText)?"path_planning":/route|solv/i.test(errorText)?"routing_failure":errors.length?"render_error":row.status==="timeout"?"render_timeout":null
            const phaseInputs=readdirSync(dir).filter(name=>/^phase-[0-9]+-start[.]srj[.]json$/.test(name)).sort().map(file=>{const srj=JSON.parse(readFileSync(path.join(dir,file),"utf8"));return {file,sha256:createHash("sha256").update(JSON.stringify(srj)).digest("hex"),connections:srj.connections.length,obstacles:srj.obstacles.length,tracePaths:srj.traces?.length??0,fixedTracePaths:srj.traces?.filter(trace=>trace.isFixed===true).length??0,traceVias:srj.traces?.flatMap(trace=>trace.route.filter(point=>point.route_type==="via")).length??0,circularObstacles:srj.obstacles.filter(obstacle=>obstacle.shape==="circle").length}})
            const metric={autorouterSourceCommit:release==="previous"?"4c80cfe803046da0e8d989a673b8f2193b1b6851":"4c80cfe803046da0e8d989a673b8f2193b1b6851",phaseInputs,release,sourceRevision:published.sourceRevision,executedAutorouterSha256,comparisonValidatorVersion:dependencies["@tscircuit/checks"],circuit:row.circuit,status:row.status,seconds:row.wallMs/1000,peakRssMb:row.peakRssMb,connected:assessment.connectedNets,requested:assessment.requestedNets,vias:assessment.vias,findings:assessment.findings,geometryErrorCount:assessment.geometryErrors.length,zeroClearance,physicalFindings,validationVersion:dependencies["@tscircuit/checks"],dependencies,fixtureHash:report.fixtureHashes[row.circuit],phases:row.progress?.phases.map(({phase,status,connections,durationMs})=>({phase,status,connections,durationMs})),lastSolver:row.progress?.solverEvents.at(-1)?.solverName,progressErrorCount:errors.length,reason,copperSha256:createHash("sha256").update(JSON.stringify(circuit.filter(p=>p.type==="pcb_trace"||p.type==="pcb_via"))).digest("hex")}
            writeFileSync("metrics/"+row.circuit+"-"+release+".json",JSON.stringify(metric,null,2))
            console.log("NATIVE_NET_COMPARISON_METRICS="+JSON.stringify(metric))
           }
          }
          TS
          bun inspect-published.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ddr-4079-${{ matrix.circuit }}
          path: metrics/*.json
          if-no-files-found: warn

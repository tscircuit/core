name: Preserved phase copper benchmark
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install --ignore-scripts)
          (cd head && bun install --ignore-scripts)
      - name: Fresh base and head with the same fixture and harness
        run: |
          mkdir -p results
          bun head/scripts/benchmark-preserved-phase-copper.ts base/index.ts results/base.json || true
          bun head/scripts/benchmark-preserved-phase-copper.ts head/index.ts results/head.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-phase-copper-comparison
          path: results/
          retention-days: 30

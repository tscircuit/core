name: Verify timing-space candidate selection on the full H616 board
on:
  push:
    branches: [analysis/ddr-native-constraints-20261125]
    paths: [.github/workflows/native-mean-goals-diagnostic.yml]
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        board: [h616]
        solver: [01212d0e75d7a2cf865e81e79ab0b77beb8b1e4f, 9db98e9c84cf25e7f4545c8c5c5df31403c71b68]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: analysis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a46f1fcd25e11275ddc47c6109ee3c5f2d3eb614
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ matrix.solver }}
          path: bus
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install isolated actual source builds
        run: |
          cd bus
          bun install --ignore-scripts --backend=copyfile
          bunx tsup
          cd ..
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('core/package.json');s=json.loads(p.read_text())
          s['devDependencies'].update({'@tscircuit/checks':'0.0.283','@tscircuit/props':'0.0.746','circuit-json':'0.0.562','@tscircuit/core-ddr-benchmark':'github:ShiboSoftwareDev/core-ddr-benchmark#b9fec770c4a6df0876e91939aa3dd03eb01c3201'})
          p.write_text(json.dumps(s,indent=2)+'\n')
          PY
          cd core
          bun install --ignore-scripts --backend=copyfile
          cp -r ../bus/dist/. node_modules/@tscircuit/bus-lanes-solver/dist/
          cp ../analysis/diagnose-native-mean-goals.ts .
          sha256sum node_modules/@tscircuit/bus-lanes-solver/dist/index.js node_modules/@tscircuit/capacity-autorouter/dist/index.js
      - name: Measure unchanged requirements and budget; export aggregates only
        working-directory: core
        run: |
          export BUN_OPTIONS="--preload $PWD/diagnose-native-mean-goals.ts"
          bun scripts/benchmark-ddr/run.ts --out ../results --circuit '${{ matrix.board }}' --timeout 120 > ../private-run.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          for c in json.loads(Path('../results/results.json').read_text())['cases']:
              a=c['assessment']
              goals=[{k:d.get(k) for k in ['name','status','actualSkewMm','maxLengthSkew','marginMm']} for d in a['ddrConstraints'] if not d.get('assessmentOnly') and d.get('severity','error')=='error']
              print('TUNING_BANK_RESULT='+json.dumps({'board':c['circuit'],'connected':a['connectedNets'],'requested':a['requestedNets'],'findings':a['findings'],'goals':goals,'attempts':c['attempts'],'wallMs':c['wallMs'],'peakRssMb':c['peakRssMb']},separators=(',',':')))
          PY

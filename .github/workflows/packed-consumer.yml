name: Packed Consumer Smoke Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install and render the packed artifact outside the checkout
        run: node scripts/smoke-tests/test-packed-consumer.mjs

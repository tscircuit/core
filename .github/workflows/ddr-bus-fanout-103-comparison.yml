name: Compare embedded fanout revisions on native DDR completion
on:
  push:
    branches: [analysis/ddr-3277-completion-20261122-1035]
    paths: [.github/workflows/ddr-bus-fanout-103-comparison.yml]
permissions:
  contents: read
jobs:
  benchmark:
    name: Native ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        circuit: [a64, h3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee7bcfe5d5b36dbc57d3b9b46389c590bea8573e
          path: core-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ee7bcfe5d5b36dbc57d3b9b46389c590bea8573e
          path: core-head
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: 69e2159483e062013728cd8ff256f9343224a90b
          path: bus-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: 69e2159483e062013728cd8ff256f9343224a90b
          path: bus-head
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Build baseline and current published fanout in isolated bus packages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('bus-head/package.json')
          package=json.loads(p.read_text())
          package['devDependencies']['@tscircuit/fanout-solver']='0.0.103'
          p.write_text(json.dumps(package,indent=2)+'\n')
          PY
          for revision in base head;do
            (cd "bus-$revision" && bun install --ignore-scripts --backend=copyfile && mkdir -p dist && bun build lib/index.ts --target=node --outfile=dist/index.js)
          done
          cat > inspect-builds.private.ts <<'TS'
          import{readFileSync,realpathSync,statSync,writeFileSync}from"node:fs"
          import{createHash}from"node:crypto"
          import path from"node:path"
          const records=[]
          for(const revision of["base","head"]){
            const root=path.resolve("bus-"+revision)
            const manifest=JSON.parse(readFileSync(root+"/package.json","utf8"))
            const fanoutEntry=realpathSync(Bun.resolveSync("@tscircuit/fanout-solver",root))
            const bundle=realpathSync(root+"/dist/index.js"),stat=statSync(bundle)
            records.push({revision,requestedFanout:manifest.devDependencies["@tscircuit/fanout-solver"],fanoutEntry,fanoutEntrySha256:createHash("sha256").update(readFileSync(fanoutEntry)).digest("hex"),bundle,device:stat.dev,inode:stat.ino,bundleSha256:createHash("sha256").update(readFileSync(bundle)).digest("hex")})
          }
          if(records[0].bundle===records[1].bundle||records[0].inode===records[1].inode||records[0].bundleSha256===records[1].bundleSha256)throw Error("Expected independent, different builds")
          console.log("BUS_BUILD_VERIFICATION="+JSON.stringify(records))
          writeFileSync("bus-build-verification.json",JSON.stringify(records,null,2))
          TS
          bun inspect-builds.private.ts
      - name: Install exact latest routing stack in two independent Core checkouts
        run: |
          cat > prepare.private.mjs <<'JS'
          import{readFileSync,writeFileSync}from"node:fs"
          const response=await fetch("https://registry.npmjs.org/tscircuit/0.0.3278")
          if(!response.ok)throw Error("Missing exact published metadata")
          const published=await response.json()
          for(const revision of["base","head"]){
            const filename="core-"+revision+"/package.json"
            const packageJson=JSON.parse(readFileSync(filename,"utf8"))
            for(const section of["dependencies","devDependencies"])
              for(const name of Object.keys(packageJson[section]??{}))
                if(published.dependencies[name])packageJson[section][name]=published.dependencies[name].replace(/^[~^]/,"")
            Object.assign(packageJson.devDependencies,{"@tscircuit/checks":"0.0.282","@tscircuit/capacity-autorouter":"0.0.1153","@tscircuit/fanout-solver":"0.0.103","@tscircuit/core-ddr-benchmark":"github:ShiboSoftwareDev/core-ddr-benchmark#24dc44c166d4258c3538f8b1f66953f1b6f58690","@tscircuit/bus-lanes-solver":"file:../bus-"+revision})
            writeFileSync(filename,JSON.stringify(packageJson,null,2))
          }
          JS
          node prepare.private.mjs
          for revision in base head;do
            (cd "core-$revision" && bun install --ignore-scripts --backend=copyfile)
          done
      - name: Route identical real boards
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          for revision in base head;do
            bun "core-$revision/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" --core "$GITHUB_WORKSPACE/core-$revision" --out "$GITHUB_WORKSPACE/results-$revision" --circuit "$CIRCUIT" --timeout 1200 > "routing-$revision.private.log" 2>&1
          done
      - name: Assess both with the same validator
        if: always()
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          for revision in base head;do
            test -f "results-$revision/$CIRCUIT/circuit.json"
            bun core-head/node_modules/@tscircuit/core-ddr-benchmark/scripts/assess.ts "$GITHUB_WORKSPACE/core-head" "$CIRCUIT" "$GITHUB_WORKSPACE/results-$revision/$CIRCUIT"
          done
          cat > report.private.ts <<'TS'
          import{readFileSync,readdirSync,writeFileSync,realpathSync}from"node:fs"
          import{createHash}from"node:crypto"
          import path from"node:path"
          const circuit=process.env.CIRCUIT!
          const rows=[]
          for(const revision of["base","head"]){
            const root="results-"+revision
            const assessment=JSON.parse(readFileSync(root+"/"+circuit+"/assessment.json","utf8"))
            const report=JSON.parse(readFileSync(root+"/results.json","utf8"))
            const row=report.cases[0]
            const dir=root+"/"+circuit
            const copper=JSON.parse(readFileSync(dir+"/circuit.json","utf8")).filter(e=>e.type==="pcb_trace"||e.type==="pcb_via")
            const phaseInputs=readdirSync(dir).filter(f=>/^phase-[0-9]+-start[.]srj[.]json$/.test(f)).sort().map(file=>({file,sha256:createHash("sha256").update(JSON.stringify(JSON.parse(readFileSync(dir+"/"+file,"utf8")))).digest("hex")}))
            const entry=realpathSync(Bun.resolveSync("@tscircuit/bus-lanes-solver",path.resolve("core-"+revision)))
            const expected=readFileSync("bus-"+revision+"/dist/index.js")
            if(!readFileSync(entry).equals(expected))throw Error("Core did not resolve the requested bus build")
            const findings=assessment.findings
            const physicalFindings=Object.entries(findings).filter(([key])=>!["missing_traces","disconnected_ports"].includes(key)).reduce((sum,[,count])=>sum+Number(count),0)
            const metric={revision,circuit,connected:assessment.connectedNets,requested:assessment.requestedNets,findings,physicalFindings,geometryErrorCount:assessment.geometryErrors.length,vias:assessment.vias,status:row.status,seconds:row.wallMs/1000,peakRssMb:row.peakRssMb,errors:row.progress?.errors,phases:row.progress?.phases,phaseInputs,fixtureHash:report.fixtureHashes[circuit],copperSha256:createHash("sha256").update(JSON.stringify(copper)).digest("hex"),executedBusSha256:createHash("sha256").update(expected).digest("hex")}
            rows.push(metric);console.log("BUS_FANOUT_103_METRIC="+JSON.stringify(metric))
          }
          writeFileSync("comparison.json",JSON.stringify(rows,null,2))
          TS
          bun report.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-fanout-103-${{ matrix.circuit }}
          path: |
            comparison.json
            bus-build-verification.json
          if-no-files-found: warn

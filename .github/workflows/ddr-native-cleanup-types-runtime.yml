name: Exact native-cleanup Core types and isolated runtime checks
on:
  push:
    branches: [analysis/ddr-3277-completion-20261122-1035]
    paths: [.github/workflows/ddr-native-cleanup-types-runtime.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c294a4356bd609da734754455b03a57f095f5ef
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --backend=copyfile
      - name: Check types on the exact stacked Core head
        run: bunx tsc --noEmit
      - name: Install a separate published baseline runtime
        run: |
          mkdir runtime-base
          cat > runtime-base/package.json <<'JSON'
          {"private":true,"dependencies":{"@tscircuit/capacity-autorouter":"0.0.1156","@tscircuit/bus-lanes-solver":"https://jscdn.tscircuit.com/@tscircuit/bus-lanes-solver/0.0.65.tgz"}}
          JSON
          (cd runtime-base && bun install --ignore-scripts --backend=copyfile)
      - name: Verify actual built implementation and independent package files
        run: |
          cat > verify.private.ts <<'TS'
          import {readFileSync,realpathSync,statSync} from "node:fs"
          import {createHash} from "node:crypto"
          const rows=[]
          for(const [revision,prefix]of[["base","runtime-base/"],["head",""]]){
            const root=prefix+"node_modules/@tscircuit/capacity-autorouter"
            const metadata=JSON.parse(readFileSync(root+"/package.json","utf8"))
            if(metadata.version!==(revision==="head"?"0.0.1156":"0.0.1156"))throw Error("Unexpected runtime version")
            const filename=realpathSync(root+"/dist/index.js"),stat=statSync(filename),source=readFileSync(filename,"utf8")
            if(revision==="head"&&(!source.includes("preservePreloadedPortCapacity")||!source.includes("Native trace routed wire on a forbidden signal layer")))throw Error("Missing native domain implementation")
            rows.push({revision,filename,device:stat.dev,inode:stat.ino,sha256:createHash("sha256").update(source).digest("hex"),version:metadata.version,dependencies:metadata.dependencies})
          }
          if(rows[0].filename===rows[1].filename||(rows[0].device===rows[1].device&&rows[0].inode===rows[1].inode))throw Error("Shared writable runtime files")
          if(rows[0].sha256===rows[1].sha256)throw Error("Candidate package does not differ")
          const busRows=[]
          for(const prefix of["runtime-base/",""]){
            const root=prefix+"node_modules/@tscircuit/bus-lanes-solver";const meta=JSON.parse(readFileSync(root+"/package.json","utf8"));const filename=realpathSync(root+"/dist/index.js"),stat=statSync(filename),source=readFileSync(filename,"utf8");
            if(prefix===""&&!source.includes("setTraceConnectionMetadata"))throw Error("Missing upstream bus metadata");
            busRows.push({prefix,version:meta.version,filename,inode:stat.ino,device:stat.dev,sha256:createHash("sha256").update(source).digest("hex")});
          }
          if(busRows[0].inode===busRows[1].inode&&busRows[0].device===busRows[1].device)throw Error("Shared bus runtime files");
          if(busRows[0].sha256===busRows[1].sha256)throw Error("Bus implementation unchanged");
          console.log("BUS_METADATA_RUNTIME_PROOF="+JSON.stringify(busRows));
          console.log("NATIVE_3279_RUNTIME_PROOF="+JSON.stringify({coreHead:"6c294a4356bd609da734754455b03a57f095f5ef",preview:"https://npm-releases.tscircuit.com/npm-tarballs/45069138665-1/tscircuit-capacity-autorouter-0.0.1156.tgz",rows}))
          TS
          bun verify.private.ts

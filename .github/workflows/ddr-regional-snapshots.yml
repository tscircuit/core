name: Regional repair SVGs and focused checks
on:
  push:
    branches: [artifacts/ddr-regional-contact-snapshots]
permissions:
  contents: read
jobs:
  snapshots:
    name: Snapshot ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: base, ref: 282eee8f7f589b6f4873ae5b5929a7bc559d1a09}
          - {variant: pr, ref: d695617bb96dbee0b6d13a821873c50fad7d57e8}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install test dependencies
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          package=json.loads(p.read_text())
          package['overrides']={**package.get('overrides',{}),'csstype':'3.1.3'}
          p.write_text(json.dumps(package,indent=2)+'\n')
          PY
          bun install
      - run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-a13-regional-repair-shorts.test.ts --timeout 9999999
      - name: Export inspectable SVG and PNG bytes
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cat > export.private.ts <<'TS'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {gzipSync} from 'node:zlib'
          import {Resvg} from '@resvg/resvg-js'
          const svg=readFileSync('tests/repro/__snapshots__/pipeline9-a13-regional-repair-shorts.snap.svg','utf8')
          console.log('REPRO_SVG_GZIP_BASE64='+gzipSync(Buffer.from(svg)).toString('base64'))
          const png=new Resvg(svg,{fitTo:{mode:'width',value:950}}).render().asPng()
          writeFileSync('board.png',png)
          console.log('REPRO_PNG_BASE64='+Buffer.from(png).toString('base64'))
          TS
          bun export.private.ts
      - name: Check existing regional repair regressions
        if: matrix.variant == 'pr'
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/features/pipeline9-srj18-sample2-bounded-regional-drc.test.ts tests/repro/pipeline9-a13-declared-trace-clearance.test.ts --timeout 9999999
      - name: Export changed existing snapshots
        if: always() && matrix.variant == 'pr'
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process'
          import {readFileSync} from 'node:fs'
          import {gzipSync} from 'node:zlib'
          const files=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(p=>p.endsWith('.snap.svg'))
          for(const path of files)console.log('CHANGED_SNAPSHOT_JSON='+JSON.stringify({path,gzip:gzipSync(readFileSync(path)).toString('base64')}))
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-contact-svgs-${{ matrix.variant }}
          path: |
            tests/repro/__snapshots__/
            tests/features/__snapshots__/
            board.png
          retention-days: 14

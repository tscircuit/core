name: Compare structured copper before and after final adapter cleanup
on:
  push:
    branches: [analysis/conventional-native-negotiation-20261123]
    paths: [.github/workflows/ddr-conventional-canonical-cleanup.yml]
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    name: Native ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        circuit: [orangecrab, h3, a64, stmp157, a13, h616, butterstick, glider, imx6, icepi]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dae394c5106033ed8fa5fa08a3f2feb0d548c052
          path: core-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dae394c5106033ed8fa5fa08a3f2feb0d548c052
          path: core-head
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install exact latest routing stack in two independent Core checkouts
        run: |
          cat > prepare.private.mjs <<'JS'
          import{readFileSync,writeFileSync}from"node:fs"
          const response=await fetch("https://registry.npmjs.org/tscircuit/0.0.3279")
          if(!response.ok)throw Error("Missing exact published metadata")
          const published=await response.json()
          for(const revision of["base","head"]){
            const filename="core-"+revision+"/package.json"
            const packageJson=JSON.parse(readFileSync(filename,"utf8"))
            for(const section of["dependencies","devDependencies"])
              for(const name of Object.keys(packageJson[section]??{}))
                if(published.dependencies[name])packageJson[section][name]=published.dependencies[name].replace(/^[~^]/,"")
            Object.assign(packageJson.devDependencies,{"@tscircuit/checks":"0.0.282","@tscircuit/capacity-autorouter":revision==="head"?"https://npm-releases.tscircuit.com/npm-tarballs/45126223337-1/tscircuit-capacity-autorouter-0.0.1159.tgz":"https://npm-releases.tscircuit.com/npm-tarballs/45123653049-1/tscircuit-capacity-autorouter-0.0.1159.tgz","@tscircuit/fanout-solver":"0.0.104","@tscircuit/core-ddr-benchmark":"github:ShiboSoftwareDev/core-ddr-benchmark#24dc44c166d4258c3538f8b1f66953f1b6f58690","@tscircuit/bus-lanes-solver":"https://pkg.pr.new/tscircuit/bus-lanes-solver/@tscircuit/bus-lanes-solver@6f69522"})
            writeFileSync(filename,JSON.stringify(packageJson,null,2))
          }
          JS
          node prepare.private.mjs
          for revision in base head;do
            (cd "core-$revision" && bun install --ignore-scripts --backend=copyfile)
          done
      - name: Record actual solver constructor inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          for revision in ['base','head']:
            p=Path('core-'+revision+'/node_modules/@tscircuit/core-ddr-benchmark/scripts/worker.tsx')
            s=p.read_text()
            anchor='    const { solverParams, solverConstructorArgs, ...metadata } = event'
            assert s.count(anchor)==1
            s=s.replace(anchor,anchor+'''
              if (eventName === "solver:started" && solverParams) {
                const actualInput = solverParams.input ?? solverParams
                if (Array.isArray(actualInput.connections) && Array.isArray(actualInput.obstacles)) {
                  writeFileSync(join(output, "actual-solver-" + progress.solverEvents.length + ".srj.json"), JSON.stringify(actualInput))
                }
              }''')
            p.write_text(s)
          PY
      - name: Route identical real boards
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          for revision in base head;do
            bun "core-$revision/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" --core "$GITHUB_WORKSPACE/core-$revision" --out "$GITHUB_WORKSPACE/results-$revision" --circuit "$CIRCUIT" --timeout 1200 > "routing-$revision.private.log" 2>&1
          done
      - name: Assess both with the same validator
        if: always()
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          for revision in base head;do
            grep -E "NATIVE_LAYER_(STAGE_AUDIT|ROUTE_FILTER)=" "results-$revision/$CIRCUIT/render.log" || true
            test -f "results-$revision/$CIRCUIT/circuit.json"
            bun core-head/node_modules/@tscircuit/core-ddr-benchmark/scripts/assess.ts "$GITHUB_WORKSPACE/core-head" "$CIRCUIT" "$GITHUB_WORKSPACE/results-$revision/$CIRCUIT"
          done
          cat > report.private.ts <<'TS'
          import{readFileSync,readdirSync,writeFileSync,realpathSync}from"node:fs"
          import{createHash}from"node:crypto"
          import path from"node:path"
          import stableStringify from "./core-head/node_modules/fast-json-stable-stringify"
          const circuit=process.env.CIRCUIT!
          const rows=[]
          for(const revision of["base","head"]){
            const root="results-"+revision
            const assessment=JSON.parse(readFileSync(root+"/"+circuit+"/assessment.json","utf8"))
            const report=JSON.parse(readFileSync(root+"/results.json","utf8"))
            const row=report.cases[0]
            const dir=root+"/"+circuit
            const copper=JSON.parse(readFileSync(dir+"/circuit.json","utf8")).filter(e=>e.type==="pcb_trace"||e.type==="pcb_via")
            const phaseInputs=readdirSync(dir).filter(f=>/^phase-[0-9]+-start[.]srj[.]json$/.test(f)).sort().map(file=>({file,sha256:createHash("sha256").update(JSON.stringify(JSON.parse(readFileSync(dir+"/"+file,"utf8")))).digest("hex"),fixedTraces:JSON.parse(readFileSync(dir+"/"+file,"utf8")).traces?.filter(trace=>trace.isFixed).length}))
            const entry=realpathSync(Bun.resolveSync("@tscircuit/bus-lanes-solver",path.resolve("core-"+revision)))
            const expected=readFileSync(entry)
            const autorouterEntry=realpathSync(Bun.resolveSync("@tscircuit/capacity-autorouter",path.resolve("core-"+revision)))
            const groupSource=readFileSync("core-"+revision+"/lib/components/primitive-components/Group/Group.ts")
            const findings=assessment.findings
            const physicalFindings=Object.entries(findings).filter(([key])=>!["missing_traces","disconnected_ports"].includes(key)).reduce((sum,[,count])=>sum+Number(count),0)
            const metric={revision,circuit,connected:assessment.connectedNets,requested:assessment.requestedNets,findings,physicalFindings,geometryErrorCount:assessment.geometryErrors.length,geometryErrors:assessment.geometryErrors,unconnectedNets:assessment.unconnectedNets,vias:assessment.vias,status:row.status,seconds:row.wallMs/1000,peakRssMb:row.peakRssMb,errors:row.progress?.errors,phases:row.progress?.phases,phaseInputs,fixtureHash:report.fixtureHashes[circuit],actualSolverInputs:readdirSync(dir).filter(file=>file.startsWith("actual-solver-")).sort().map(file=>{const input=JSON.parse(readFileSync(dir+"/"+file,"utf8"));return{file,sha256:createHash("sha256").update(JSON.stringify(input)).digest("hex"),fixed:input.traces?.filter(t=>t.isFixed).length,editable:input.traces?.filter(t=>!t.isFixed).length,layerDomains:input.traces?.filter(t=>t.allowedLayers).length}}),rawCopperSha256:createHash("sha256").update(JSON.stringify(copper)).digest("hex"),copperSha256:createHash("sha256").update(stableStringify(copper)).digest("hex"),executedBusSha256:createHash("sha256").update(expected).digest("hex"),executedAutorouterSha256:createHash("sha256").update(readFileSync(autorouterEntry)).digest("hex"),coreGroupSourceSha256:createHash("sha256").update(groupSource).digest("hex"),dependencies:report.dependencies}
            const {geometryErrors,unconnectedNets,errors,...numericMetric}=metric
            rows.push(numericMetric);console.log("NATIVE_TRACE_LAYER_MASK_METRIC="+JSON.stringify(numericMetric))
          }
          function canonical(value: unknown): unknown {
            if(Array.isArray(value))return value.map(canonical)
            if(value&&typeof value==="object")return Object.fromEntries(Object.entries(value).sort(([a],[b])=>a.localeCompare(b)).map(([key,item])=>[key,canonical(item)]))
            return value
          }
          const records=["base","head"].map(revision=>JSON.parse(readFileSync("results-"+revision+"/"+circuit+"/circuit.json","utf8")).filter(e=>e.type==="pcb_trace"||e.type==="pcb_via"))
          for(let index=0;index<rows.length;index++)rows[index].canonicalCopperSha256=createHash("sha256").update(JSON.stringify(canonical(records[index]))).digest("hex")
          const differences:Record<string,number>={}
          function compare(a:unknown,b:unknown,path:string):void{
            if(JSON.stringify(canonical(a))===JSON.stringify(canonical(b)))return
            if(a&&b&&typeof a==="object"&&typeof b==="object"){
              for(const key of new Set([...Object.keys(a),...Object.keys(b)]))compare(a[key],b[key],path+"."+(Array.isArray(a)?"[]":key))
            }else differences[path]=(differences[path]??0)+1
          }
          compare(records[0],records[1],"copper")
          console.log("CANONICAL_COPPER_COMPARISON="+JSON.stringify({circuit,base:rows[0].canonicalCopperSha256,head:rows[1].canonicalCopperSha256,differences}))
          writeFileSync("comparison.json",JSON.stringify(rows,null,2))
          if(rows[0].canonicalCopperSha256!==rows[1].canonicalCopperSha256)throw Error("Structured copper differs after cleanup")
          if(rows.length!==2)throw Error("Incomplete source comparison")
          if(rows[0].fixtureHash!==rows[1].fixtureHash)throw Error("Different real-board fixtures")
          for(const row of rows)if(row.physicalFindings!==0||row.geometryErrorCount!==0)throw Error("Physical or layer finding")
          if(rows[1].connected<rows[0].connected)throw Error("Conventional routing lost connected signals")
          if(circuit==="a13"&&rows[1].connected!==96)throw Error("A13 recovery lost")
          if(circuit==="a64"&&rows[1].connected!==75)throw Error("A64 recovery lost")
          if(circuit==="a64"&&rows[1].connected!==75)throw Error("A64 normal search did not complete")
          if(rows[0].executedAutorouterSha256===rows[1].executedAutorouterSha256)throw Error("New autorouter was not executed")
          if(rows[0].executedBusSha256!==rows[1].executedBusSha256)throw Error("Bus implementation unexpectedly changed")
          writeFileSync("comparison.json",JSON.stringify(rows,null,2))
          TS
          bun report.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-trace-layer-mask-${{ matrix.circuit }}
          path: |
            comparison.json
          if-no-files-found: warn


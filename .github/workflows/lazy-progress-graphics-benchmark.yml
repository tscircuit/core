name: Lazy routing progress comparison
on:
  pull_request:
  workflow_dispatch:
jobs:
  compare:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Compare identical native progress fixtures and routing controls
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_SHA:-c1bf7bc197ba075464e8a71761afe48243b7bd75}"
          git worktree add --detach "$RUNNER_TEMP/progress-base" "$base"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/progress-base/node_modules"
          cp tests/fixtures/get-lazy-progress-graphics-fixture.tsx "$RUNNER_TEMP/progress-base/tests/fixtures/"
          mkdir -p comparison
          bun scripts/benchmark-lazy-progress-graphics.ts "$RUNNER_TEMP/progress-base" comparison/base.json
          bun scripts/benchmark-lazy-progress-graphics.ts . comparison/head.json
          bun scripts/check-lazy-progress-graphics-comparison.ts comparison/base.json comparison/head.json
          mapfile -t controls < scripts/custom-followup-controls.txt
          (cd "$RUNNER_TEMP/progress-base" && bun test "${controls[@]}") > comparison/base-controls.log 2>&1
          bun test "${controls[@]}" > comparison/head-controls.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazy-progress-graphics-comparison
          path: comparison

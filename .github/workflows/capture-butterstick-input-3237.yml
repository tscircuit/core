name: Capture latest native ButterStick remaining-phase input
on:
  push:
    branches: [analysis/butterstick-input-3237]
    paths: [.github/workflows/capture-butterstick-input-3237.yml]
permissions:
  contents: write
jobs:
  benchmark:
    name: Native ${{ matrix.circuit }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {circuit: butterstick, order: "base head"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install exact published stacks and identical native fixtures
        run: |
          cat > prepare-published.private.mjs <<'JS'
          import {mkdir,writeFile,readFile,symlink} from "node:fs/promises"
          import path from "node:path"
          const benchmark="github:ShiboSoftwareDev/core-ddr-benchmark#24dc44c166d4258c3538f8b1f66953f1b6f58690"
          function exact(declared) {
           const version=declared.replace(/^[~^]/,"")
           if(!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(version))throw Error("Expected exact release: "+declared)
           return version
          }
          async function metadata(name,version) {
           const response=await fetch("https://registry.npmjs.org/"+name+"/"+version)
           if(!response.ok)throw Error("Registry request failed: "+name+" "+version+" "+response.status)
           return await response.json()
          }
          for(const release of [
           {label:"head",tscircuit:"0.0.3237",core:"0.0.2419",autorouter:"0.0.1130"}
          ]) {
           const published=await metadata("tscircuit",release.tscircuit)
           const core=await metadata("@tscircuit/core",release.core)
           const dependencies={"tscircuit":release.tscircuit,"@tscircuit/core":release.core,"@tscircuit/capacity-autorouter":release.autorouter,"@tscircuit/core-ddr-benchmark":benchmark}
           for(const name of ["@tscircuit/checks","@tscircuit/props","circuit-json","@tscircuit/fanout-solver"])
            dependencies[name]=exact(published.dependencies[name]??core.devDependencies[name])
           dependencies["@tscircuit/bus-lanes-solver"]=core.devDependencies["@tscircuit/bus-lanes-solver"]
           await mkdir(release.label,{recursive:true})
           await writeFile(release.label+"/package.json",JSON.stringify({name:"native-ddr-"+release.label,private:true,type:"module",dependencies},null,2))
           await writeFile(release.label+"/index.ts",'export { RootCircuit } from "tscircuit"\n')
           await writeFile(release.label+"/tsconfig.json",await readFile("tsconfig.json"))
           await symlink(path.resolve("lib"),release.label+"/lib","dir")
           await writeFile(release.label+"/published-runtime.json",JSON.stringify({...release,benchmark,tscircuitIntegrity:published.dist.integrity,coreIntegrity:core.dist.integrity,sourceTreeExecuted:false,dependencies},null,2))
          }
          JS
          node prepare-published.private.mjs
          (cd head && bun install --ignore-scripts)
      - name: Verify the autorouter module actually resolved by published Core
        run: |
          cat > resolve-runtime.private.ts <<'TS'
          import path from "node:path"
          import {readFileSync,realpathSync} from "node:fs"
          import {createHash} from "node:crypto"
          const root=path.resolve("head")
          const tscircuit=Bun.resolveSync("tscircuit",root)
          const core=Bun.resolveSync("@tscircuit/core",path.dirname(realpathSync(tscircuit)))
          const ar=Bun.resolveSync("@tscircuit/capacity-autorouter",path.dirname(realpathSync(core)))
          const manifest=Bun.resolveSync("@tscircuit/capacity-autorouter/package.json",path.dirname(realpathSync(core)))
          const requested=Bun.resolveSync("@tscircuit/capacity-autorouter",root)
          console.log("EXECUTED_MODULE="+JSON.stringify({version:JSON.parse(readFileSync(manifest,"utf8")).version,autorouterSha:createHash("sha256").update(readFileSync(ar)).digest("hex"),rootModuleIsExecuted:realpathSync(ar)===realpathSync(requested),core,ar,rootAutorouter:requested}))
          TS
          bun resolve-runtime.private.ts
      - name: Render the real byte phases and capture Core's remaining routing request
        run: |
          cp -a "$(readlink -f head/node_modules/@tscircuit/core-ddr-benchmark)" native-fixture
          python3 - <<'PY'
          from pathlib import Path
          p=Path("native-fixture/scripts/worker.tsx")
          s=p.read_text()
          marker='    const { solverParams, solverConstructorArgs, ...metadata } = event'
          replacement='''    if (eventName === "solver:started" && event.solverName === "AutoroutingPipelineSolver9_PreloadedTraceGraph") {
                writeFileSync(join(output, "butterstick-native-arm-repro.json"), JSON.stringify({...event.solverParams, circuitJson: circuit.getCircuitJson()}))
              }
          '''+marker
          assert marker in s
          s=s.replace(marker,replacement)
          intercept='''const arFile=Bun.resolveSync("@tscircuit/capacity-autorouter", corePath)
          const ar=await import(arFile)
          const proto=ar.AutoroutingPipelineSolver9_PreloadedTraceGraph.prototype
          const originalOutput=proto.getOutputSimplifiedPcbTraces
          proto.getOutputSimplifiedPcbTraces=function(...args) {
            const traces=originalOutput.apply(this,args)
            writeFileSync(join(output,"actual-autorouter-traces.json"),JSON.stringify(traces))
            return traces
          }
          '''
          s=s.replace('const circuit = new RootCircuit()',intercept+'\nconst circuit = new RootCircuit()')
          p.write_text(s)
          PY
          mkdir -p captured
          bun --tsconfig-override head/tsconfig.json native-fixture/scripts/worker.tsx "$GITHUB_WORKSPACE/head" butterstick "$GITHUB_WORKSPACE/captured" full > capture.private.log 2>&1
          python3 - <<'PY'
          import pathlib,gzip,json,hashlib
          source=pathlib.Path("captured/butterstick-native-arm-repro.json").read_bytes()
          args=json.loads(source)
          args["routedTraces"]=json.loads(pathlib.Path("captured/actual-autorouter-traces.json").read_text())
          args["routedCircuitJson"]=json.loads(pathlib.Path("captured/circuit.json").read_text())
          source=json.dumps(args,separators=(",",":")).encode()
          srj=args["input"]
          print("SOLVER_OPTIONS="+json.dumps(args["options"]))
          print(json.dumps({"connections":len(srj["connections"]),"obstacles":len(srj["obstacles"]),"traces":len(srj.get("traces",[])),"sha256":hashlib.sha256(source).hexdigest()}))
          dest=pathlib.Path("repros/butterstick-fixed-via/butterstick-complete-arm-repro.json.gz")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(gzip.compress(source,mtime=0))
          PY
      - name: Save the unchanged native input on this analysis branch
        run: |
          git config user.name "tscircuit bot"
          git config user.email "githubbot@tscircuit.com"
          git add repros/butterstick-fixed-via/butterstick-complete-arm-repro.json.gz
          git commit -m "Capture exact ButterStick solver arguments from published Core"
          git push origin HEAD:analysis/butterstick-input-3237

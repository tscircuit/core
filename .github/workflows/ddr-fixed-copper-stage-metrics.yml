# Numeric stage metrics only; board geometry and diagnostic records stay on the runner.
name: Locate fixed-copper contacts in the routing pipeline
on:
  push:
    branches: [artifacts/ddr-fixed-copper-stage-metrics]
permissions:
  contents: read
jobs:
  profile:
    name: Stage metrics ${{ matrix.variant }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: base, ref: e3aa8103907e43bf530f4c46572d7abb05f4e726}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: published-ddr-3209-a13
          run-id: 44050671541
          github-token: ${{ github.token }}
          path: captured
      - run: bun install --ignore-scripts
      - name: Count fixed-copper contacts after each actual pipeline stage
        run: |
          cat > stages.private.ts <<'TS'
          import {readFileSync} from 'node:fs'
          import {AutoroutingPipelineSolver9_PreloadedTraceGraph} from './lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph'
          import {getFixedObstacleViolations} from '@tscircuit/repair04'
          import {convertToCircuitJson} from './lib/utils/convertToCircuitJson'
          import {getFixedCopperObstacleIndexes} from './lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/getFixedCopperObstacleIndexes'
          const input=JSON.parse(readFileSync('captured/head/a13/phase-5-start.srj.json','utf8'))
          const represented=new Set<number>()
          convertToCircuitJson(input,[],{originalSrj:input,representedPadObstacleIndexes:represented,includeOriginalConnections:true})
          const fixed=getFixedCopperObstacleIndexes({inputSrj:input,representedPadObstacleIndexes:represented})
          const physical={...input,traces:undefined,defaultObstacleMargin:0,minTraceToPadEdgeClearance:0,minViaEdgeToPadEdgeClearance:0,minTraceToHoleEdgeClearance:0,minPadEdgeToPadEdgeClearance:0,obstacles:input.obstacles.filter((_:unknown,index:number)=>fixed.has(index))}
          function portRoutes(nodes:any[],solver:any):any[] {
            const unique=new Map<string,any>()
            for(const node of nodes)for(const point of node.portPoints) {
              const key=JSON.stringify([point.portPointId,point.z,point.connectionName])
              if(unique.has(key))continue
              unique.set(key,{connectionName:point.connectionName,rootConnectionName:point.rootConnectionName,traceThickness:solver.minTraceWidth,viaDiameter:solver.viaDiameter,route:[{...point},{...point}],vias:[]})
            }
            return [...unique.values()]
          }
          const selectors:Record<string,(solver:any)=>any[]>={
            portPointPathingSolver:s=>portRoutes(s.portPointPathingSolver.getOutput().nodesWithPortPoints,s),
            uniformPortDistributionSolver:s=>portRoutes(s.uniformPortDistributionSolver.getOutput(),s),
            highDensityRouteSolver:s=>s.highDensityRouteSolver.routes,
            highDensityForceImproveSolver:s=>s.highDensityForceImproveSolver.getOutput(),
            highDensityRepairSolver:s=>s.highDensityRepairSolver.getOutput(),
            highDensityStitchSolver:s=>s.highDensityStitchSolver.mergedHdRoutes,
            traceSimplificationSolver:s=>s.traceSimplificationSolver.simplifiedHdRoutes,
            traceWidthSolver:s=>s.traceWidthSolver.getHdRoutesWithWidths(),
            globalDrcForceImproveSolver:s=>s.globalDrcForceImproveSolver.getOutput(),
            pipeline9JointDrcRepairSolver:s=>s.pipeline9JointDrcRepairSolver.getOutput(),
            effortCleanupSolver:s=>s.effortCleanupSolver.getOutput()
          }
          const solver=new AutoroutingPipelineSolver9_PreloadedTraceGraph(input,{cacheProvider:null})
          const started=performance.now()
          let previousContacts=new Map<string,number>()
          while(!solver.solved&&!solver.failed) {
            const index=solver.currentPipelineStepIndex
            const name=solver.getCurrentPhase()
            solver.step()
            if(solver.currentPipelineStepIndex===index||!selectors[name])continue
            const routes=selectors[name]!(solver)
            const violations=getFixedObstacleViolations({srj:physical,routes,traceClearance:0,viaClearance:0})
            const pairs=new Set(violations.map(v=>JSON.stringify([routes[v.routeIndex]!.rootConnectionName??routes[v.routeIndex]!.connectionName,physical.obstacles[v.obstacleIndex]!.connectedTo.slice().sort(),v.kind])))
            const contacts=new Map<string,number>()
            for(const violation of violations) {
              const key=JSON.stringify([routes[violation.routeIndex]!.rootConnectionName??routes[violation.routeIndex]!.connectionName,physical.obstacles[violation.obstacleIndex]!.connectedTo.slice().sort(),violation.kind])
              contacts.set(key,Math.max(contacts.get(key)??0,violation.severity))
            }
            const introduced=[...contacts.keys()].filter(key=>!previousContacts.has(key)).length
            const cleared=[...previousContacts.keys()].filter(key=>!contacts.has(key)).length
            const deepened=[...contacts].filter(([key,severity])=>previousContacts.has(key)&&severity>previousContacts.get(key)!+1e-8).length
            const blockedRoutes=[...new Set(violations.map(v=>v.routeIndex))].map(index=>routes[index])
            const ports=solver.availableSegmentPointSolver.getOutput().flatMap(segment=>segment.portPoints.map(port=>({...port,numericalGap:!!segment.crossesNumericalGap})))
            const byId=new Map(ports.map(port=>[port.segmentPortPointId,port]))
            const nodeById=new Map(solver.capacityNodes.map(node=>[node.capacityMeshNodeId,node]))
            const blockedPortCategories={terminal:0,cramped:0,numericalGap:0,qfpOwner:0,obstacleOwner:0,componentOwner:0,notFound:0}
            for(const route of blockedRoutes){const point=route.route[0];const original=byId.get(point.portPointId)??byId.get(point.portPointId?.split('::')[0])??ports.find(p=>p.availableZ.includes(point.z)&&Math.hypot(p.x-point.x,p.y-point.y)<1e-6);if(point.pcb_port_id)blockedPortCategories.terminal++;if(!original){blockedPortCategories.notFound++;continue;}if(original.cramped)blockedPortCategories.cramped++;if(original.numericalGap)blockedPortCategories.numericalGap++;const owners=original.nodeIds.map(id=>nodeById.get(id));if(owners.some(n=>n?._qfpRegionType))blockedPortCategories.qfpOwner++;if(owners.some(n=>n?._containsObstacle))blockedPortCategories.obstacleOwner++;if(owners.some(n=>n?._isComponentTopologyNode))blockedPortCategories.componentOwner++;}
            const metrics={blockedPortCategories,blockedUniquePorts:new Set(violations.map(v=>v.routeIndex)).size,introducedContactPairCount:introduced,clearedContactPairCount:cleared,deepenedContactPairCount:deepened,phase:name,elapsedSeconds:(performance.now()-started)/1000,routes:routes.length,vias:routes.reduce((n,r)=>n+r.vias.length,0),points:routes.reduce((n,r)=>n+r.route.length,0),wireContactCount:violations.filter(v=>v.kind==='wire').length,viaContactCount:violations.filter(v=>v.kind==='via').length,contactPairCount:pairs.size,maxPenetrationMm:violations.reduce((m,v)=>Math.max(m,v.severity),0)}
            console.log('PIPELINE_COPPER_STAGE_METRICS_JSON='+JSON.stringify(metrics))
            previousContacts=contacts
            if(name==='uniformPortDistributionSolver')break
          }
          if(solver.failed)throw Error('Native A13 pipeline failed')
          TS
          timeout 600s bun stages.private.ts

# Reports only test counts and public failing test names.
name: Qualify component-pad clearance axes
on:
  push:
    branches: [artifacts/repair04-pad-only-grid-checks]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: base, ref: 51dcb6ebad33c0310cf5179c56969d60f98a4548}
          - {variant: head, ref: e2f5337b7cce61627bc74f6f48bc907cb66bac4c}
    name: Repair04 checks ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/repair04
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: |
          bun install
          npm rebuild sharp
      - name: Existing tests
        run: |
          status=0
          bun test --reporter=junit --reporter-outfile=test-results.private.xml > tests.private.log 2>&1 || status=$?
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET,json
          path=pathlib.Path('test-results.private.xml')
          if path.exists():
              root=ET.parse(path).getroot()
              cases=root.findall('.//testcase')
              print('JUNIT_ROOT_METADATA='+json.dumps({'attributes':root.attrib,'suites':[suite.attrib for suite in root.findall('.//testsuite') if int(suite.get('errors','0')) or int(suite.get('failures','0'))]}))
              print('FAILURE_CLASS_COUNTS='+json.dumps({'svgSnapshotFailures':sum(1 for failure in root.findall('.//failure') if any(word in (failure.text or '').lower() for word in ['svg','snapshot'])), 'otherFailures':sum(1 for failure in root.findall('.//failure') if not any(word in (failure.text or '').lower() for word in ['svg','snapshot']))}))
              print('EXISTING_TEST_METRICS_JSON='+json.dumps({'cases':len(cases),'failed':[{'file':case.get('file') or case.get('classname'),'name':case.get('name')} for case in cases if case.find('failure') is not None or case.find('error') is not None]}))
          PY
          python3 - <<'PY'
          import pathlib
          for line in pathlib.Path('tests.private.log').read_text().splitlines():
              text=line.strip()
              words=text.split()
              if text.startswith('(fail)') or (words and words[0].isdigit() and any(word in text for word in [' pass',' fail',' errors',' skip'])):
                  print(text)
              if 'Cannot find module' in text or 'ModuleNotFound' in text or 'TimeoutError' in text:
                  print(text[:240])
          PY
          exit "$status"
      - name: Type checking
        if: always()
        run: bun run typecheck

name: Verify copper-aware graph port reservations
on:
  push:
    branches: [analysis/try-copper-port-reservations]
    paths: [.github/workflows/try-copper-port-reservations.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 12c97d9edbfd3a47c54d1039d3ce6fd86fbb7245
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Check native copper reservations
        run: |
          (cd node_modules/tiny-hypergraph && bun test tests/solver/port-endpoint-reservation.test.ts tests/solver/problem-port-reservation.test.ts tests/solver/initial-route-port-reservation.test.ts)
          bunx tsc --noEmit
      - run: bun run build
      - run: |
          mkdir -p packed
          npm pack --ignore-scripts --pack-destination packed
          cp packed/*.tgz candidate.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: copper-port-candidate
          path: candidate.tgz
  benchmark:
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        circuit: [orangecrab, a64, h616, glider, h3, stmp157, a13, butterstick, imx6, icepi]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fff6c5c012e78cc75c5446348c4d352cdebc1bed
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: copper-port-candidate
          path: candidate
      - name: Install the source-built candidate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("package.json")
          m=json.loads(p.read_text())
          m["devDependencies"]["@tscircuit/capacity-autorouter"]="file:./candidate/candidate.tgz"
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install --ignore-scripts
      - name: Route the actual native TSX circuit
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          bun node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts --core "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/results" --circuit "$CIRCUIT" --timeout 1200
      - name: Report aggregate counts without exporting circuit geometry
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=Path("results/results.json")
          if not source.exists():
            raise RuntimeError("Native worker did not produce a result summary")
          r=json.loads(source.read_text())
          rows=[]
          for case in r["cases"]:
            a=case.get("assessment") or {}
            rows.append({"board":case["circuit"],"coreCommit":r["coreCommit"],"dependencies":r["dependencies"],"status":case["status"],"connected":a.get("connectedNets"),"requested":a.get("requestedNets"),"findings":a.get("findings"),"geometryErrorCount":len(a.get("geometryErrors",[])),"seconds":case["wallMs"]/1000,"peakRssMb":case["peakRssMb"]})
          Path("aggregate.json").write_text(json.dumps(rows,indent=2))
          print("CANONICAL_AGGREGATE="+json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-port-aggregate-${{ matrix.circuit }}
          path: aggregate.json

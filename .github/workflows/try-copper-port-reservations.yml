name: Verify STM32MP157 and measure native via space in the existing planner
on:
  push:
    branches: [analysis/canonical-native-diagnostics]
    paths: [.github/workflows/try-copper-port-reservations.yml]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: via
            source: 3ce89e028b350166adfc416793a702212e6fd793
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Check native copper reservations
        run: |
          (cd node_modules/tiny-hypergraph && bun test tests/solver/port-endpoint-reservation.test.ts tests/solver/problem-port-reservation.test.ts tests/solver/initial-route-port-reservation.test.ts)
          bunx tsc --noEmit
      - name: Measure aggregate DRC counts after each routing stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts")
          p.write_text(p.read_text()+"\n// Analysis-only stage counts; no route coordinates or net identifiers are logged.\nimport { evaluateRelaxedDrc as evaluateNativeStageDrc } from \"lib/testing/evaluate-relaxed-drc\"\nconst nativeStageStep = AutoroutingPipelineSolver9_PreloadedTraceGraph.prototype._step\nAutoroutingPipelineSolver9_PreloadedTraceGraph.prototype._step = function (): void {\n  const stageIndex = this.currentPipelineStepIndex\n  const stage = this.pipelineDef[stageIndex]?.solverName\n  nativeStageStep.call(this)\n  if (this.currentPipelineStepIndex === stageIndex || !stage) return\n  if (stage === \"portPointPathingSolver\") {\n    const tiny = this.portPointPathingSolver![\"tinyPipelineSolver\"].getSolvedTinySolver()\n    const fractions = Array.from(tiny.topology.regionViaAreaFraction ?? [])\n    console.log(\"NATIVE_VIA_SITE_COUNTS=\" + JSON.stringify({\n      regionCount: fractions.length,\n      penalizedRegionCount: fractions.filter((value) => value < 1).length,\n      minFraction: Math.min(1, ...fractions),\n    }))\n  }\n  const measuredStages = new Set([\n    \"highDensityRouteSolver\", \"highDensityForceImproveSolver\",\n    \"highDensityRepairSolver\", \"highDensityStitchSolver\",\n    \"traceSimplificationSolver\", \"traceWidthSolver\",\n    \"globalDrcForceImproveSolver\", \"pipeline9JointDrcRepairSolver\",\n    \"effortCleanupSolver\", \"lengthMatchingPostProcessingSolver\",\n    \"powerTraceExpansionSolver\",\n  ])\n  if (!measuredStages.has(stage)) return\n  const instance = (this as any)[stage]\n  let hdRoutes: HighDensityRoute[] = []\n  let routedTraces: SimplifiedPcbTraces\n  if (stage === \"powerTraceExpansionSolver\") {\n    routedTraces = instance.getOutput()\n  } else {\n    if (stage === \"highDensityRouteSolver\") hdRoutes = instance.routes\n    else if (stage === \"highDensityStitchSolver\") hdRoutes = instance.mergedHdRoutes\n    else if (stage === \"traceSimplificationSolver\") hdRoutes = instance.simplifiedHdRoutes\n    else if (stage === \"traceWidthSolver\") hdRoutes = instance.getHdRoutesWithWidths()\n    else if (stage === \"lengthMatchingPostProcessingSolver\") hdRoutes = instance.getOutput().hdRoutes\n    else hdRoutes = instance.getOutput()\n    routedTraces = convertPipeline7HdRoutesToSimplifiedPcbTraces({\n      connections: this.netToPointPairsSolver!.newConnections,\n      originalConnections: this.originalSrj.connections,\n      hdRoutes: canonicalizePipeline9HdRoutes(hdRoutes),\n      layerCount: this.srj.layerCount,\n      obstacles: this.srj.obstacles,\n      defaultViaHoleDiameter: this.viaHoleDiameter,\n      connMap: this.connMap,\n    })\n  }\n  const input = this.originalSrj\n  const { errors } = evaluateNativeStageDrc({\n    inputSrj: input,\n    srjWithPointPairs: this.srjWithPointPairs!,\n    routedTraces,\n    drcOptions: {\n      includeTraceContinuity: false,\n      traceClearance: input.minTraceToPadEdgeClearance,\n      viaClearance: input.minPadEdgeToPadEdgeClearance,\n      viaToPadClearance: input.minViaEdgeToPadEdgeClearance,\n      holeClearance: input.minTraceToHoleEdgeClearance,\n    },\n  })\n  const counts: Record<string, number> = {}\n  for (const error of errors) counts[error.type] = (counts[error.type] ?? 0) + 1\n  console.log(\"NATIVE_STAGE_COUNTS=\" + JSON.stringify({ stage, routeCount: routedTraces.length, counts }))\n}\n")
          PY
      - run: bun run build
      - run: |
          mkdir -p packed
          npm pack --ignore-scripts --pack-destination packed
          cp packed/*.tgz candidate.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: copper-port-candidate-${{ matrix.variant }}
          path: candidate.tgz
  benchmark:
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        include:
          - variant: via
            circuit: imx6
          - variant: via
            circuit: icepi
          - variant: via
            circuit: a64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fff6c5c012e78cc75c5446348c4d352cdebc1bed
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: copper-port-candidate-${{ matrix.variant }}
          path: candidate
      - name: Install the source-built candidate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("package.json")
          m=json.loads(p.read_text())
          m["devDependencies"]["@tscircuit/capacity-autorouter"]="file:./candidate/candidate.tgz"
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install --ignore-scripts
      - name: Route the actual native TSX circuit
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          bun node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts --core "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/results" --circuit "$CIRCUIT" --timeout 1200
      - name: Report aggregate counts without exporting circuit geometry
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for log in Path("results").rglob("render.log"):
            for line in log.read_text().splitlines():
              if line.startswith(("NATIVE_STAGE_COUNTS=","NATIVE_FAILURE_COUNTS=","NATIVE_VIA_SITE_COUNTS=")):
                print(line)
          source=Path("results/results.json")
          if not source.exists():
            raise RuntimeError("Native worker did not produce a result summary")
          r=json.loads(source.read_text())
          rows=[]
          for case in r["cases"]:
            a=case.get("assessment") or {}
            progress=case.get("progress") or {}
            print("FAILURE_STAGES="+json.dumps([{"phase":p["phase"],"status":p["status"],"solver":p["solver"],"connections":p["connections"]} for p in progress.get("phases",[])]))
            import re
            errors=[re.sub(r"(source_net|source_trace|pcb_port|cmn)_?[A-Za-z0-9_-]+","<id>",e) for e in progress.get("errors",[])]
            print("FAILURE_CAUSE="+json.dumps(errors))
            rows.append({"board":case["circuit"],"coreCommit":r["coreCommit"],"dependencies":r["dependencies"],"status":case["status"],"connected":a.get("connectedNets"),"requested":a.get("requestedNets"),"findings":a.get("findings"),"geometryErrorCount":len(a.get("geometryErrors",[])),"seconds":case["wallMs"]/1000,"peakRssMb":case["peakRssMb"]})
          Path("aggregate.json").write_text(json.dumps(rows,indent=2))
          print("CANONICAL_AGGREGATE="+json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-port-aggregate-${{ matrix.variant }}-${{ matrix.circuit }}
          path: aggregate.json


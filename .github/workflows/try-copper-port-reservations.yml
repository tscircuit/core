name: Isolate A03 dependency behavior on the inherited board regression
on:
  push:
    branches: [analysis/canonical-native-diagnostics]
    paths: [.github/workflows/try-copper-port-reservations.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pinned-baseline
            revision: 85ee23a25403bbb79be14b6d0783e592928a85a0
          - variant: pinned-with-terminal-fixes
            revision: a834a9e96cbb0d03c34b614ddd834dc4b5c460af
          - variant: upstream-with-terminal-fixes
            revision: 6b715be6f5f8e583c4716ecf21bc57a1523addc6
    env:
      A03_REVISION: ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea6eff630cc92813b4817cad3da1ac0f9c820090
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Select the dependency under test
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("package.json")
          package=json.loads(p.read_text())
          package["dependencies"]["@tscircuit/high-density-a01"]="https://codeload.github.com/tscircuit/high-density-a01/tar.gz/"+os.environ["A03_REVISION"]
          p.write_text(json.dumps(package,indent=2)+"\n")
          PY
          bun install
      - name: Run the unchanged physical regression
        run: bun test --timeout 9999999 tests/bugs/bugreport107-board-1726.test.ts

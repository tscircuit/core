name: Isolate native DDR graph reservations and search guidance
on:
  push:
    branches: [analysis/canonical-native-diagnostics]
    paths: [.github/workflows/try-copper-port-reservations.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tiny: [old, new]
    env:
      TINY_REVISION: ${{ matrix.tiny == 'old' && 'e3d90bd3edefa4c13ce4f37bfa8d188699a21877' || '19a1fa1901d828a76b833aef239a739e961ec89e' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: cb37a9a402117a644d149be6d762bac65e2c2bff
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Configure diagnostic source
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("package.json")
          package=json.loads(p.read_text())
          package["dependencies"]["tiny-hypergraph"]="https://codeload.github.com/tscircuit/tiny-hypergraph/tar.gz/"+os.environ["TINY_REVISION"]
          p.write_text(json.dumps(package,indent=2)+"\n")
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalFallbackSolver.ts")
          source=p.read_text()
          old="      staticSegmentValidator,"
          new='      staticSegmentValidator: process.env.DIAG_NATIVE_GUIDANCE === "off" ? undefined : staticSegmentValidator,'
          if old not in source: raise RuntimeError("Missing optional guidance parameter")
          p.write_text(source.replace(old,new,1))
          PY
      - run: bun install
      - name: Check native copper reservations
        run: |
          (cd node_modules/tiny-hypergraph && bun test tests/solver/port-endpoint-reservation.test.ts tests/solver/problem-port-reservation.test.ts tests/solver/initial-route-port-reservation.test.ts)
          bunx tsc --noEmit
      - run: bun run build
      - run: |
          mkdir -p packed
          npm pack --ignore-scripts --pack-destination packed
          cp packed/*.tgz candidate.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: copper-port-candidate-${{ matrix.tiny }}
          path: candidate.tgz
  benchmark:
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    env:
      DIAG_NATIVE_GUIDANCE: ${{ matrix.guidance }}
    timeout-minutes: 50
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        circuit: [h616]
        tiny: [old, new]
        guidance: [off, on]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fff6c5c012e78cc75c5446348c4d352cdebc1bed
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: copper-port-candidate-${{ matrix.tiny }}
          path: candidate
      - name: Install the source-built candidate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("package.json")
          m=json.loads(p.read_text())
          m["devDependencies"]["@tscircuit/capacity-autorouter"]="file:./candidate/candidate.tgz"
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install --ignore-scripts
      - name: Route the actual native TSX circuit
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          bun node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts --core "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/results" --circuit "$CIRCUIT" --timeout 1200
      - name: Report aggregate counts without exporting circuit geometry
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=Path("results/results.json")
          if not source.exists():
            raise RuntimeError("Native worker did not produce a result summary")
          r=json.loads(source.read_text())
          rows=[]
          for case in r["cases"]:
            a=case.get("assessment") or {}
            rows.append({"board":case["circuit"],"coreCommit":r["coreCommit"],"dependencies":r["dependencies"],"status":case["status"],"connected":a.get("connectedNets"),"requested":a.get("requestedNets"),"findings":a.get("findings"),"geometryErrorCount":len(a.get("geometryErrors",[])),"seconds":case["wallMs"]/1000,"peakRssMb":case["peakRssMb"]})
          Path("aggregate.json").write_text(json.dumps(rows,indent=2))
          print("CANONICAL_AGGREGATE="+json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-search-${{ matrix.tiny }}-${{ matrix.guidance }}
          path: aggregate.json

name: Diagnose native copper routing failure
on:
  push:
    branches: [analysis/canonical-native-diagnostics]
    paths: [.github/workflows/try-copper-port-reservations.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: d55cf546deeece4a92139c6a39086e6cce7abc6e
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Check native copper reservations
        run: |
          (cd node_modules/tiny-hypergraph && bun test tests/solver/port-endpoint-reservation.test.ts tests/solver/problem-port-reservation.test.ts tests/solver/initial-route-port-reservation.test.ts)
          bunx tsc --noEmit
      - name: Build with readable solver names for diagnosis
        run: bun scripts/build-solver-workers.ts && bunx tsup --external @tscircuit/core --external circuit-to-svg --format esm --sourcemap
      - run: |
          mkdir -p packed
          npm pack --ignore-scripts --pack-destination packed
          cp packed/*.tgz candidate.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: copper-port-candidate
          path: candidate.tgz
  benchmark:
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        circuit: [h616]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fff6c5c012e78cc75c5446348c4d352cdebc1bed
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: copper-port-candidate
          path: candidate
      - name: Install the source-built candidate
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p=Path("package.json")
          m=json.loads(p.read_text())
          m["devDependencies"]["@tscircuit/capacity-autorouter"]="file:./candidate/candidate.tgz"
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install --ignore-scripts
      - name: Record solver budgets and routing counts
        run: |
          cat > diagnose.ts <<'TS'
          import { AutoroutingPipelineSolver9_PreloadedTraceGraph as Pipeline } from "@tscircuit/capacity-autorouter"
          const step = Pipeline.prototype._step
          Pipeline.prototype._step = function () {
            step.call(this)
            if (!this.failed) return
            const planner: any = this.portPointPathingSolver
            const graph: any = planner?.tinyPipelineSolver?.getSolver("solveGraph")
            if (!graph) return
            const keys = ["ripCount", "neverSuccessfullyRoutedRouteCount", "greedyFinalRouteAttemptCount", "greedyFinalRouteRemainingRouteCount", "greedyFinalRouteMaxIterations", "initialAssignmentCount", "initiallyRoutedRouteCount"]
            const stats = Object.fromEntries(keys.flatMap(key => typeof graph.stats[key] === "number" ? [[key, graph.stats[key]]] : []))
            console.log("NATIVE_ROUTING_COUNTS=" + JSON.stringify({ solver: graph.getSolverName(), iterations: graph.iterations, limit: graph.MAX_ITERATIONS, routes: graph.problem.routeCount, fixedRoutes: Array.from(graph.problem.routeIsFixed ?? []).filter(value => value === 1).length, reservedPorts: Array.from(graph.problem.portReservationNetId ?? []).filter(value => value !== -1).length, neverRouted: graph.getNeverSuccessfullyRoutedRoutes().length, stats }))
          }
          TS
          python3 - <<'PY'
          from pathlib import Path
          p=Path("node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts")
          text=p.read_text()
          old='[process.execPath,"--tsconfig-override"'
          new='[process.execPath,"--preload",strPreload,"--tsconfig-override"'
          if old not in text: raise RuntimeError("worker invocation changed")
          text='const strPreload = '+repr(str(Path("diagnose.ts").resolve()))+';\\n'+text
          p.write_text(text.replace(old,new))
          PY
      - name: Route the actual native TSX circuit
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          bun node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts --core "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/results" --circuit "$CIRCUIT" --timeout 1200
      - name: Report aggregate counts without exporting circuit geometry
        if: always()
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          source=Path("results/results.json")
          if not source.exists():
            raise RuntimeError("Native worker did not produce a result summary")
          r=json.loads(source.read_text())
          rows=[]
          def diagnostic(message):
            text=str(message)
            text=re.sub(r'(?:source_(?:net|trace|port)|pcb_(?:trace|port)|bus_lane)[A-Za-z0-9_:. -]*', '<connection>', text)
            text=re.sub(r'(?<![A-Za-z_])[-+]?\d+(?:\.\d+)?', '<number>', text)
            return text
          for case in r["cases"]:
            a=case.get("assessment") or {}
            rows.append({"board":case["circuit"],"coreCommit":r["coreCommit"],"dependencies":r["dependencies"],"status":case["status"],"connected":a.get("connectedNets"),"requested":a.get("requestedNets"),"findings":a.get("findings"),"geometryErrorCount":len(a.get("geometryErrors",[])),"seconds":case["wallMs"]/1000,"peakRssMb":case["peakRssMb"]})
            progress=case.get("progress") or {}
            rows[-1]["phases"]=[{key:p.get(key) for key in ["phase","stage","solver","status","connections","durationMs"]} for p in progress.get("phases",[])]
            rows[-1]["failureDiagnostics"]=[diagnostic(message) for message in progress.get("errors",[])]
          Path("aggregate.json").write_text(json.dumps(rows,indent=2))
          print("CANONICAL_AGGREGATE="+json.dumps(rows))
          for logfile in Path("results").rglob("render.log"):
            for line in logfile.read_text().splitlines():
              if line.startswith("NATIVE_ROUTING_COUNTS="):
                counts=json.loads(line.split("=",1)[1])
                print("NATIVE_ROUTING_COUNTS="+json.dumps(counts))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper-port-aggregate-${{ matrix.circuit }}
          path: aggregate.json

name: Isolate existing H616 skew-only routing regression
on:
  push:
    branches: [analysis/ddr-native-constraints-20261125]
    paths: [.github/workflows/native-h616-existing-test-ablation.yml]
permissions:
  contents: read
jobs:
  isolate:
    strategy:
      fail-fast: false
      matrix:
        variant: [minimum-cost-only, main-branches, main-surface, main-strategy, main-pending, main-layer-retry]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: 41bba8b19795077927e9f1a00f540e3aa1d9be31
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Isolate production source on the unchanged public fixture
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os,subprocess
          variant=os.environ['VARIANT']
          sources={
            'minimum-cost-only': ('01212d0e75d7a2cf865e81e79ab0b77beb8b1e4f',['lib']),
            'main-branches': ('2718df9b52937392f648612ca4a31d6352b585a5',['lib/route-multi-terminal-buses.ts']),
            'main-surface': ('2718df9b52937392f648612ca4a31d6352b585a5',['lib/route-surface-bridge.ts']),
            'main-strategy': ('2718df9b52937392f648612ca4a31d6352b585a5',['lib/bus-lanes-pipeline-solver.ts','lib/route-generated-signal-sites.ts']),
            'main-pending': ('2718df9b52937392f648612ca4a31d6352b585a5',['lib/pending-lane-certificates.ts','lib/bus-lanes-solver.ts','lib/negotiate-surface-routes.ts']),
          }
          if variant in sources:
              source,paths=sources[variant]
              subprocess.run(['git','fetch','--depth=1','origin',source],check=True)
              subprocess.run(['git','restore','--source='+source,*paths],check=True)
          if variant=='main-layer-retry':
              p=Path('lib/bus-lanes-pipeline-solver.ts');s=p.read_text().replace('if (hasExistingHandoff) target = allowed[this.attempt % allowed.length]','if (false) target = allowed[this.attempt % allowed.length]');p.write_text(s)
          PYCODE
          bun install --ignore-scripts --backend=copyfile
      - name: Require successful route and every existing acceptance check
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/h616-declarative-skew.test.ts

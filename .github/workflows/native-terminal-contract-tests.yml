name: Validate the corrected native terminal copper contract
on:
  push:
    branches: [analysis/core-native-complete-ci]
    paths: [.github/workflows/native-terminal-contract-tests.yml]
permissions:
  contents: read
jobs:
  dependency-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-a01
          ref: 5345f64519951b26b17aab229c9b284ae729d5ab
          persist-credentials: false
      - name: Correct only the emitted terminal copper predicate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/HighDensitySolverA03/HighDensitySolverA03.ts')
          s=p.read_text()
          old="    if (!this.staticSegmentValidator(segment)) return false\n    if (fromZ === toZ) return true\n\n    // A terminal can replace a route point while vias[] retains the grid landing.\n    const terminalMatchesLanding =\n      start.x === gridStart.x &&\n      start.y === gridStart.y &&\n      end.x === gridStart.x &&\n      end.y === gridStart.y\n    if (terminalMatchesLanding) return true\n\n    return this.staticSegmentValidator({\n      ...segment,\n      start: { ...gridStart, z: this.layerToZ.get(fromZ)! },\n      end: { ...gridStart, z: this.layerToZ.get(toZ)! },\n    })\n  }\n"
          new="    if (fromZ === toZ) return this.staticSegmentValidator(segment)\n\n    const viaStart = { ...gridStart, z: start.z }\n    const viaEnd = { ...gridStart, z: end.z }\n    const hasStartStub = start.x !== gridStart.x || start.y !== gridStart.y\n    if (\n      hasStartStub &&\n      !this.staticSegmentValidator({ ...segment, start, end: viaStart })\n    ) {\n      return false\n    }\n    const hasEndStub = end.x !== gridStart.x || end.y !== gridStart.y\n    if (\n      hasEndStub &&\n      !this.staticSegmentValidator({ ...segment, start: viaEnd, end })\n    ) {\n      return false\n    }\n\n    return this.staticSegmentValidator({\n      ...segment,\n      start: viaStart,\n      end: viaEnd,\n    })\n  }\n"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('tests/a03-static-terminal-via-clearance.test.ts')
          s=p.read_text()
          old='      ({ start }) => start.x === terminal.x && start.y === terminal.y,\n    ),\n  ).toBe(true)'
          new='      ({ start }) => start.x === terminal.x && start.y === terminal.y,\n    ),\n  ).toBe(false)'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))

          Path('tests/a03/terminal-landing-check.test.ts').write_text("import { expect, test } from \"bun:test\"\nimport { HighDensitySolverA03 } from \"../../lib/HighDensitySolverA03/HighDensitySolverA03\"\n\ntest(\"static copper checks use the via landing and both emitted terminal stubs\", () => {\n  const props = {\n    nodeWithPortPoints: {\n      capacityMeshNodeId: \"terminal-landings\",\n      center: {x: 0, y: 0},\n      width: 2, height: 2,\n      availableZ: [0, 1],\n      portPoints: [\n        {x:-0.23,y:-0.17,z:0,connectionName:\"signal\"},\n        {x:-0.21,y:-0.16,z:1,connectionName:\"signal\"},\n      ],\n    },\n    highResolutionCellSize: 0.1,\n    highResolutionCellThickness: 8,\n    lowResolutionCellSize: 0.4,\n    traceThickness: 0.1, traceMargin:0.05,\n    viaDiameter:0.3, viaMinDistFromBorder:0,\n  }\n  const reference = new HighDensitySolverA03(props)\n  reference.solve()\n  expect(reference.solved).toBe(true)\n  const route = reference.getOutput()[0]!\n  expect(route.vias).toHaveLength(1)\n  const landing = route.vias[0]!\n  const sameXY = (a:{x:number;y:number},b:{x:number;y:number}):boolean =>\n    Math.abs(a.x-b.x)<1e-9 && Math.abs(a.y-b.y)<1e-9\n  const positions=[...props.nodeWithPortPoints.portPoints,landing]\n  const solver = new HighDensitySolverA03({\n    ...props,\n    staticSegmentValidator:(segment):boolean => {\n      if(segment.start.z!==segment.end.z)\n        return sameXY(segment.start,landing) && sameXY(segment.end,landing)\n      return positions.some(p=>sameXY(p,segment.start)) &&\n        positions.some(p=>sameXY(p,segment.end))\n    },\n  })\n  solver.solve()\n  expect(solver.solved).toBe(true)\n  expect(solver.failed).toBe(false)\n  expect(solver.getOutput()).toEqual(reference.getOutput())\n})\n")
          Path('tests/a03/terminal-layer-check.test.ts').write_text("import {expect,test} from \"bun:test\"\nimport {HighDensitySolverA03} from \"../../lib/HighDensitySolverA03/HighDensitySolverA03\"\n\ntest(\"static copper rejects a forbidden terminal stub on its actual copper layer\",()=>{\n  const solver=new HighDensitySolverA03({\n    ...{\n    nodeWithPortPoints: {\n      capacityMeshNodeId: \"terminal-landings\", center: {x:0,y:0},\n      width:2,height:2,availableZ:[0,1],\n      portPoints:[\n        {x:-0.23,y:-0.17,z:0,connectionName:\"signal\"},\n        {x:-0.21,y:-0.16,z:1,connectionName:\"signal\"},\n      ],\n    },\n    highResolutionCellSize:0.1,highResolutionCellThickness:8,lowResolutionCellSize:0.4,\n    traceThickness:0.1,traceMargin:0.05,viaDiameter:0.3,viaMinDistFromBorder:0,\n  },\n    staticSegmentValidator:(segment):boolean=>{\n      const isLayerZeroWire=segment.start.z===0 && segment.end.z===0\n      const hasLength=segment.start.x!==segment.end.x || segment.start.y!==segment.end.y\n      return !(isLayerZeroWire && hasLength)\n    },\n  })\n  solver.solve()\n  expect(solver.solved).toBe(false)\n  expect(solver.failed).toBe(true)\n})\n")
          PY
          bun install
      - name: Run all original dependency tests and both before-after regressions
        run: BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 9999999
      - run: bun run build
